<script id="splashgate">
/* שער הספלאש — מחליט לפני הצביעה הראשונה. מוצג רק כשאין העדפת
   reduced-motion וכשלא הוצג בסשן הזה. ?splash=0 מכבה, =1 מתעלם
   מהסשן, =force לבדיקה.
   force **מכבד** את reduced-motion: בלעדיו נשארה שכבה חוסמת סטטית. */
(function(){
  var p=new URLSearchParams(location.search), q=p.get("splash");
  var rm=false; try{rm=matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){}
  var seen=false; try{seen=sessionStorage.getItem("vnSplashSeen")==="1";}catch(e){}
  /* ההבחנה: reduced-motion נועד למנוע תנועה שהמשתמש **לא** ביקש.
     הפעלה אוטומטית מכבדת אותו במלואה. אבל force ו-hold מגיעים
     מלחיצה מפורשת על "הפעל את הפתיח" — זו בקשה, ולכן הם עוברים.
     בלי ההבחנה הזו מכונה שבה אפקטי האנימציה כבויים לא יכולה
     להציג את הפתיח לעולם, גם כשמבקשים. */
  var asked = (q==="force"||q==="hold");
  var show = q==="0" ? false : (asked ? true : (rm ? false : (q==="1" ? true : !seen)));
  if(show){
    document.documentElement.classList.add("splash-on");
    try{sessionStorage.setItem("vnSplashSeen","1");}catch(e){}
    /* רשת ביטחון בלתי-תלויה: אם סקריפט הספלאש לא יגיע — והמדריך
       הוא פלט בנייה, כלומר הסקריפטים מופרדים מה-markup — המחלקה
       הייתה נשארת ו-overflow:hidden היה נועל את הדף לצמיתות. */
    /* ה-gate רץ ב-head, לפני ש-.wrap קיים, ולכן אינו יכול להציב
       inert כאן ועכשיו. עד כה הוא רק **הסיר** אותו — אסימטריה
       שבכל נתיב שבו splashjs חסר הותירה את הדף נגיש ל-Tab מתחת
       לווילון, כלומר פוקוס על פקד שאי אפשר לקרוא. */
    document.addEventListener("DOMContentLoaded",function(){
      if(!document.documentElement.classList.contains("splash-on")) return;
      var w=document.querySelector(".wrap"); if(w) w.setAttribute("inert","");
    });
    /* hold ניטרל את רשת הביטחון לגמרי, ודווקא הוא הנתיב היחיד
       שגם מוותר על טיימרי הסגירה. URL עם hold בסימנייה או בוואטסאפ
       היה נועל את הדף לצמיתות אצל מי שפותח אותו. חלון ארוך שומר
       את ערך הניפוי בלי לאפשר נעילה. */
    setTimeout(function(){
      document.documentElement.classList.remove("splash-on");
      var w=document.querySelector(".wrap"); if(w) w.removeAttribute("inert");
    },q==="hold"?30000:6000);
  }
})();
</script>

<style>
/* ==========================================================
   ויאטנם 2026 — מאגר המסע

:root{
  scroll-padding-top:150px;scroll-padding-bottom:calc(var(--navh) + 14px);
  /* פאזה 6: שפת האתר הראשי (VIETNAM/index.html:29). לא כיוון חדש אלא
     מערכת קיימת ומוכחת — סגול מלכותי, לבנדר בהיר, כרטיסים לבנים.
     הסיבה: כיוון D הוכרע על מוקאפ ונסחף פעמיים במימוש; אתר חי אפשר
     למדוד ממנו במקום לפרש אותו. */
  --bg:#f3f0f8;
  --surface:#ffffff;
  --surface-2:#ece7f4;
  --ink:#111827;
  --ink-2:#374151;
  /* --muted של המקור (#6b7280) נותן 4.83 על לבן אבל רק **4.29** על
     הלבנדר — ושם יושבות כל תוויות המקטע. שני טוקנים, לא אחד. */
  --ink-3:#4b5563;           /* על --bg: 6.71 */
  --ink-3-card:#6b7280;      /* על --surface: 4.83 */
  --line:rgba(17,24,39,.12);
  /* גבול פקדים. חייב להיות מוגדר בכל שלושת מצבי הצבע: משתנה חסר הופך
     את border:1px solid var(--x) ללא-חוקי, והקיצור כולו נופל ל-border-style:none. */
  --line-ctl:rgba(17,24,39,.42);
  --line-soft:#e8e3f0;
  /* הסגול ממלא שני תפקידים מנוגדים — טקסט ומילוי — והם מתהפכים
     בכיוונים שונים במצב כהה. טוקן אחד לא יכול לעשות את שניהם; זה
     בדיוק הבאג שתועד כאן על --c-map. */
  --primary-ink:#42276f;     /* טקסט/מספרים · על --bg: 10.64 */
  --primary-fill:#42276f;    /* מילוי · לבן מעליו: 11.99 */
  --primary-on:#ffffff;
  --primary-2:#6c479c;       /* הקצה הבהיר של הגרדיאנט */
  --brand:#42276f;
  --brand-ink:#ffffff;
  --brand-soft:#ece7f4;
  /* זהב: 7.39 על הקצה הכהה, אך רק 4.29 על הבהיר — כלומר תקף שם
     ורק ב-bold מעל 18.66px. לא להשתמש בו בטיפוגרפיה קטנה. */
  --gold:#f5c542;
  --on-header:#ffffff;
  --on-header-2:#e2dbec;     /* אטום במקום opacity:.7 — 5.6 על הבהיר */
  --jade:#0f7c5c;  --jade-on:#ffffff;
  --rose:#991b1b;
  /* ערכי תקן הקישורים של הפרויקט — אינם משתנים. הסגול המותגי חי
     בכרום בלבד ולעולם לא על כפתור פעולה, ולכן אין התנגשות בהקשר. */
  --c-map:#0369a1;   --c-map-soft:rgba(3,105,161,.10);
  --c-map-fill:#0369a1; --c-map-on:#ffffff;
  --c-ride:#0f7c5c;  --c-ride-soft:rgba(15,124,92,.10);
  --c-chat:#6d28d9;  --c-chat-soft:rgba(109,40,217,.10);
  --c-video:#cc0000; --c-video-soft:rgba(204,0,0,.10);
  --c-book:#1e3a5f;  --c-book-soft:rgba(30,58,95,.10);
  --card-edge:var(--line-soft);
  --shadow:0 2px 10px rgba(66,39,111,.10);
  --shadow-lg:0 10px 30px rgba(66,39,111,.20);
  --r:12px;
  --r-sm:10px;
  --r-xs:8px;
  /* מחסנית המערכת כמו באתר הראשי. באייפון זה SF Hebrew — מצוין לעברית
     ועולה אפס. Assistant המוטמע נשאר אחריה כרשת ביטחון אופליין למי
     שאינו אפל. Frank Ruhl Libre ירד. */
  --f-display:-apple-system,BlinkMacSystemFont,"Segoe UI","Assistant",Arial,sans-serif;
  --f-ui:-apple-system,BlinkMacSystemFont,"Segoe UI","Assistant",Arial,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"Segoe UI","Assistant",Arial,sans-serif;
  --gutter:clamp(15px,4vw,28px);
  --navh:0px;
  --sticky-top:0px;
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--f-body);font-size:.97rem;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{padding-bottom:var(--navh)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;inset-inline-start:-9999px;top:0;z-index:99;background:var(--brand);color:var(--brand-ink);padding:11px 18px;font-family:var(--f-ui);font-weight:500}
.skip:focus{inset-inline-start:0}
.en{direction:ltr;unicode-bidi:isolate}
svg.ic{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg.ic-lg{width:21px;height:21px}

/* ---------- סרגל עליון ---------- */
.topbar{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid transparent;transition:border-color .2s}
.topbar.is-stuck{border-bottom-color:var(--line)}
.tb-row{max-width:1140px;margin:0 auto;padding:0 var(--gutter);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
/* הכותרת הסגולה של האתר הראשי. היא הזהות, ולכן אינה מתהפכת במצב
   כהה — רק מה שסביבה. */
.tb-row.r1{padding-top:13px;padding-bottom:14px;background:linear-gradient(135deg,var(--primary-fill),var(--primary-2));
  color:var(--on-header);max-width:none}
.r1-in{max-width:1140px;margin:0 auto;width:100%;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
/* הכותרת היא קישור הביתה שגם מריץ מחדש את הפתיח. ניווט אמיתי ולא
   מתג: שער הספלאש רץ ב-<head> לפני הצביעה הראשונה, ולכן רק טעינה
   נקייה יכולה להציג אותו שוב. */
/* בלי הטיפול הזה הקישור נראה בדיוק כמו טקסט, ואי אפשר לנחש שהוא
   לחיץ — במגע אין hover שיגלה את זה. האייקון הוא הסימן. */
.brand{font-family:var(--f-ui);font-weight:800;font-size:1.08rem;display:inline-flex;align-items:center;gap:8px;
  letter-spacing:-.01em;color:inherit;text-decoration:none;min-height:44px;
  padding:4px 11px 4px 9px;border-radius:999px;
  border:1px solid rgba(255,255,255,.34);background:rgba(255,255,255,.08);
  transition:background .14s,border-color .14s}
.brand:hover{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.6)}
.brand:active{background:rgba(255,255,255,.26)}
.brand .ic{width:16px;height:16px;flex:none;opacity:.95}
/* הזהב תקף רק כאן: 7.39 על הקצה הכהה, אך 4.29 על הבהיר — כלומר
   הוא עובר רק כטקסט גדול ומודגש. לא להשתמש בו בטיפוגרפיה קטנה. */
.brand span{font-weight:800;color:var(--gold);font-size:1.08rem}
.brand .bar{display:none}
/* ספירה לאחור. המספר לבדו קורא "34"; המשפט המלא יושב ב-sr. */
.countdown{width:100%;margin:10px 0 0;display:flex;align-items:baseline;gap:9px;font-size:.84rem;color:var(--on-header-2)}
.countdown b{font-size:2rem;font-weight:800;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.tb-tools{display:flex;gap:7px;align-items:center;margin-inline-start:auto;flex-wrap:wrap}

/* מקטע מחליף — שפה ומטבע */
.seg{display:inline-flex;border:1px solid var(--line-ctl);border-radius:var(--r-xs);background:var(--surface)}
.seg button{
  font-family:var(--f-ui);font-size:.79rem;font-weight:500;color:var(--ink-2);
  padding:6px 11px;border-inline-start:1px solid var(--line-soft);transition:background .13s,color .13s;
}
.seg button:first-child{border-inline-start:none}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.seg button:hover:not([aria-pressed="true"]){background:var(--surface-2);color:var(--ink)}
.iconbtn{
  display:inline-flex;align-items:center;justify-content:center;width:33px;height:33px;
  border:1px solid var(--line-ctl);border-radius:var(--r-xs);color:var(--ink-2);background:var(--surface);
  transition:background .13s,color .13s;
}
/* פקדים שיושבים על הכותרת הסגולה */
.tb-row.r1 .iconbtn{border-color:rgba(255,255,255,.45);color:#fff;background:transparent;border-radius:999px}
.tb-row.r1 .seg{border-color:rgba(255,255,255,.45);background:transparent;border-radius:999px;overflow:hidden}
.tb-row.r1 .seg button{color:#fff;border-inline-start-color:rgba(255,255,255,.3)}
.tb-row.r1 .seg button[aria-pressed="true"]{background:#fff;color:var(--primary-fill)}
.tb-row.r1 .seg button:hover:not([aria-pressed="true"]){background:rgba(255,255,255,.14);color:#fff}
/* טבעת פוקוס על רקע סגול או על תצלום: טבעת בודדת בצבע המותג נעלמת.
   הדפוס הכפול כבר הוכח כאן על .hero-name — מרחיבים את תחולתו. */
.tb-row.r1 :focus-visible,.tile:focus-visible{
  outline:3px solid #fff;outline-offset:2px;box-shadow:0 0 0 6px rgba(0,0,0,.85);border-radius:8px
}
#splash .sp-skip:focus,#splash .sp-skip:focus-visible{
  outline:3px solid #fff;outline-offset:2px;box-shadow:0 0 0 6px rgba(0,0,0,.85);border-radius:999px
}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}

/* מסגרת הטיול: תאריכים, היום, וספירה לאחור */
.tripbar{border-top:1px solid var(--line-soft);background:var(--surface)}
.tripbar-in{max-width:1140px;margin:0 auto;padding:8px var(--gutter);
  display:flex;flex-wrap:wrap;gap:8px 22px;align-items:baseline}
.tb-item{display:flex;align-items:baseline;gap:7px;font-size:.83rem;color:var(--ink-2)}
.tb-item b{font-family:var(--f-ui);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.tb-item .lbl{font-size:.75rem;color:var(--ink-3)}
.tb-count{margin-inline-start:auto;display:flex;align-items:baseline;gap:7px}
.tb-count b{font-family:var(--f-ui);font-weight:600;font-size:1.02rem;color:var(--brand);font-variant-numeric:tabular-nums}
.tb-sep{width:1px;align-self:stretch;background:var(--line-soft)}
@media (max-width:640px){ .tb-count{margin-inline-start:0} }

/* שורת קישורים רשמיים */
.official{border-top:1px solid var(--line-soft);background:var(--surface)}
.official-in{max-width:1140px;margin:0 auto;padding:7px var(--gutter);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.oflink{
  display:inline-flex;align-items:center;gap:7px;font-family:var(--f-ui);font-size:.8rem;font-weight:500;
  color:var(--ink-2);border:1px solid var(--line-ctl);border-radius:var(--r-xs);padding:6px 11px;
  transition:border-color .13s,color .13s;
}
.oflink:hover{border-color:var(--brand);color:var(--brand)}
.oflink svg{color:var(--brand)}
.of-note{font-size:.78rem;color:var(--ink-3);margin-inline-start:auto}

/* ---------- חיפוש + ניווט ---------- */
.tb-row.r2{padding-top:10px;padding-bottom:10px;gap:10px}
.searchbox{
  flex:1 1 260px;display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--line-soft);border-radius:999px;padding:11px 16px;
  box-shadow:var(--shadow);transition:border-color .13s;
}
.searchbox:focus-within{border-color:var(--brand)}
.searchbox input{flex:1;min-width:0;border:none;background:none;font:inherit;color:var(--ink);padding:0}
.searchbox input:focus{outline:none}
.searchbox input::-webkit-search-cancel-button{display:none}
.searchbox input::placeholder{color:var(--ink-3)}
.searchbox .ic{color:var(--ink-3)}
.xbtn{color:var(--ink-3);flex:none;padding:4px;display:flex;border-radius:4px;min-width:25px;min-height:25px;align-items:center;justify-content:center}
.xbtn:hover{color:var(--rose)}
.tabs{display:flex;gap:2px}
.tab{
  font-family:var(--f-ui);font-size:.85rem;font-weight:500;color:var(--ink-2);
  padding:8px 13px;border-radius:var(--r-xs);display:inline-flex;gap:7px;align-items:center;
  transition:background .13s,color .13s;
}
.tab:hover{background:var(--surface-2);color:var(--ink)}
/* m-3: הפרש הרקע היה 1.10:1 בלבד — כלומר המצב הפעיל היה מסומן בצבע
   ובמשקל בלבד. הפס התחתון הוא הסימן שאינו תלוי בתפיסת צבע, ושורד
   גם קריאה באור שמש ישיר. */
.tab[aria-current="page"]{background:var(--surface-2);color:var(--ink);font-weight:600;
  box-shadow:inset 0 -3px 0 0 var(--brand)}
.tab .cnt{font-size:.76rem;color:var(--ink-3);font-weight:400}

/* ---------- גוף ---------- */
main{max-width:1140px;margin:0 auto;padding:8px var(--gutter) 64px}
/* יעד פוקוס תכנותי בלבד, לא נגיע אליו ב-Tab — טבעת סביב כל הדף רק מפריעה */
main:focus,main:focus-visible{outline:none}
/* פותח פרק, לא כותרת קטנה. הטווח 01–05 הוא סדר המסלול מצפון לדרום,
   כלומר מידע שהקורא צריך ולא קישוט. */
.sec-head{
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  font-family:var(--f-display);font-weight:700;font-size:clamp(1.5rem,4vw,2.1rem);
  line-height:1.05;letter-spacing:-.015em;
  margin:52px 0 18px;padding-bottom:12px;border-bottom:1px solid var(--ink);
}
.sec-head .cnt{
  font-family:var(--f-body);font-size:.86rem;font-weight:400;color:var(--ink-3);
  margin-inline-start:auto;letter-spacing:0;
}
.sec-head .range{font-family:var(--f-ui);font-size:.92rem;font-weight:500;
  color:var(--ink-3);letter-spacing:.02em;font-variant-numeric:tabular-nums}

/* בלוקי לוח-התחנה, המדף האופקי והחשיפה המדורגת הוסרו יחד עם
   הפונקציות שייצרו אותם. הראוטר מנתב הכל ל-screenSplit. */
/* ---------- עמוד תחנה ---------- */
.hero{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:4px}
.hero-txt{position:absolute;inset-block-end:0;inset-inline:0;padding:72px 24px 22px;color:#fff;
  background:linear-gradient(to top,rgba(10,13,17,.92),rgba(10,13,17,.64) 55%,rgba(10,13,17,.24))}
.hero-name{font-family:var(--f-display);font-weight:700;font-size:clamp(1.9rem,6vw,3.4rem);line-height:1.02;letter-spacing:-.02em;margin:0;text-wrap:balance;text-shadow:0 2px 22px rgba(0,0,0,.5)}
.hero-name:focus{outline:none}
/* טבעת כפולה: לבן עובד מעל רקע כהה, השחור שסביבו מעל רקע בהיר —
   ואחד מהם תמיד רלוונטי. כאן נוחת הפוקוס בכל מעבר מסך במקלדת,
   והתצלום שמתחת אינו ידוע מראש. --brand אינו אפשרות: הוא נבלע
   בתצלום כהה בבהיר, ובשקיעה בכהה. */
.hero-name:focus-visible{outline:3px solid #fff;outline-offset:3px;
  box-shadow:0 0 0 6px rgba(0,0,0,.85);border-radius:3px}
.hero-sub{font-family:var(--f-ui);font-weight:400;font-size:.9rem;opacity:.88;margin-top:2px}
.backbtn{
  display:inline-flex;align-items:center;gap:7px;font-family:var(--f-ui);font-weight:500;font-size:.85rem;
  color:var(--ink-2);border:1px solid var(--line-ctl);background:var(--surface);
  padding:7px 13px;border-radius:var(--r-xs);margin:2px 0 12px;
}
.backbtn:hover{color:var(--ink);border-color:var(--brand)}
.backbtn svg{transform:scaleX(1)}
:root[dir="rtl"] .backbtn svg,html[dir="rtl"] .backbtn svg{transform:scaleX(-1)}

/* ---------- תצוגה מפוצלת ----------
   הרשימה קבועה בצד, הפרטים מתחלפים לצידה. לא עוזבים את הדף:
   מעבר בין תחנות הוא החלפת התוכן בחלונית אחת, לא ניווט לעמוד חדש. */
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.rail{position:sticky;top:calc(var(--sticky-top) + 8px);max-height:calc(100vh - var(--sticky-top) - 24px);
  display:flex;flex-direction:column;gap:10px;min-height:0}
.rail-head{display:flex;align-items:baseline;gap:8px;padding:2px 10px 6px;
  font-family:var(--f-ui);font-weight:600;font-size:.92rem;border-bottom:1px solid var(--line)}
.rail-tab{
  flex:1;font-family:var(--f-ui);font-size:.82rem;font-weight:500;color:var(--ink-2);
  padding:8px 6px;border-radius:var(--r-xs);display:flex;align-items:center;justify-content:center;gap:6px;
  transition:background .13s,color .13s;
}
.rail-tab:hover{color:var(--ink)}
.rail-tab[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.rail-list{overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:2px;padding-inline-end:2px;min-height:0}
.rail-sect{display:flex;flex-direction:column}
.rail-ul{display:flex;flex-direction:column;gap:2px}
.rail-group{font-family:var(--f-ui);font-size:.74rem;font-weight:600;color:var(--ink-3);
  padding:12px 10px 5px;letter-spacing:.02em}
.rail-item{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-xs);
  text-align:start;width:100%;transition:background .12s;position:relative;
}
.rail-item:hover{background:var(--surface-2)}
.rail-item[aria-current="page"]{background:var(--surface);box-shadow:var(--shadow)}
.rail-item[aria-current="page"]::before{
  content:"";position:absolute;inset-block:9px;inset-inline-start:0;width:3px;
  border-radius:2px;background:var(--stationcolor);
}
.rail-thumb{width:44px;height:34px;border-radius:5px;object-fit:cover;flex:none;background:var(--surface-2)}
.rail-txt{min-width:0;flex:1}
.rail-name{font-family:var(--f-ui);font-weight:500;font-size:.9rem;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-item[aria-current="page"] .rail-name{font-weight:600}
.rail-sub{font-size:.75rem;color:var(--ink-3)}
.rail-n{font-family:var(--f-ui);font-size:.78rem;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}

.detail{min-width:0}
.detail-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  min-height:52vh;text-align:center;color:var(--ink-2);
  border:1px dashed var(--line-ctl);border-radius:var(--r);padding:32px;
}
.detail-empty svg{width:30px;height:30px;color:var(--ink-3)}
.detail-empty b{font-family:var(--f-ui);font-weight:600;font-size:1.05rem;color:var(--ink)}

/* טאבי קטגוריה בתוך חלונית הפרטים */
.cat-tabs{
  display:flex;gap:4px;overflow-x:auto;padding:4px 0 10px;margin-top:18px;
  border-bottom:1px solid var(--line);scrollbar-width:none;
}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{
  font-family:var(--f-ui);font-size:.85rem;font-weight:500;color:var(--ink-2);
  padding:8px 13px;border-radius:var(--r-xs);white-space:nowrap;
  display:inline-flex;align-items:center;gap:7px;transition:background .13s,color .13s;
}
.cat-tab:hover{background:var(--surface-2);color:var(--ink)}
.cat-tab[aria-selected="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.cat-tab .n{font-size:.76rem;font-variant-numeric:tabular-nums}
.cat-panel{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:16px}

@media (max-width:900px){
  /* 268 פיקסלים של כרום מתוך 844 הם 32% מהמסך לפני שרואים תחנה אחת.
     מסגרת הטיול והקישורים הרשמיים אינם החלטות שמקבלים כל שנייה —
     מקומם במסך "מידע", לא קבועים מעל כל גלילה. */
  .tripbar,.official{display:none}
  .split{grid-template-columns:1fr}
  .rail{position:static;max-height:none}
  .rail-list{overflow:visible;max-height:none}
  .split.has-detail .rail{display:none}
  .split:not(.has-detail) .detail{display:none}
}
/* ---------- מפה + גיליון נגרר (נייד בלבד) ----------
   הדסקטופ נשאר מפוצל. כאן המפה ממלאת את המסך והרשימה יושבת בגיליון
   שנגרר לשלושה גבהים, כי בטלפון האגודל מגיע לתחתית ולא לראש. */
#mapPane{display:none}
.sheet-scrim{display:none}
@media (max-width:900px){
  body.mob-map{overflow:hidden}
  body.mob-map main{padding:0;max-width:none}
  #mapPane{
    display:block;position:fixed;inset-block-start:var(--map-top,0);inset-inline:0;
    inset-block-end:0;z-index:1;background:var(--surface-2);
    /* Leaflet מוסיף .leaflet-container לצומת שמוסרים לו, ו-height:100%
       שם דרס את הפריסה מבוססת ה-inset — הפאנל יצא בגובה מסך מלא
       שמתחיל מתחת לסרגל, כלומר תחתיתו נתלתה מחוץ למסך. */
    height:auto;
  }
  .leaflet-container{width:100%;height:100%;font-family:var(--f-body)}
  .mob-sheet{
    /* מעל הניווט התחתון. ב-SNAP[2] הידית נוחתת בתוך 64 הפיקסלים של
       .botnav (z-index 60), כלומר הפקד היחיד שמחזיר את החלונית היה
       בלתי נראה ובלתי לחיץ — באייפון, שהוא מכשיר היעד. */
    position:fixed;inset-inline:0;inset-block-end:0;z-index:70;
    height:92vh;background:var(--surface);
    border-start-start-radius:18px;border-start-end-radius:18px;
    box-shadow:0 -6px 28px rgba(0,0,0,.22);
    display:flex;flex-direction:column;
    transform:translateY(var(--sheet-y,55vh));
    transition:transform .32s cubic-bezier(.2,.8,.25,1);
    touch-action:none;
  }
  .mob-sheet.is-dragging{transition:none}
  .sheet-grip{
    /* היה 19px גובה, מתחת ל-24 של WCAG 2.5.8. 12px מביא ל-28 בלי שינוי מראה. */
    flex:none;padding:12px 0;display:flex;justify-content:center;cursor:grab;
    touch-action:none;
  }
  .sheet-grip::before{
    content:"";width:38px;height:4px;border-radius:99px;background:var(--line-ctl);
  }
  /* touch-action:none על הגיליון חל על כל שרשרת הצאצאים בבדיקת
     הפגיעה, ולכן גלילת מגע בתוך הגוף נחסמה ב-iOS — המכשיר היחיד
     שחשוב כאן. */
  .sheet-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;
    padding:0 var(--gutter) calc(var(--navh) + 18px)}
  /* בתוך הגיליון הרשימה כבר לא דביקה ולא מוגבלת בגובה */
  body.mob-map .rail{position:static;max-height:none}
  body.mob-map .rail-list{overflow:visible;max-height:none}
  body.mob-map .topbar{position:relative;z-index:40;background:var(--bg)}
  .map-pin{
    display:grid;place-items:center;min-width:26px;min-height:26px;border-radius:50%;
    font-family:var(--f-ui);font-weight:600;font-size:.68rem;
    border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.4);
    font-variant-numeric:tabular-nums;
  }
  /* .is-on ו-:focus-visible היו כמעט זהים — סמן שהוא גם נבחר וגם
   ממוקד לא נבדל מסמן שרק נבחר. הנבחר מסומן בטבעת המותג; הפוקוס
   מקבל את הטבעת הדו-גונית שכבר הוכחה מעל תצלום לא ידוע. */
.map-pin.is-on{outline:3px solid var(--brand);outline-offset:2px}
.leaflet-marker-icon:focus-visible{
  outline:3px solid #fff;outline-offset:2px;
  box-shadow:0 0 0 6px rgba(0,0,0,.85);border-radius:50%;
}
}
/* ---------- מזג אוויר והיתכנות ---------- */
.wx{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px 14px;margin-top:14px}
.wx-hd{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.wx-t{font-family:var(--f-ui);font-weight:600;font-size:.98rem}
.wx-tag{font-family:var(--f-ui);font-size:.72rem;font-weight:500;color:var(--ink-2);
  border:1px solid var(--line-ctl);border-radius:var(--r-xs);padding:2px 8px}
.wx-tag.is-live{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.wx-stats{display:flex;flex-wrap:wrap;gap:20px;margin:11px 0 13px}
.wx-stat b{display:block;font-family:var(--f-ui);font-weight:600;font-size:1.08rem;font-variant-numeric:tabular-nums}
.wx-stat span{font-size:.78rem;color:var(--ink-3)}
.wx-rows{display:grid;gap:9px}
.wx-row{display:grid;grid-template-columns:minmax(9em,auto) 1fr auto;gap:12px;align-items:center}
.wx-lab b{display:block;font-family:var(--f-ui);font-weight:500;font-size:.86rem}
.wx-eg{font-size:.73rem;color:var(--ink-3)}
.wx-bar{height:7px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.wx-fill{height:100%;border-radius:99px}
.wx-pct{font-family:var(--f-ui);font-weight:600;font-size:.86rem;font-variant-numeric:tabular-nums;min-width:2.9em;text-align:end}
/* הצבע לעולם לא לבד: יש גם אחוז, גם אורך פס וגם תווית.
   --jade ולא --brand: משהחליף המותג לאדום לכה, "טוב" היה מרונדר אדום
   ונעשה כמעט זהה ל---rose של "גרוע". הירוק נשמר כאן בדיוק לשם כך —
   הוא נושא משמעות, לא זהות מותג. */
.good{color:var(--jade)}       .wx-fill.good{background:var(--jade)}
.fair{color:var(--gold)}       .wx-fill.fair{background:var(--gold)}
.poor{color:var(--rose)}       .wx-fill.poor{background:var(--rose)}
.wx-note{font-size:.79rem;color:var(--ink-3);margin:12px 0 0;max-width:62ch}
.feas{font-family:var(--f-ui);font-weight:600;font-size:.76rem;font-variant-numeric:tabular-nums;
  border:1px solid currentColor;border-radius:var(--r-xs);padding:1px 6px}
/* מישלין: אדום הכוכב לכוכב, ענבר ל-Bib. הטקסט נושא את המשמעות, לא הצבע. */
.sig{font-family:var(--f-ui);font-weight:600;font-size:.72rem;border-radius:var(--r-xs);padding:2px 7px;white-space:nowrap}
.sig-star{background:#8e1b2e;color:#fff}
.sig-bib{background:var(--gold);color:#fff}
:root[data-theme="dark"] .sig-bib{color:#231a06}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sig-bib{color:#231a06}}

.quickbar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 2px}
.qbtn{
  display:inline-flex;align-items:center;gap:8px;font-family:var(--f-ui);font-weight:500;font-size:.85rem;
  background:var(--surface);border:1px solid var(--line-ctl);border-radius:var(--r-xs);padding:9px 15px;
  transition:border-color .13s;
}
.qbtn:hover{border-color:var(--brand)}
.qbtn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}

/* ---------- כרטיס מקום ---------- */
/* ברירת המחדל LTR כי רוב התוכן עדיין אנגלי. כרטיס שיש לו תאום עברי
   מקבל .is-he ומתהפך כולו — טקסט עברי בכרטיס LTR שובר את הפיסוק. */
.pcard.is-he,.rcard.is-he{direction:rtl;text-align:right}
.pcard,.rcard{
  direction:ltr;text-align:left;position:relative;
  background:var(--surface);border:1px solid var(--line-ctl);border-radius:var(--r-sm);
  display:flex;flex-direction:column;gap:4px;transition:border-color .15s;
}
.pcard:hover,.rcard:hover{border-color:var(--brand)}
.pcard{flex:0 0 240px;scroll-snap-align:start;padding:13px 14px 11px}
.rcard{padding:14px 15px 12px}
.rcard-where{direction:rtl;font-family:var(--f-ui);font-size:.76rem;color:var(--ink-3);display:flex;align-items:center;gap:6px}
html[dir="ltr"] .rcard-where{direction:ltr}
.dotc{width:8px;height:8px;border-radius:2px;background:var(--stationcolor);flex:none}
.pcard-h{margin:0;font-family:var(--f-display);font-size:1.06rem;font-weight:700;line-height:1.3}
.pcard-open{text-align:start;padding:0;display:block;width:100%}
.pcard-open::after{content:"";position:absolute;inset:0;border-radius:inherit}
.pcard-open:focus-visible{outline:none}
.pcard-open:focus-visible::after{outline:2px solid var(--brand);outline-offset:-2px}
.pcard-name{font-family:var(--f-ui);font-weight:600;font-size:.94rem;line-height:1.3}
.pcard-why{font-size:.86rem;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pcard-meta{
  display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:auto;padding-top:8px;
  font-family:var(--f-ui);font-size:.79rem;color:var(--ink-2);position:relative;z-index:2;
}
.stars{color:var(--gold);letter-spacing:.05em;font-size:.76rem}
.money{font-weight:600;font-variant-numeric:tabular-nums}
.money.is-free{color:var(--brand)}
.warn{color:var(--rose);font-weight:500}
.fav{
  margin-inline-start:auto;width:30px;height:30px;border-radius:var(--r-xs);
  color:var(--ink-3);display:flex;align-items:center;justify-content:center;flex:none;
  transition:background .13s,color .13s;
}
.fav:hover{background:var(--surface-2);color:var(--rose)}
.fav[aria-pressed="true"]{color:var(--rose)}
.fav[aria-pressed="true"] svg{fill:currentColor}

.reslist{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin-top:12px}
.results-head{font-family:var(--f-ui);font-weight:500;color:var(--ink-2);margin:20px 0 0}
mark{background:var(--brand-soft);color:inherit;border-radius:3px;padding:0 2px;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px;text-decoration-color:var(--brand)}

/* ---------- אריחי נושא ---------- */
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:11px;margin-top:12px}
.topic{
  background:var(--surface);border:1px solid var(--line-ctl);border-radius:var(--r-sm);padding:15px;
  text-align:start;display:flex;flex-direction:column;gap:2px;transition:border-color .15s;
}
.topic:hover:not(:disabled){border-color:var(--brand)}
.topic svg{color:var(--ink-3);margin-bottom:5px}
.topic-n{font-family:var(--f-ui);font-weight:600;font-size:1.3rem;font-variant-numeric:tabular-nums}
.topic-l{font-family:var(--f-ui);font-size:.85rem;color:var(--ink-2)}
.topic:disabled{opacity:.5;cursor:default}

/* ---------- מסך מידע ---------- */
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:12px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 15px}
.fact-l{font-family:var(--f-ui);font-size:.78rem;color:var(--ink-3);margin-bottom:2px}
.fact-v{font-family:var(--f-ui);font-weight:600;font-size:1.12rem;font-variant-numeric:tabular-nums;line-height:1.3}
.fact-s{font-size:.8rem;color:var(--ink-3);margin-top:2px}
.fxline{font-family:var(--f-ui);font-weight:600;font-size:1rem;font-variant-numeric:tabular-nums;direction:ltr;text-align:start}
.notecard{
  background:var(--surface-2);border-radius:var(--r-sm);padding:13px 15px;margin-top:22px;
  font-size:.87rem;color:var(--ink-2);
}
.notecard b{display:block;font-family:var(--f-ui);color:var(--ink);margin-bottom:3px;font-weight:600}
.creditlist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:5px;font-size:.81rem}
.creditlist li{display:flex;flex-wrap:wrap;gap:4px 9px;align-items:baseline;
  padding-block-end:5px;border-block-end:1px solid var(--line-soft)}
.creditlist li:last-child{border-block-end:none}
.cr-st{font-family:var(--f-ui);font-weight:600;color:var(--ink);min-width:9em}
.creditlist a{text-decoration:underline;text-underline-offset:2px;color:var(--ink-2)}
.cr-by{color:var(--ink-3);margin-inline-start:auto}

/* ---------- חלון פרטים ---------- */
dialog{border:none;padding:0;background:transparent;max-width:min(560px,94vw);width:100%;color:var(--ink)}
dialog::backdrop{background:rgba(10,13,17,.52)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);overflow:hidden}
.sheet-hd{padding:18px 20px 0;display:flex;gap:12px;align-items:flex-start}
/* כיוון D: שמות מקומות נושאים את סריף התצוגה, כמו שמות התחנות.
   הם הזהות של הכרטיס, לא תווית ממשק. */
.sheet-ttl{font-family:var(--f-display);font-weight:700;font-size:1.2rem;line-height:1.26;margin:0}
.ttl-he{display:block}
/* הלטיני משני בגודל בלבד, לא בניגודיות — הוא מה שמראים לנהג.
   width:fit-content מצמיד את התיבה לקצה ההתחלה של ההורה ה-RTL,
   בזמן ש-direction:ltr (מ-.en) מסדר רק את התווים בתוכה. בלעדיו
   הבלוק ממלא את הרוחב והשם קופץ לקצה הנגדי מהשם העברי. */
.ttl-en{display:block;width:fit-content;max-width:100%;
  font-family:var(--f-ui);font-size:.95rem;font-weight:500;
  color:var(--ink-2);line-height:1.35;margin-top:3px;
  letter-spacing:.01em;overflow-wrap:anywhere}
.sheet-where{font-family:var(--f-ui);font-size:.81rem;color:var(--ink-3);margin-top:4px;display:flex;align-items:center;gap:6px}
.sheet-acts{margin-inline-start:auto;display:flex;gap:8px;flex:none}
.closebtn,.ttl-copy{width:34px;height:34px;border-radius:var(--r-xs);border:1px solid var(--line-ctl);
  display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink-2)}
.closebtn:hover,.ttl-copy:hover{background:var(--surface-2);color:var(--ink)}
.sheet-bd{padding:13px 20px 20px;display:flex;flex-direction:column;gap:13px}
.sheet-what{color:var(--ink-2)}
.whybox{background:var(--brand-soft);border-radius:var(--r-sm);padding:12px 14px}
.whybox b{display:block;font-family:var(--f-ui);font-size:.77rem;font-weight:600;color:var(--brand);margin-bottom:2px}
.factrow{display:flex;flex-wrap:wrap;gap:9px;font-family:var(--f-ui);font-size:.85rem;color:var(--ink-2);align-items:center}
.map-attr{margin:14px 10px 4px;font-size:.72rem;color:var(--ink-3)}
.map-attr a{text-decoration:underline;text-underline-offset:2px}
.linkrow{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.linkrow>li{display:contents}
/* ---------- תקן צבעי הקישורים ----------
   מתועד ב-PROJECT.md וב-build.py: הצבע מקודד את הפעולה, לא את הקטגוריה.
   כחול=מפות · ירוק=נסיעה/גראב · סגול=וואטסאפ · אדום=יוטיוב.
   הצבע לעולם לא לבד — לכל כפתור יש גם אייקון וגם מילה. */
.lbtn{
  display:inline-flex;align-items:center;gap:7px;font-family:var(--f-ui);font-weight:500;font-size:.85rem;
  border-radius:var(--r-xs);padding:9px 14px;border:1px solid currentColor;
  color:var(--ink-2);transition:background .13s;
}
.lbtn:hover{background:var(--tint,var(--surface-2))}
.act-map  {color:var(--c-map);  --tint:var(--c-map-soft)}
.act-ride {color:var(--c-ride); --tint:var(--c-ride-soft)}
.act-video{color:var(--c-video);--tint:var(--c-video-soft)}
.act-chat {color:var(--c-chat); --tint:var(--c-chat-soft)}
.act-book {color:var(--c-book); --tint:var(--c-book-soft)}
.act-src  {color:var(--ink-3)}
.lbtn.is-primary{background:var(--c-map-fill);color:var(--c-map-on);border-color:var(--c-map-fill)}
.lbtn.is-primary:hover{background:var(--c-map);filter:brightness(1.12)}
.srcline{font-size:.8rem;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.srcline a{text-decoration:underline;text-underline-offset:3px}

/* ---------- דיאלוג ההגדרות ---------- */
/* בדסקטופ הפקדים נשארים בשורה העליונה והכפתור מיותר. */
#settingsBtn{display:none}
#setDlg{max-width:min(420px,94vw)}
#setDlg::backdrop{background:rgba(10,13,17,.52)}
.set-hd{display:flex;align-items:center;gap:12px;
  background:var(--surface);border:1px solid var(--line);border-bottom:none;
  border-radius:var(--r) var(--r) 0 0;padding:16px 18px 12px}
.set-ttl{font-family:var(--f-display);font-weight:700;font-size:1.15rem;margin:0;flex:1}
.set-body{background:var(--surface);border:1px solid var(--line);border-top:none;
  border-radius:0 0 var(--r) var(--r);padding:4px 18px 20px;
  display:flex;flex-direction:column;gap:16px}
/* בתוך הדיאלוג לפקדים יש רוחב מלא — שם אין תחרות על מקום */
.set-body .tb-tools{margin-inline-start:0;flex-direction:column;align-items:stretch;gap:12px}
.set-body .seg{width:100%}
.set-body .seg button{flex:1;text-align:center;padding:11px 10px;min-height:44px}
.set-body #themeBtn{width:100%;min-height:44px;gap:9px}
.set-row-lbl{font-family:var(--f-ui);font-size:.78rem;font-weight:600;color:var(--ink-3);
  margin:0 0 -8px}

@media (max-width:880px){
  /* בנייד זהו השער היחיד לשפה, למטבע ולנושא — והחלפת שפה היא פקד
     נגישות (היא קובעת את lang של המסמך ולכן את קול הקורא). 44×44
     במקום 33×33, והריפוד של השורה מתכווץ כדי לשמור על ≤120px. */
  #settingsBtn{display:inline-flex;width:44px;height:44px}
  .tb-row.r1{padding-top:6px;padding-bottom:6px}
  /* מוסתרים בשורה, אך אותם צמתים עצמם — לא עותק. */
  .topbar .tb-tools{display:none}
  .set-body .tb-tools{display:flex}
}

/* במצב ניגודיות גבוהה של Windows גם box-shadow וגם background
   מבוטלים — כלומר הסימן שאינו-צבע היה נעלם דווקא במצב שנועד לעזור.
   Highlight הוא צבע מערכת ולכן שורד. */
@media (forced-colors:active){
  .tab[aria-current="page"]{border-block-end:3px solid Highlight}
  .bnav[aria-current="page"]::before{background:Highlight;forced-color-adjust:none}
}

/* ---------- מצב "לפי מרחק" ---------- */
.seg-sort{align-self:stretch;margin:0 10px}
.seg-sort button{flex:1;text-align:center;padding:9px 11px;font-size:.84rem}

/* אזור ה-live הוא גם הטקסט הגלוי. שני מקורות אמת נפרדים היו
   מסתדרים זה מזה ומכריזים כפול. */
.near-status{margin:8px 10px 0;font-size:.82rem;color:var(--ink-3);min-height:1em}
.near-status:empty{margin-top:0}
.near-body{display:flex;flex-direction:column;gap:12px;padding:10px 10px 4px;min-height:0;overflow-y:auto}
.near-head{font-family:var(--f-display);font-weight:700;font-size:1.05rem;margin:0}
.near-hint{margin:0;font-size:.79rem;color:var(--ink-3);line-height:1.5}
.near-wait{margin:0;font-size:.95rem;color:var(--ink-2)}
/* המצב הזה הוא מידע ולא כשל — בלי אדום ובלי אייקון שגיאה.
   עד היציאה ב-26/10 זהו המצב הנפוץ ביותר של המסך. */
.near-far{margin:0;font-size:.92rem;color:var(--ink-2);line-height:1.55}
.near-err{margin:0;font-size:.9rem;color:var(--ink);line-height:1.55}
.near-how{margin:0;font-size:.8rem;color:var(--ink-2);line-height:1.6;
  background:var(--surface-2);border-radius:var(--r-xs);padding:10px 12px}
.btn-near{
  font-family:var(--f-ui);font-weight:600;font-size:.9rem;
  background:var(--brand);color:var(--brand-ink);border-radius:var(--r-sm);
  padding:12px 16px;text-align:center;min-height:44px;
}
.btn-near:hover{filter:brightness(1.08)}
.near-pick{display:flex;flex-direction:column;gap:7px;
  border-top:1px solid var(--line-soft);padding-top:12px}
.near-pick-t{margin:0;font-size:.83rem;color:var(--ink-2)}
.near-sel{
  font:inherit;font-size:.9rem;color:var(--ink);background:var(--surface);
  border:1px solid var(--line-ctl);border-radius:var(--r-xs);padding:10px 12px;
  min-height:44px;width:100%;
}
.near-list{display:flex;flex-direction:column;gap:2px}
.near-row{
  display:flex;align-items:center;gap:12px;padding:11px 10px;
  border-radius:var(--r-xs);transition:background .13s;
}
.near-row:hover{background:var(--surface-2)}
/* המרחק ראשון בכיוון הקריאה. tabular-nums כדי שהעמודה לא תרקוד
   בין שורה לשורה — אותו טיפול כמו .money. */
.near-dist{
  flex:none;min-width:62px;font-family:var(--f-ui);font-weight:700;font-size:.86rem;
  color:var(--brand);font-variant-numeric:tabular-nums;
}
.near-txt{min-width:0;flex:1}
/* ל-<bdi> יש dir="auto": שם לטיני הופך את התיבה ל-LTR, ואז היא
   נצמדת לשמאל בעוד שורת המשנה העברית נצמדת לימין. width:fit-content
   מצמיד את התיבה עצמה לקצה ההתחלה של ההורה ה-RTL — אותו פתרון כמו
   ב-.ttl-en. הטקסט בתוכה עדיין נקרא LTR, כפי שצריך. */
.near-name{display:block;width:fit-content;max-width:100%;
  font-family:var(--f-display);font-weight:600;font-size:.98rem;
  line-height:1.25;overflow-wrap:anywhere}
.near-sub{font-size:.76rem;color:var(--ink-3);margin-top:2px}

/* ---------- מסך הפתיחה: ריבועי מידע וקבוצות אזור ---------- */
/* תווית מקטע היא כותרת אמיתית: היא מתייגת את הקבוצה שאחריה.
   בלי uppercase — הוא חסר משמעות בעברית, ו-VoiceOver מאיית בגללו
   מחרוזות לטיניות קצרות אות-אות. letter-spacing ביחידות יחסיות
   ומתחת ל-0.12em, כדי ש-1.4.12 Text Spacing לא ייגזר. */
.sec-label{
  display:flex;align-items:center;gap:10px;margin:24px 0 10px;
  font-family:var(--f-ui);font-size:.78rem;font-weight:800;letter-spacing:.06em;
  color:var(--ink-3);
}
.sec-label .ln{flex:1;height:1px;background:var(--line-soft)}
.sec-label .cnt{font-weight:700;color:var(--primary-ink);background:var(--surface);
  border:1px solid var(--line-soft);border-radius:999px;padding:2px 9px;white-space:nowrap;font-size:.72rem}

/* בלי display:contents: ה-<li> עצמו הוא הכרטיס. WebKit אינו חושף
   אלמנטים כאלה באופן אמין, וזה מכשיר היעד.
   auto-fill במקום שתי עמודות קשיחות — ב-320px שתי עמודות נותנות
   139px לכרטיס, ושערי המטבע נגלשים. */
/* חלוקת האזורים הייתה תווית אפורה דקה בין 14 ריבועי תצלום, ונבלעה
   בגלילה. סרגל מלא וצמוד לראש הופך את הגבול לחד, וגם עונה על
   "באיזה אזור אני עכשיו" בלי לגלול בחזרה. */
.region{margin-top:20px}
.region-hd{
  position:sticky;top:0;z-index:12;
  margin-inline:calc(-1 * var(--gutter));padding:11px var(--gutter);
  display:flex;align-items:center;gap:10px;
  background:var(--primary-fill);color:var(--primary-on);
  font-family:var(--f-ui);font-weight:800;font-size:1.02rem;letter-spacing:-.01em;
  box-shadow:0 2px 8px rgba(66,39,111,.25);
}
.region-hd .cnt{
  margin-inline-start:auto;font-size:.74rem;font-weight:700;
  background:rgba(255,255,255,.2);border-radius:999px;padding:3px 10px;white-space:nowrap;
}
/* הרצועה עצמה מקבלת גוון, כך שהקבוצה נקראת כגוש אחד ולא כרצף. */
.region-body{
  margin-inline:calc(-1 * var(--gutter));padding:14px var(--gutter) 22px;
  background:var(--surface-2);
}
/* סרגל דביק יכול להסתיר ריבוע שמקבל פוקוס — 2.4.11. */
.tile{scroll-margin-top:60px}

.infogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;list-style:none;margin:0;padding:0}
li.icard{list-style:none}
.icard{background:var(--surface);border:1px solid var(--card-edge);border-radius:var(--r);
  box-shadow:var(--shadow);padding:13px 14px 14px;display:flex;flex-direction:column;min-height:104px}
.icard.wide{grid-column:1 / -1;min-height:0}
.icard .k{font-family:var(--f-ui);font-size:.7rem;font-weight:700;letter-spacing:.05em;color:var(--ink-3-card)}
.icard .v{font-size:1.5rem;font-weight:800;color:var(--primary-ink);line-height:1.12;margin-top:5px;
  font-variant-numeric:tabular-nums}
.icard .t{margin-top:auto;padding-top:6px;font-size:.76rem;color:var(--ink-3-card);line-height:1.38}
.icard .t .en{display:block;width:fit-content}
.fxrow{display:flex;gap:18px;flex-wrap:wrap;margin-top:4px}
.fxrow bdi{direction:ltr;unicode-bidi:isolate;font-size:1.02rem;font-weight:800;
  color:var(--primary-ink);font-variant-numeric:tabular-nums}

/* ריבוע תחנה. הטקסט **מחוץ** לתצלום, על כרטיס אטום: טקסט לבן מעל
   14 תצלומים שונים אינו ניתן להבטחה ל-4.5:1, ושכבת הצללה שמבטיחה
   אותו דורשת 54% אטימות שמכבה את התצלום ממילא. ההוצאה פותרת גם את
   טבעת הפוקוס, גם גזירה בזום 200%, וגם מצב ניגודיות גבוהה. */
.tilegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;list-style:none;margin:0;padding:0}
.tile{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--card-edge);
  border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;text-decoration:none;color:inherit;height:100%}
.tile-ph{position:relative;aspect-ratio:4/3;background:var(--surface-2)}
.tile-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile-idx{position:absolute;top:8px;inset-inline-end:8px;min-width:26px;height:26px;padding:0 6px;
  border-radius:8px;background:var(--surface);color:var(--primary-ink);font-weight:800;font-size:.8rem;
  display:grid;place-items:center;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
/* הטקסט נגזר מהטוקן ולא מקובע: --jade מתהפך למנטה בהירה במצב כהה,
   ולבן עליה נותן 1.77. אותו באג שכבר נתפס על .sig-bib. */
.tile-flag{position:absolute;top:9px;inset-inline-start:8px;font-size:.66rem;font-weight:800;
  border-radius:7px;padding:3px 8px;color:var(--jade-on);background:var(--jade)}
.tile-txt{padding:10px 11px 12px;display:flex;flex-direction:column;flex:1}
.tile-nm{font-family:var(--f-ui);font-size:1.02rem;font-weight:800;line-height:1.16;color:var(--ink)}
.tile-lat{direction:ltr;unicode-bidi:isolate;display:block;width:fit-content;
  font-size:.72rem;font-weight:600;color:var(--ink-3-card);margin-top:2px}
.tile-cnt{margin-top:auto;padding-top:8px;font-size:.74rem;font-weight:700;color:var(--primary-ink)}
.tile:hover{border-color:var(--primary-2)}
@media (forced-colors:active){
  .tile-idx,.tile-flag{border:1px solid CanvasText}
}

/* ---------- ניווט תחתון ---------- */
.botnav{display:none}
@media (max-width:880px){
  :root{
  scroll-padding-top:150px;scroll-padding-bottom:calc(var(--navh) + 14px);--navh:64px}
  .tabs{display:none}
  /* ארבע שורות כרום דביקות בולעות חצי מסך בנייד — הניווט התחתון מכסה את הצורך */
  .topbar{position:static}
  .botnav{
    display:flex;position:fixed;inset-inline:0;bottom:0;z-index:60;
    background:var(--surface);border-top:1px solid var(--line);
    padding:5px 4px calc(5px + env(safe-area-inset-bottom));
  }
  .bnav{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    font-family:var(--f-ui);font-size:.68rem;font-weight:500;color:var(--ink-3);padding:6px 2px;border-radius:var(--r-xs)}
  .bnav{position:relative}
  .bnav[aria-current="page"]{color:var(--brand);font-weight:600}
  /* אותו עיקרון בניווט התחתון: פס מעל הפריט, לא רק צבע. */
  .bnav[aria-current="page"]::before{
    content:"";position:absolute;top:0;inset-inline:22%;height:3px;
    border-radius:0 0 3px 3px;background:var(--brand);
  }
  .pcard{flex-basis:212px}
  .of-note{display:none}
}

/* ============ מרחק ומיקום ============
   חישוב מקומי בלבד. הנ"צ כבר בנתונים, ולכן המיון עובד **אופליין** —
   בניגוד למפה, שדורשת אריחים מהרשת. זה מה שהופך את המצב הזה לשימושי
   בדיוק במקום שבו המדריך נחוץ: בשטח, בלי קליטה. */
var R_EARTH=6371;
function haversine(lat1,lng1,lat2,lng2){
  var toRad=Math.PI/180;
  var dLat=(lat2-lat1)*toRad, dLng=(lng2-lng1)*toRad;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2) +
        Math.cos(lat1*toRad)*Math.cos(lat2*toRad)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R_EARTH*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
/* שתי צורות לכל מרחק: מוצגת ומדוברת.
   "ק״מ" עם הגרשיים נקרא ב-VoiceOver עברית אות-אות, ולכן השם המחושב
   מקבל מילה מלאה. */
function fmtDist(km,spoken){
  if(km<1){
    var m=Math.round(km*1000/10)*10;
    return t(spoken?"distMSpoken":"distM",{"%n":String(m)});
  }
  /* מעל 1000 ק"מ מעגלים לעשרות — "6,800" אומר את אותו דבר כמו
     "6804" ונקרא הרבה יותר טוב, במיוחד בהקראה. */
  var n=km<10?Number(km.toFixed(1)):(km<1000?Math.round(km):Math.round(km/10)*10);
  var v=n.toLocaleString(isHe()?"he-IL":"en-GB");
  return t(spoken?"distKmSpoken":"distKm",{"%n":v});
}
/* מעל זה המשתמש אינו בוויאטנם. עד היציאה ב-26/10 זהו המצב הנפוץ
   ביותר של המסך, ולכן הוא מטופל כמידע ולא ככשל. */
var IN_VIETNAM_KM=200;

function nearestFrom(lat,lng,limit){
  var out=[];
  INDEX.forEach(function(it){
    var r=it.rec;
    if(r.lat==null||r.lng==null) return;
    out.push({rec:r,cat:it.cat,station:it.station,key:it.key,
      km:haversine(lat,lng,r.lat,r.lng)});
  });
  out.sort(function(a,b){return a.km-b.km;});
  return limit?out.slice(0,limit):out;
}
function nearestStation(lat,lng){
  var best=null;
  STATIONS.forEach(function(st){
    if(st.lat==null) return;
    var km=haversine(lat,lng,st.lat,st.lng);
    if(!best||km<best.km) best={st:st,km:km};
  });
  return best;
}

function geoSupported(){

     הכפתור לא מרונדר כלל — כפתור מת שלוחצים עליו ולא קורה כלום
     גרוע יותר מהיעדרו. */
  return typeof navigator!=="undefined" && !!navigator.geolocation;
}
function requestGeo(onChange){
  railAnnounce=true;
  if(!geoSupported()){ geo.state="unavailable"; onChange(); return; }
  geo.state="locating"; onChange();
  railAnnounce=true;
  navigator.geolocation.getCurrentPosition(function(pos){
    geo.lat=pos.coords.latitude; geo.lng=pos.coords.longitude; geo.at=Date.now();
    var ns=nearestStation(geo.lat,geo.lng);
    geo.state=(ns&&ns.km>IN_VIETNAM_KM)?"far":"ok";
    geo.far=ns;
    railAnnounce=true; onChange();
  },function(err){
    geo.errCode=err&&err.code;
    geo.state=(geo.errCode===1)?"denied":(geo.errCode===3?"timeout":"unavailable");
    railAnnounce=true; onChange();
  },{
    /* ברירת המחדל של timeout היא Infinity — במנהרה "מאתר…" היה נתקע
       לנצח בלי שום מצב סיום ובלי הכרזה נוספת. */

  });
}

/* ============ צבע תחנה קריא ============ */
function hexToRgb(h){h=h.replace("#","");return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function ch(c){c/=255;return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4);}
function lum(r){return .2126*ch(r[0])+.7152*ch(r[1])+.0722*ch(r[2]);}
function ratio(a,b){var l1=lum(a),l2=lum(b);if(l1<l2){var t2=l1;l1=l2;l2=t2;}return (l1+.05)/(l2+.05);}
function rgbToHex(r){return "#"+r.map(function(v){return ("0"+v.toString(16)).slice(-2);}).join("");}
function shiftc(r,f){return r.map(function(v){return Math.max(0,Math.min(255,Math.round(f<1?v*f:v+(255-v)*(f-1))));});}
function hex(r){return "#"+r.map(function(v){return ("0"+v.toString(16)).slice(-2);}).join("");}
function desat(r,amt){var g=Math.round(.2126*r[0]+.7152*r[1]+.0722*r[2]);
  return r.map(function(v){return Math.round(v+(g-v)*amt);});}
var colorCache={};
/* הפין נגזר מצבע התחנה, ולכן עובד גם לתחנות שיתווספו. בחירת הדיו
   לבדה אינה מספיקה: צבע בינוני נכשל מול לבן **וגם** מול שחור, ולכן
   אם הטוב מבין השניים עדיין מתחת ל-4.5 מזיזים את הרקע עצמו. */
function pinPair(c){
  var rgb=typeof c==="string"?hexToRgb(c):c;
  var W=[255,255,255], B=[16,16,16];
  for(var i=0;i<28;i++){
    var rw=ratio(rgb,W), rb=ratio(rgb,B);
    if(rw>=4.5||rb>=4.5) return {bg:rgbToHex(rgb),ink:rw>=rb?"#ffffff":"#101010"};
    rgb=shiftc(rgb,0.9);      /* מכהים — שם יש יותר מרחב מול לבן */
  }
  return {bg:rgbToHex(rgb),ink:"#ffffff"};
}
function stColor(st){
  var isDark=currentDark(), key=st.id+"|"+isDark;
  if(colorCache[key]) return colorCache[key];
  var bg=hexToRgb(isDark?"#181c21":"#ffffff"), rgb=desat(hexToRgb(st.color),.22);
  for(var i=0;i<24&&ratio(rgb,bg)<3.2;i++) rgb=shiftc(rgb,isDark?1.12:0.87);
  return (colorCache[key]=hex(rgb));
}

/* ================= היתכנות לפי מזג אוויר =================
   אין אחוזים שמורים בשום מקום. ההיתכנות היא פונקציה טהורה שמחושבת
   ברגע התצוגה מתוך מזג האוויר העדכני ביותר שיש. לכן כל שינוי בתחזית
   משתקף מעצמו בטעינה הבאה — אין מה "לחשב מחדש" ואין מה לרענן ידנית.

   שני מקורות, בסדר עדיפות:
     1. תחזית חיה  — כשהתאריך בטווח ~16 יום. גוברת תמיד.
     2. נורמות אקלים — ממוצע 6 שנים. גיבוי בלבד, מסומן ככזה.
   התחזית לא מגיעה מעבר ל-16 יום, ולכן עד אמצע אוקטובר יוצג מצב 2. */

var WX_TTL_MS=30*60*1000;                 /* התחזית נשמרת חצי שעה ואז נמשכת מחדש */
var wxCache={};

/* כמה כל סוג פעילות נפגע מגשם. ברירת מחדל לפי קטגוריה,
   וניתן לדרוס פר-רשומה בשדה `weather`. */
var SENS_BY_CAT={
  must_see:"medium", attractions:"high", markets:"medium", street_food:"medium",
  food:"medium", restaurants:"low", hotels:"low", nightlife:"low",
  spa:"low", logistics:"medium", contacts:"low"
};
var SENS_FACTOR={high:1.0, medium:0.55, low:0.12};
function sensOf(rec,cat){
  return rec && rec.weather ? rec.weather : (SENS_BY_CAT[cat]||"medium");
}

/* מזג האוויר של תחנה: תחזית חיה אם אפשר, אחרת נורמה אקלימית. */
function weatherFor(st){
  var c=wxCache[st.id];
  if(c && (Date.now()-c.at)<WX_TTL_MS) return c.data;
  var norm=(typeof CLIMATE!=="undefined" && CLIMATE[st.id])||null;
  var fallback=norm?{rainProb:Math.min(1,norm.rd/30),tmax:norm.tmax,tmin:norm.tmin,
                     mm:norm.mm,source:"climate",days:30}:null;
  /* המשיכה אסינכרונית. הקריאה הראשונה מחזירה נורמה, וכשהתחזית נוחתת
     הדף מצייר מחדש עם המספר האמיתי. תחת CSP של Artifact זה פשוט נכשל בשקט. */
  if(!c){
    wxCache[st.id]={at:Date.now(),data:fallback};
    fetchForecast(st);
  }
  return (wxCache[st.id]&&wxCache[st.id].data)||fallback;
}
function fetchForecast(st){
  try{
    var u="https://api.open-meteo.com/v1/forecast?latitude="+st.lat+"&longitude="+st.lng+
          "&daily=precipitation_sum,precipitation_probability_max,temperature_2m_max,temperature_2m_min"+
          "&forecast_days=16&timezone=Asia%2FBangkok";
    fetch(u,{cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).then(function(j){
      if(!j||!j.daily||!j.daily.time||!j.daily.time.length) return;
      var d=j.daily;
      var probs=(d.precipitation_probability_max||[]).filter(function(v){return v!=null;});
      var avgProb=probs.length?probs.reduce(function(a,b){return a+b;},0)/probs.length/100:null;
      if(avgProb==null) return;
      wxCache[st.id]={at:Date.now(),data:{
        rainProb:avgProb,
        tmax:Math.round(avg(d.temperature_2m_max)*10)/10,
        tmin:Math.round(avg(d.temperature_2m_min)*10)/10,
        mm:Math.round(sum(d.precipitation_sum)),
        source:"forecast", days:d.time.length, from:d.time[0], to:d.time[d.time.length-1]
      }};
      refreshWeatherStrip(st);
    }).catch(function(){});
  }catch(e){}
}
/* מחליף את רצועת מזג האוויר בלבד.
   קריאה ל-render() מכאן הייתה בונה מחדש את כל חלונית הפרטים כמה מאות
   מילישניות אחרי פתיחת תחנה: הפוקוס נזרק, והטאב שהמשתמש בחר חזר לראשון.
   ההערה הישנה טענה שזה נחסם ב-CSP — נכון ב-Artifact, לא נכון באתר החי. */
function refreshWeatherStrip(st){
  var box=document.querySelector(".wx");
  if(!box||!box.parentNode) return;
  if(currentStation() && currentStation().id!==st.id) return;   /* התחנה כבר הוחלפה */
  box.parentNode.replaceChild(weatherStrip(st),box);
}
function avg(a){a=(a||[]).filter(function(v){return v!=null;});return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:0;}
function sum(a){a=(a||[]).filter(function(v){return v!=null;});return a.reduce(function(x,y){return x+y;},0);}

/* הפונקציה עצמה: רגישות הפריט × הסיכוי לגשם. */
function feasibility(rec,cat,st){
  var wx=weatherFor(st);
  if(!wx) return null;
  var f=SENS_FACTOR[sensOf(rec,cat)];
  var pct=Math.max(5,Math.min(99,Math.round(100-wx.rainProb*100*f)));
  return {pct:pct,sens:sensOf(rec,cat),source:wx.source,wx:wx};
}
function feasBand(p){ return p>=75?"good":(p>=50?"fair":"poor"); }

/* ============ תצלום התחנה ============
   תצלומים אמיתיים מ-Wikimedia Commons, מוטמעים כ-data URI כי ה-CSP

var PHOTO_ALT={
  "hanoi":{he:"גשר ת'ה הוק האדום על אגם הואן קיים, מואר בלילה",en:"The red The Huc bridge on Hoan Kiem Lake, lit at night"},

  "ha-long":{he:"מגדלי אבן גיר עולים מהמים במפרץ הא לונג",en:"Limestone towers rising from the water in Ha Long Bay"},
  "ninh-binh":{he:"נהר בין צוקי קארסט בנין בין",en:"A river between karst cliffs in Ninh Binh"},

  "lak-lake":{he:"אגם לאק מבעד לעצים",en:"Lak Lake seen through the trees"},
  "da-lat":{he:"אגם שואן הואונג במרכז דה לאט",en:"Xuan Huong Lake in central Da Lat"},
  "saigon":{he:"קו הרקיע של הו צ'י מין מנהר סייגון",en:"The Ho Chi Minh City skyline from the Saigon River"},
  "mekong":{he:"סירות עמוסות בשוק הצף בקאי ראנג",en:"Loaded boats at the Cai Rang floating market"},
  "phu-quoc":{he:"מים טורקיז וחוף לבן בפו קוטק",en:"Turquoise water and white sand in Phu Quoc"}
};
function photoAlt(st){
  var a=PHOTO_ALT[st.id];
  return a?(isHe()?a.he:a.en):"";
}
function hasPhoto(st){return typeof STATION_PHOTO!=="undefined" && !!STATION_PHOTO[st.id];}

var sceneCache={};
function scene(st,w,h){
  var key=st.id+"|"+w+"|"+h+"|"+currentDark();
  if(sceneCache[key]) return sceneCache[key];
  var dpr=Math.min(window.devicePixelRatio||1,2);
  var cv=document.createElement("canvas");
  cv.width=w*dpr; cv.height=h*dpr;
  var g=cv.getContext("2d"); g.scale(dpr,dpr);
  paint(g,w,h,st);
  return (sceneCache[key]=cv.toDataURL("image/png"));
}
function mix(a,b,tt){a=hexToRgb(a);b=hexToRgb(b);return hex([0,1,2].map(function(i){return Math.round(a[i]+(b[i]-a[i])*tt);}));}
function paint(g,w,h,st){
  var dark=currentDark();
  /* הגוון מרוסן: הצבע מוחלש לפני שהוא נוגע בנוף, אחרת מתקבל ממשק ממתקים. */
  var base=hex(desat(hexToRgb(st.color),.42));
  var SKY_T=dark?"#141a24":"#d5dee4", SKY_B=dark?"#1e2733":"#eae3d8";
  var LAND =dark?"#182b27":"#3c6154", WATER=dark?"#16262f":"#75989f";
  var sky1=mix(SKY_T,base,dark?.10:.13), sky2=mix(SKY_B,base,dark?.15:.18);
  var grad=g.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,sky1); grad.addColorStop(1,sky2);
  g.fillStyle=grad; g.fillRect(0,0,w,h);

  g.fillStyle=dark?"rgba(228,224,208,.20)":"rgba(255,252,240,.62)";
  g.beginPath(); g.arc(w*0.79,h*0.26,h*0.088,0,Math.PI*2); g.fill();

  var kind=SCENE[st.id]||"hills";
  var tint=dark?.24:.28;
  var far =mix(mix(LAND,base,tint),dark?"#0a0f14":"#ffffff",dark?.28:.30);
  var mid =mix(mix(LAND,base,tint),dark?"#0a0f14":"#ffffff",dark?.12:.13);
  var near=mix(mix(LAND,base,tint),dark?"#0a0f14":"#0e1a16",dark?.02:.12);
  var wat =mix(WATER,base,dark?.14:.17);

  function ridge(color,baseY,amp,step,jag){
    g.fillStyle=color; g.beginPath(); g.moveTo(0,h); g.lineTo(0,baseY);
    var x=0,i=0;
    while(x<=w){
      var tv=Math.sin((i*jag)+st.seq)*0.5+Math.sin(i*jag*2.3+st.seq*2)*0.5;
      g.lineTo(x,baseY-amp*tv); x+=step; i++;
    }
    g.lineTo(w,h); g.closePath(); g.fill();
  }
  function spikes(color,baseY,minH,maxH,count,seed){
    g.fillStyle=color; g.beginPath(); g.moveTo(0,h); g.lineTo(0,baseY);
    for(var i=0;i<count;i++){
      var x0=(i/count)*w, x1=((i+1)/count)*w;
      var hh=minH+(maxH-minH)*(0.5+0.5*Math.sin(i*2.7+seed));
      g.lineTo(x0+(x1-x0)*0.18,baseY);
      g.lineTo(x0+(x1-x0)*0.5,baseY-hh);
      g.lineTo(x1-(x1-x0)*0.12,baseY);
    }
    g.lineTo(w,h); g.closePath(); g.fill();
  }
  function towers(color,baseY,minH,maxH,count,seed,wr){
    g.fillStyle=color;
    for(var i=0;i<count;i++){
      var cx=((i+0.5)/count)*w+w*0.02*Math.sin(i*3.1+seed);
      var hh=minH+(maxH-minH)*(0.5+0.5*Math.sin(i*2.4+seed));
      var hw=(w/count)*wr;
      g.beginPath(); g.moveTo(cx-hw,baseY);
      g.quadraticCurveTo(cx-hw*0.82,baseY-hh*0.72,cx,baseY-hh);
      g.quadraticCurveTo(cx+hw*0.82,baseY-hh*0.72,cx+hw,baseY);
      g.closePath(); g.fill();
    }
    g.fillRect(0,baseY,w,h-baseY);
  }
  function water(y,color){
    g.fillStyle=color; g.fillRect(0,y,w,h-y);
    g.strokeStyle="rgba(255,255,255,.20)"; g.lineWidth=1.2;
    for(var i=0;i<4;i++){
      var yy=y+9+i*((h-y)/5);
      g.beginPath(); g.moveTo(w*(0.07+0.10*i),yy); g.lineTo(w*(0.28+0.10*i),yy); g.stroke();
    }
  }
  function skyline(color,baseY){
    g.fillStyle=color; var x=0,i=0;
    while(x<w){
      var bw=w*(0.045+0.035*((i*7)%3)/2);
      var bh=h*(0.15+0.28*(0.5+0.5*Math.sin(i*1.9+st.seq)));
      g.fillRect(x,baseY-bh,bw-2,bh+(h-baseY));
      x+=bw+w*0.012; i++;
    }
  }

  if(kind==="karst"){
    /* צר וגבוה — אחרת המגדלים נקראים כגבעות ונין בין נראית כמו סאפה */
    towers(far,h*0.76,h*0.34,h*0.62,11,st.seq,0.24);
    towers(mid,h*0.82,h*0.24,h*0.46,8,st.seq+3,0.28);
    water(h*0.82,wat);
    towers(near,h*0.84,h*0.16,h*0.32,5,st.seq+9,0.32);
  }else if(kind==="terraces"){
    ridge(far,h*0.50,h*0.13,w/9,0.9);
    g.fillStyle=mid;
    for(var tr=0;tr<7;tr++){
      g.beginPath();
      var yy=h*0.57+tr*(h*0.062);
      g.moveTo(0,yy);
      for(var x2=0;x2<=w;x2+=w/10){ g.lineTo(x2,yy-h*0.024*Math.sin(x2/w*3.1+tr)); }
      g.lineTo(w,yy+h*0.045);
      for(var x3=w;x3>=0;x3-=w/10){ g.lineTo(x3,yy+h*0.045-h*0.024*Math.sin(x3/w*3.1+tr)); }
      g.closePath(); g.globalAlpha=0.52+0.06*tr; g.fill(); g.globalAlpha=1;
    }
  }else if(kind==="city"){
    ridge(far,h*0.60,h*0.06,w/7,0.8);
    water(h*0.86,wat);
    skyline(mid,h*0.74);
  }else if(kind==="beach"){
    g.fillStyle=far;
    g.beginPath(); g.moveTo(w*0.55,h*0.58);
    g.quadraticCurveTo(w*0.70,h*0.42,w*0.86,h*0.58); g.closePath(); g.fill();
    water(h*0.58,wat);
    g.fillStyle=dark?mix("#b8ab8c","#0a0f14",.55):mix("#e6dac0","#ffffff",.20);
    g.beginPath(); g.moveTo(0,h*0.79);
    for(var x4=0;x4<=w;x4+=w/10){ g.lineTo(x4,h*0.79-h*0.020*Math.sin(x4/w*3.4+st.seq)); }
    g.lineTo(w,h); g.lineTo(0,h); g.closePath(); g.fill();
    [[0.13,1.0],[0.26,0.72]].forEach(function(p){
      var bx=w*p[0], by=h*0.84, top=h*(0.84-0.36*p[1]), sway=w*0.035*p[1];
      g.strokeStyle=near; g.lineWidth=3.6*p[1]; g.lineCap="round";
      g.beginPath(); g.moveTo(bx,by); g.quadraticCurveTo(bx+sway*0.4,(by+top)/2,bx+sway,top); g.stroke();
      g.fillStyle=near;
      for(var f=0;f<6;f++){
        var ang=Math.PI*(0.08+f*0.17);
        var ex=bx+sway+Math.cos(ang)*w*0.072*p[1], ey=top+Math.sin(ang)*h*0.072*p[1]-h*0.012;
        g.beginPath(); g.moveTo(bx+sway,top);
        g.quadraticCurveTo((bx+sway+ex)/2,(top+ey)/2-h*0.042*p[1],ex,ey);
        g.quadraticCurveTo((bx+sway+ex)/2,(top+ey)/2+h*0.012,bx+sway,top);
        g.fill();
      }
    });
  }else if(kind==="lake"){
    ridge(far,h*0.55,h*0.10,w/8,0.75);
    ridge(mid,h*0.66,h*0.08,w/6,1.1);
    water(h*0.70,wat);
  }else if(kind==="delta"){
    ridge(far,h*0.52,h*0.05,w/9,0.6);
    water(h*0.58,wat);
    g.fillStyle=near;
    for(var b=0;b<3;b++){
      var bx2=w*(0.20+b*0.26), by2=h*(0.74+b*0.055);
      g.beginPath(); g.moveTo(bx2-w*0.05,by2);
      g.quadraticCurveTo(bx2,by2+h*0.05,bx2+w*0.05,by2); g.closePath(); g.fill();
    }
  }else if(kind==="lanterns"){
    ridge(far,h*0.64,h*0.05,w/8,0.7);
    water(h*0.84,wat);
    skyline(mid,h*0.78);
    var hues=["#c9922c","#b0553f","#a8567e","#cfc4ae"];
    var wireY=h*0.13;
    g.strokeStyle=dark?"rgba(228,224,208,.26)":"rgba(50,40,28,.26)";
    g.lineWidth=1.1; g.beginPath(); g.moveTo(0,wireY);
    g.quadraticCurveTo(w*0.5,wireY+h*0.055,w,wireY); g.stroke();
    for(var L=0;L<9;L++){
      var tx=(L+0.5)/9, lx=tx*w;
      var ly=wireY+h*0.055*(1-Math.pow(2*tx-1,2))+h*0.045;
      g.strokeStyle=dark?"rgba(228,224,208,.22)":"rgba(50,40,28,.22)";
      g.beginPath(); g.moveTo(lx,ly-h*0.045); g.lineTo(lx,ly); g.stroke();
      g.fillStyle=hues[L%4];
      g.beginPath(); g.ellipse(lx,ly+h*0.048,w*0.0115,h*0.05,0,0,Math.PI*2); g.fill();
    }
  }else if(kind==="pines"){
    ridge(far,h*0.57,h*0.10,w/8,0.8);
    ridge(mid,h*0.69,h*0.07,w/6,1.2);
    g.fillStyle=near;
    for(var p2=0;p2<11;p2++){
      var px=w*(0.03+p2*0.092), ph=h*(0.15+0.10*(0.5+0.5*Math.sin(p2*2.1+st.seq)));
      g.beginPath(); g.moveTo(px,h*0.86); g.lineTo(px+w*0.022,h*0.86-ph); g.lineTo(px+w*0.044,h*0.86);
      g.closePath(); g.fill();
    }
  }else if(kind==="river"){
    ridge(far,h*0.53,h*0.09,w/8,0.8);
    ridge(mid,h*0.65,h*0.06,w/6,1.0);
    water(h*0.72,wat);
    g.fillStyle=near;
    g.beginPath(); g.moveTo(w*0.30,h*0.66);
    g.quadraticCurveTo(w*0.44,h*0.55,w*0.58,h*0.66);
    g.lineTo(w*0.56,h*0.70); g.lineTo(w*0.32,h*0.70); g.closePath(); g.fill();
  }else if(kind==="peaks"){
    spikes(far,h*0.72,h*0.24,h*0.46,5,st.seq);
    spikes(mid,h*0.80,h*0.16,h*0.32,7,st.seq+4);
    ridge(near,h*0.88,h*0.05,w/7,1.4);
  }else{
    ridge(far,h*0.56,h*0.11,w/8,0.8);
    ridge(mid,h*0.68,h*0.09,w/6,1.1);
    ridge(near,h*0.80,h*0.06,w/5,1.5);
  }
}

/* ============ עזרים ============ */
function el(tag,cls,txt){var n=document.createElement(tag);if(cls)n.className=cls;if(txt!=null)n.textContent=txt;return n;}
function en2(n){n.lang="en";n.dir="ltr";n.classList.add("en");return n;}
/* שמות מקומות ויאטנמיים אינם אנגלית. VoiceOver עברית קרא "Hội An"
   ו-"Bánh Mì Phượng" בפונמות אנגליות, וזו בדיוק הסיבה שהשם הלועזי
   בריבוע קיבל lang="vi". הפונקציה הגנרית נשארה מאחור. */
function vi2(n){n.lang="vi";n.dir="ltr";n.classList.add("en");return n;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function hl(txt){
  if(!query) return esc(txt);
  var i=txt.toLowerCase().indexOf(query);
  if(i<0) return esc(txt);
  return esc(txt.slice(0,i))+"<mark>"+esc(txt.slice(i,i+query.length))+"</mark>"+esc(txt.slice(i+query.length));
}
function total(st){return CATS.reduce(function(s,c){return s+((st.poi[c.id]||[]).length);},0);}
function mapsUrl(r,st){
  return r.lat!=null?"https://www.google.com/maps/search/?api=1&query="+r.lat+","+r.lng
    :"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(r.name+", "+st.name+", Vietnam");
}
function rideUrl(r,st){
  return r.lat!=null?"https://www.google.com/maps/dir/?api=1&destination="+r.lat+","+r.lng+"&travelmode=driving"
    :"https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(r.name+", "+st.name)+"&travelmode=driving";
}
/* 20 רשומות נושאות מקור booking.com. הקישור נגזר ממנו ואינו מומצא. */
function bookingUrl(r){
  var u=(r.sources||[]).filter(function(x){return /(^|\.)booking\.com\//.test(String(x));})[0];
  return u||null;
}
function vidUrl(r,st){return r.video||"https://www.youtube.com/results?search_query="+encodeURIComponent(r.name+" "+st.name);}
/* wa.me רוצה ספרות בלבד, בלי פלוס, מקפים או רווחים */
function waUrl(num){return "https://wa.me/"+String(num).replace(/[^\d]/g,"");}
function brandOf(u){
  try{var p=new URL(u).hostname.split(".");if(p.length>1)p.pop();
      if(p.length>1&&(p[p.length-1]==="co"||p[p.length-1]==="com"))p.pop();
      return p[p.length-1];}catch(e){return u;}
}
/* איפוס לפני הצבה. הצבת אותה מחרוזת פעמיים ברצף אינה משנה את ה-DOM
   ולכן אינה מפיקה הכרזה שנייה — "נשמר" אחרי "נשמר" היה שקט מוחלט.
   אותו דפוס כמו sayHere בתוך הדיאלוג. */
/* מסלול הכרזה יחיד. שתי פונקציות שנבדלות רק בבדיקה אחת הזמינו טעות:
   שלושה קוראים שרצים מתוך render() דיברו אל #live בזמן ש-showModal
   הפך אותו ל-inert, וההכרזה נבלעה בשקט. הבחירה יורדת לכאן פנימה,
   ואי אפשר לפספס אותה.
   האיפוס לפני ההצבה הכרחי: הצבת אותה מחרוזת פעמיים ברצף אינה משנה
   את ה-DOM ולכן אינה מפיקה הכרזה שנייה. */
/* אזור ה-live הפעיל כרגע. showModal הופך את #live ל-inert, ולכן
   כל דיאלוג פתוח חייב להצביע לכאן על אזור משלו. הגרסה הקודמת בדקה
   רק את #setDlg — כלומר כרטיס המקום היה בולע כל הכרזה בשקט, וזה
   בדיוק מה שהיה קורה לכפתור Grab. */
var activeLive=null, sayQueue=[], sayTimer=null;
function say(m){
  /* תור, לא טיימר קבוע. פתיחת תחנה בנייד קוראת ל-say פעמיים באותו
     tick — פעם עם "האנוי, 42 מקומות" ופעם עם מצב הגיליון — ושני
     הטיימרים ירו באותו batch, כך ששכבת הנגישות ראתה מוטציה אחת
     בלבד. הספירה, שהיא כל המידע החדש, לא הוכרזה מעולם. */
  if(!m) return;
  sayQueue.push(m);
  if(sayTimer) return;
  var n=activeLive||document.getElementById(
    (function(sd){return sd&&sd.open;})(document.getElementById("setDlg"))?"setLive":"live");
  if(!n){ sayQueue.length=0; return; }
  n.textContent="";
  sayTimer=setTimeout(function(){
    sayTimer=null;
    var msg=sayQueue.join(". "); sayQueue.length=0;
    /* היעד נקרא שוב כאן: ייתכן שדיאלוג נפתח או נסגר בין ההצבה לירי. */
    var tgt=activeLive||document.getElementById(
      (function(sd){return sd&&sd.open;})(document.getElementById("setDlg"))?"setLive":"live");
    if(tgt) tgt.textContent=msg;
  },60);
}
/* כינוי לשם קריאוּת באתרי הקריאה שנוגעים לכרום. אותה פונקציה בדיוק. */
var announce=say;
function currentDark(){
  var s=document.documentElement.getAttribute("data-theme");
  return s?s==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches;
}

/* תקן הפרויקט: "קח אותי לשם" פותח את Grab עם היעד ממולא.
   ב-KML נשאר Google Maps כי My Maps מסננת סכמות URI מותאמות; כאן יש
   JS ולכן שלושת המנגנונים אפשריים.

   הקושי האמיתי הוא ש-grab:// בדפדפן שאין לו טיפול בסכמה **לא עושה
   כלום** — אין אירוע, אין שגיאה, אין onerror. לכן:
   - העוגן נושא את ה-fallback ב-href, לא את ה-deep link. בלי JS
     הקישור עדיין מוביל ליעד אמיתי.
   - הזיהוי הוא מדידת זמן: אם המסמך הפך נסתר, האפליקציה תפסה.
   - **ההעתקה קודמת לכל דבר אסינכרוני.** ב-Safari
     clipboard.writeText דורש transient user activation; הרצה אחרי
     פסק-זמן של 1200ms נדחית — כלומר הגיבוי היה נכשל בדיוק במקרה
     שבו הוא נחוץ. */
var GRAB_WEB="https://www.grab.com/vn/";
function grabDeep(r){
  return "grab://open?screenType=BOOKING&drop_off_lat="+r.lat+"&drop_off_lng="+r.lng;
}
function grabAddr(r,st){
  return [r.name,r.area,st.name,"Vietnam"].filter(Boolean).join(", ");
}
function grabBtn(r,st){
  var addr=grabAddr(r,st);
  var a=lbtn("act-ride","car",t("grab"),GRAB_WEB,r.name,"grabNote");
  a.classList.add("grab-link");
  a.setAttribute("data-grab-deep",grabDeep(r));
  a.setAttribute("data-grab-addr",addr);
  a.removeAttribute("target");          /* deep link ב-_blank משאיר לשונית ריקה */
  a.addEventListener("click",function(e){
    if(e.metaKey||e.ctrlKey||e.shiftKey||e.button!==0) return;   /* לחיצה מותאמת */
    e.preventDefault();
    /* 1. קליפבורד ראשון, בתוך הג'סטה */
    var copied=null;
    if(navigator.clipboard&&navigator.clipboard.writeText){
      copied=navigator.clipboard.writeText(addr).then(function(){return true;},function(){return false;});
    }
    /* 2. ניסיון פתיחת האפליקציה */
    var t0=Date.now(), gone=false;
    function mark(){ gone=true; }
    document.addEventListener("visibilitychange",mark,{once:true});
    window.addEventListener("pagehide",mark,{once:true});
    window.location.href=a.getAttribute("data-grab-deep");
    /* 3. נפילה — רק אם עדיין כאן */
    setTimeout(function(){
      document.removeEventListener("visibilitychange",mark);
      if(gone||document.hidden||Date.now()-t0>2500) return;
      showGrabFallback(a,copied,r.name);
    },1200);
  });
  return a;
}
/* לא פותחים לשונית אוטומטית: window.open אחרי פסק-זמן מנותק מהג'סטה,
   נחסם ב-iOS, ומעבר ההקשר קוטע את ההכרזה לפני שנאמרה. במקום זה —
   קישור גלוי, ו-Tab אחד מגיע אליו. */
function showGrabFallback(a,copied,name){
  var li=a.parentNode, ul=li&&li.parentNode;
  if(!ul) return;
  var have=ul.querySelector(".grab-fb");
  if(have){
    /* לחיצה שנייה הייתה שקט מוחלט. מי שלא קלט את ההכרזה הראשונה
       צריך לקבל אותה שוב, ועדיף — להגיע לקישור. */
    say(t("grabMiss")); have.focus();
    return;
  }
  var web=el("a","lbtn act-ride grab-link grab-fb");
  web.href=GRAB_WEB; web.target="_blank"; web.rel="noopener noreferrer";
  web.appendChild(icon("car"));
  web.appendChild(document.createTextNode(t("grabWeb")));
  web.appendChild(el("span","sr"," — "+name+t("newTab")));
  /* פריט משלו ברשימה. הזרקת <a> ישירות ל-<ul> אינה חוקית, והזרקתו
     לתוך ה-<li> הקיים הייתה מסתירה אותו מספירת הפריטים. */
  var nli=el("li"); nli.setAttribute("role","listitem"); nli.appendChild(web);
  if(li.nextSibling) ul.insertBefore(nli,li.nextSibling); else ul.appendChild(nli);
  function tell(ok){ say(t(ok?"grabMissCopied":"grabMiss",{"%s":name})); }
  if(copied) copied.then(tell); else tell(false);
}

function lbtn(cls,ic,label,href,name,noteKey){
  var a=el("a","lbtn "+cls);
  a.href=href; a.target="_blank"; a.rel="noopener noreferrer";
  a.appendChild(icon(ic));
  a.appendChild(document.createTextNode(label));
  /* עבור Grab "נפתח בכרטיסייה חדשה" הוא פשוט לא נכון — נפתחת אפליקציה. */
  a.appendChild(el("span","sr"," — "+name+t(noteKey||"newTab")));
  return a;
}

/* click מגרירה מקבל כ-target את האב המשותף של down ו-up. גרירת
   בחירת-טקסט שמתחילה בכותרת ומסתיימת מחוץ ל-sheet נתנה target===dlg
   וסגרה את החלון באמצע העתקת השם — בדיוק ה-flow שהכותרת משרתת. */
