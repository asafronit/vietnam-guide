<title>ויאטנם במבט אחד</title>
<script>
document.documentElement.setAttribute("dir","rtl");
try{
  var _l=localStorage.getItem("vn.lang")||"he";
  document.documentElement.setAttribute("lang",_l);
  document.documentElement.setAttribute("dir",_l==="he"?"rtl":"ltr");
  var _t=localStorage.getItem("vn.theme"); if(_t)document.documentElement.setAttribute("data-theme",_t);
}catch(e){document.documentElement.setAttribute("lang","he");}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Rubik:wght@400;500;600&family=Assistant:wght@400;600&display=swap">
<style>
/* ==========================================================
   ויאטנם 2026 — מאגר המסע
   שקט: ניטרלי חמים, ג'ייד עמוק, פינות מרוסנות, אייקוני קו.
   ========================================================== */
:root{
  scroll-padding-top:150px;scroll-padding-bottom:calc(var(--navh) + 14px);
  --bg:#f6f5f3;
  --surface:#ffffff;
  --surface-2:#eeece8;
  --ink:#16191d;
  --ink-2:#565c66;
  --ink-3:#666c75;
  --line:rgba(22,25,29,.13);
  --line-soft:rgba(22,25,29,.07);
  --brand:#0f6b57;
  --brand-ink:#ffffff;
  --brand-soft:#e6efec;
  --gold:#8a6412;
  --rose:#a13924;
  --c-map:#1257a8;   --c-map-soft:rgba(18,87,168,.10);
  --c-ride:#106b45;  --c-ride-soft:rgba(16,107,69,.10);
  --c-chat:#6b2e8f;  --c-chat-soft:rgba(107,46,143,.10);
  --c-video:#b32218; --c-video-soft:rgba(179,34,24,.10);
  --shadow:0 1px 2px rgba(22,25,29,.05);
  --shadow-lg:0 10px 34px rgba(22,25,29,.14);
  --r:12px;
  --r-sm:10px;
  --r-xs:7px;
  /* קול תצוגה נפרד. סריף עברי-לטיני בניגודיות גבוהה — הוא נושא
     את שמות התחנות מעל התצלומים, ואין לו תפקיד אחר בדף. */
  --f-display:"Frank Ruhl Libre",Georgia,serif;
  --f-ui:"Rubik","Segoe UI",sans-serif;
  --f-body:"Assistant","Segoe UI",sans-serif;
  --gutter:clamp(15px,4vw,28px);
  --navh:0px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111417;--surface:#181c21;--surface-2:#222831;
    --ink:#e9ecef;--ink-2:#aab1ba;--ink-3:#949ba4;
    --line:rgba(233,236,239,.16);--line-soft:rgba(233,236,239,.08);--line-ctl:rgba(233,236,239,.46);
    --brand:#4dbc9d;--brand-ink:#0a221c;--brand-soft:#17302a;
    --gold:#cfa64f;--rose:#e0806c;
    --c-map:#7fb2ee;   --c-map-soft:rgba(127,178,238,.14);
    --c-ride:#5cc696;  --c-ride-soft:rgba(92,198,150,.14);
    --c-chat:#c69ae4;  --c-chat-soft:rgba(198,154,228,.14);
    --c-video:#f0847a; --c-video-soft:rgba(240,132,122,.14);
    --shadow:0 1px 2px rgba(0,0,0,.4);
    --shadow-lg:0 12px 40px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#111417;--surface:#181c21;--surface-2:#222831;
  --ink:#e9ecef;--ink-2:#aab1ba;--ink-3:#949ba4;
  --line:rgba(233,236,239,.16);--line-soft:rgba(233,236,239,.08);
  --brand:#4dbc9d;--brand-ink:#0a221c;--brand-soft:#17302a;
  --gold:#cfa64f;--rose:#e0806c;
    --c-map:#7fb2ee;   --c-map-soft:rgba(127,178,238,.14);
    --c-ride:#5cc696;  --c-ride-soft:rgba(92,198,150,.14);
    --c-chat:#c69ae4;  --c-chat-soft:rgba(198,154,228,.14);
    --c-video:#f0847a; --c-video-soft:rgba(240,132,122,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-lg:0 12px 40px rgba(0,0,0,.55);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gold:#cfa64f}}

*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--f-body);font-size:15.5px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{padding-bottom:var(--navh)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;inset-inline-start:-9999px;top:0;z-index:99;background:var(--brand);color:var(--brand-ink);padding:11px 18px;font-family:var(--f-ui);font-weight:500}
.skip:focus{inset-inline-start:0}
.en{direction:ltr;unicode-bidi:isolate}
svg.ic{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg.ic-lg{width:21px;height:21px}

/* ---------- סרגל עליון ---------- */
.topbar{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid transparent;transition:border-color .2s}
.topbar.is-stuck{border-bottom-color:var(--line)}
.tb-row{max-width:1140px;margin:0 auto;padding:0 var(--gutter);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tb-row.r1{padding-top:13px;padding-bottom:9px}
.brand{font-family:var(--f-ui);font-weight:600;font-size:1.05rem;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.brand .bar{width:3px;height:17px;background:var(--brand);border-radius:2px;flex:none}
.brand span{font-weight:400;color:var(--ink-3);font-size:.84rem}
.tb-tools{display:flex;gap:7px;align-items:center;margin-inline-start:auto;flex-wrap:wrap}

/* מקטע מחליף — שפה ומטבע */
.seg{display:inline-flex;border:1px solid var(--line-ctl);border-radius:var(--r-xs);background:var(--surface)}
.seg button{
  font-family:var(--f-ui);font-size:.79rem;font-weight:500;color:var(--ink-2);
  padding:6px 11px;border-inline-start:1px solid var(--line-soft);transition:background .13s,color .13s;
}
.seg button:first-child{border-inline-start:none}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.seg button:hover:not([aria-pressed="true"]){background:var(--surface-2);color:var(--ink)}
.iconbtn{
  display:inline-flex;align-items:center;justify-content:center;width:33px;height:33px;
  border:1px solid var(--line-ctl);border-radius:var(--r-xs);color:var(--ink-2);background:var(--surface);
  transition:background .13s,color .13s;
}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}

/* מסגרת הטיול: תאריכים, היום, וספירה לאחור */
.tripbar{border-top:1px solid var(--line-soft);background:var(--surface)}
.tripbar-in{max-width:1140px;margin:0 auto;padding:8px var(--gutter);
  display:flex;flex-wrap:wrap;gap:8px 22px;align-items:baseline}
.tb-item{display:flex;align-items:baseline;gap:7px;font-size:.83rem;color:var(--ink-2)}
.tb-item b{font-family:var(--f-ui);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.tb-item .lbl{font-size:.75rem;color:var(--ink-3)}
.tb-count{margin-inline-start:auto;display:flex;align-items:baseline;gap:7px}
.tb-count b{font-family:var(--f-ui);font-weight:600;font-size:1.02rem;color:var(--brand);font-variant-numeric:tabular-nums}
.tb-sep{width:1px;align-self:stretch;background:var(--line-soft)}
@media (max-width:640px){ .tb-count{margin-inline-start:0} }

/* שורת קישורים רשמיים */
.official{border-top:1px solid var(--line-soft);background:var(--surface)}
.official-in{max-width:1140px;margin:0 auto;padding:7px var(--gutter);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.oflink{
  display:inline-flex;align-items:center;gap:7px;font-family:var(--f-ui);font-size:.8rem;font-weight:500;
  color:var(--ink-2);border:1px solid var(--line-ctl);border-radius:var(--r-xs);padding:6px 11px;
  transition:border-color .13s,color .13s;
}
.oflink:hover{border-color:var(--brand);color:var(--brand)}
.oflink svg{color:var(--brand)}
.of-note{font-size:.78rem;color:var(--ink-3);margin-inline-start:auto}

/* ---------- חיפוש + ניווט ---------- */
.tb-row.r2{padding-top:10px;padding-bottom:10px;gap:10px}
.searchbox{
  flex:1 1 260px;display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--line-ctl);border-radius:var(--r-sm);padding:9px 14px;transition:border-color .13s;
}
.searchbox:focus-within{border-color:var(--brand)}
.searchbox input{flex:1;min-width:0;border:none;background:none;font:inherit;color:var(--ink);padding:0}
.searchbox input:focus{outline:none}
.searchbox input::-webkit-search-cancel-button{display:none}
.searchbox input::placeholder{color:var(--ink-3)}
.searchbox .ic{color:var(--ink-3)}
.xbtn{color:var(--ink-3);flex:none;padding:4px;display:flex;border-radius:4px;min-width:25px;min-height:25px;align-items:center;justify-content:center}
.xbtn:hover{color:var(--rose)}
.tabs{display:flex;gap:2px}
.tab{
  font-family:var(--f-ui);font-size:.85rem;font-weight:500;color:var(--ink-2);
  padding:8px 13px;border-radius:var(--r-xs);display:inline-flex;gap:7px;align-items:center;
  transition:background .13s,color .13s;
}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--surface-2);color:var(--ink);font-weight:600}
.tab .cnt{font-size:.76rem;color:var(--ink-3);font-weight:400}

/* ---------- גוף ---------- */
main{max-width:1140px;margin:0 auto;padding:8px var(--gutter) 64px}
/* יעד פוקוס תכנותי בלבד, לא נגיע אליו ב-Tab — טבעת סביב כל הדף רק מפריעה */
main:focus,main:focus-visible{outline:none}
/* פותח פרק, לא כותרת קטנה. הטווח 01–05 הוא סדר המסלול מצפון לדרום,
   כלומר מידע שהקורא צריך ולא קישוט. */
.sec-head{
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  font-family:var(--f-display);font-weight:700;font-size:clamp(1.5rem,4vw,2.1rem);
  line-height:1.05;letter-spacing:-.015em;
  margin:52px 0 18px;padding-bottom:12px;border-bottom:1px solid var(--ink);
}
.sec-head .cnt{
  font-family:var(--f-body);font-size:.86rem;font-weight:400;color:var(--ink-3);
  margin-inline-start:auto;letter-spacing:0;
}
.sec-head .range{font-family:var(--f-ui);font-size:.92rem;font-weight:500;
  color:var(--ink-3);letter-spacing:.02em;font-variant-numeric:tabular-nums}

/* ---------- לוח תחנה ---------- */
/* התצלום הוא הכרטיס, לא תמונה קטנה מעל גוף לבן. */
/* align-items:start חיוני. בלעדיו כרטיס צר נמתח לגובה הכרטיס הרחב
   שלצידו, התצלום לא נמתח איתו, ונפער שטח ריק מתחתיו. */
.station-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;align-items:start}
.scard{
  grid-column:span 4;
  display:block;position:relative;overflow:hidden;border-radius:var(--r);
  background:var(--surface-2);box-shadow:var(--shadow);
  transition:box-shadow .3s cubic-bezier(.2,.7,.3,1),transform .3s cubic-bezier(.2,.7,.3,1);
}
/* התחנה הראשונה בכל אזור נפתחת רחב — היררכיה במקום ארבעה עשר כרטיסים זהים */
.scard.is-lead{grid-column:span 8}
@media (max-width:900px){ .scard,.scard.is-lead{grid-column:span 6} }
@media (max-width:600px){ .scard,.scard.is-lead{grid-column:span 12} }
.scard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.scene{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;
  background:var(--surface-2);transition:transform .5s cubic-bezier(.2,.7,.3,1)}
.scard.is-lead .scene{aspect-ratio:16/8}
.scard:hover .scene{transform:scale(1.03)}
.scard-body{
  position:absolute;inset-block-end:0;inset-inline:0;padding:48px 18px 16px;color:#fff;
  background:linear-gradient(to top,rgba(8,11,15,.92),rgba(8,11,15,.58) 46%,transparent);
}
.seqbadge{
  position:absolute;top:12px;inset-inline-start:12px;
  font-family:var(--f-ui);font-weight:500;font-size:.72rem;color:#fff;
  background:var(--stationcolor);border-radius:4px;padding:2px 8px;
  letter-spacing:.04em;font-variant-numeric:tabular-nums;
  box-shadow:0 1px 6px rgba(0,0,0,.4);
}
.scard-name{
  font-family:var(--f-display);font-weight:700;
  font-size:clamp(1.2rem,2.3vw,1.65rem);line-height:1.08;letter-spacing:-.015em;margin:0;
  text-shadow:0 1px 16px rgba(0,0,0,.55);
}
.scard.is-lead .scard-name{font-size:clamp(1.45rem,3.2vw,2.2rem)}
.scard-sub{font-family:var(--f-ui);font-size:.83rem;opacity:.88;margin:2px 0 10px}
.pillrow{display:flex;flex-wrap:wrap;gap:4px}
/* התגיות יושבות על תצלום כהה, לא על משטח בהיר */
.pill{
  font-family:var(--f-ui);font-size:.75rem;font-weight:500;color:rgba(255,255,255,.94);
  border:1px solid rgba(255,255,255,.26);background:rgba(255,255,255,.13);
  border-radius:var(--r-xs);padding:3px 9px;
  display:inline-flex;gap:5px;align-items:center;backdrop-filter:blur(6px);
}
.pill svg{width:13px;height:13px;color:rgba(255,255,255,.8)}
.pill b{font-weight:600;color:#fff;font-variant-numeric:tabular-nums}
.pill.thin{background:none;border-style:dashed;color:rgba(255,255,255,.78)}

/* ---------- עמוד תחנה ---------- */
.hero{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:4px}
.hero-txt{position:absolute;inset-block-end:0;inset-inline:0;padding:72px 24px 22px;color:#fff;
  background:linear-gradient(to top,rgba(10,13,17,.92),rgba(10,13,17,.64) 55%,rgba(10,13,17,.24))}
.hero-name{font-family:var(--f-display);font-weight:700;font-size:clamp(1.9rem,6vw,3.4rem);line-height:1.02;letter-spacing:-.02em;margin:0;text-wrap:balance;text-shadow:0 2px 22px rgba(0,0,0,.5)}
.hero-name:focus{outline:none}
.hero-name:focus-visible{outline:2px solid rgba(255,255,255,.9);outline-offset:4px;border-radius:3px}
.hero-sub{font-family:var(--f-ui);font-weight:400;font-size:.9rem;opacity:.88;margin-top:2px}
.backbtn{
  display:inline-flex;align-items:center;gap:7px;font-family:var(--f-ui);font-weight:500;font-size:.85rem;
  color:var(--ink-2);border:1px solid var(--line-ctl);background:var(--surface);
  padding:7px 13px;border-radius:var(--r-xs);margin:2px 0 12px;
}
.backbtn:hover{color:var(--ink);border-color:var(--brand)}
.backbtn svg{transform:scaleX(1)}
:root[dir="rtl"] .backbtn svg,html[dir="rtl"] .backbtn svg{transform:scaleX(-1)}

/* ---------- תצוגה מפוצלת ----------
   הרשימה קבועה בצד, הפרטים מתחלפים לצידה. לא עוזבים את הדף:
   מעבר בין תחנות הוא החלפת התוכן בחלונית אחת, לא ניווט לעמוד חדש. */
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.rail{position:sticky;top:calc(var(--sticky-top) + 8px);max-height:calc(100vh - var(--sticky-top) - 24px);
  display:flex;flex-direction:column;gap:10px;min-height:0}
.rail-head{display:flex;align-items:baseline;gap:8px;padding:2px 10px 6px;
  font-family:var(--f-ui);font-weight:600;font-size:.92rem;border-bottom:1px solid var(--line)}
.rail-tab{
  flex:1;font-family:var(--f-ui);font-size:.82rem;font-weight:500;color:var(--ink-2);
  padding:8px 6px;border-radius:var(--r-xs);display:flex;align-items:center;justify-content:center;gap:6px;
  transition:background .13s,color .13s;
}
.rail-tab:hover{color:var(--ink)}
.rail-tab[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.rail-list{overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:2px;padding-inline-end:2px;min-height:0}
.rail-group{font-family:var(--f-ui);font-size:.74rem;font-weight:600;color:var(--ink-3);
  padding:12px 10px 5px;letter-spacing:.02em}
.rail-item{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-xs);
  text-align:start;width:100%;transition:background .12s;position:relative;
}
.rail-item:hover{background:var(--surface-2)}
.rail-item[aria-current="true"]{background:var(--surface);box-shadow:var(--shadow)}
.rail-item[aria-current="true"]::before{
  content:"";position:absolute;inset-block:9px;inset-inline-start:0;width:3px;
  border-radius:2px;background:var(--stationcolor);
}
.rail-thumb{width:44px;height:34px;border-radius:5px;object-fit:cover;flex:none;background:var(--surface-2)}
.rail-txt{min-width:0;flex:1}
.rail-name{font-family:var(--f-ui);font-weight:500;font-size:.9rem;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-item[aria-current="true"] .rail-name{font-weight:600}
.rail-sub{font-size:.75rem;color:var(--ink-3)}
.rail-n{font-family:var(--f-ui);font-size:.78rem;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}

.detail{min-width:0}
.detail-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  min-height:52vh;text-align:center;color:var(--ink-2);
  border:1px dashed var(--line-ctl);border-radius:var(--r);padding:32px;
}
.detail-empty svg{width:30px;height:30px;color:var(--ink-3)}
.detail-empty b{font-family:var(--f-ui);font-weight:600;font-size:1.05rem;color:var(--ink)}

/* טאבי קטגוריה בתוך חלונית הפרטים */
.cat-tabs{
  display:flex;gap:4px;overflow-x:auto;padding:4px 0 10px;margin-top:18px;
  border-bottom:1px solid var(--line);scrollbar-width:none;
}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{
  font-family:var(--f-ui);font-size:.85rem;font-weight:500;color:var(--ink-2);
  padding:8px 13px;border-radius:var(--r-xs);white-space:nowrap;
  display:inline-flex;align-items:center;gap:7px;transition:background .13s,color .13s;
}
.cat-tab:hover{background:var(--surface-2);color:var(--ink)}
.cat-tab[aria-selected="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.cat-tab .n{font-size:.76rem;opacity:.72;font-variant-numeric:tabular-nums}
.cat-panel{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:16px}

@media (max-width:900px){
  /* בנייד אין מקום לשתי חלוניות. הרשימה היא הדף, והפרטים נכנסים מעליה. */
  .split{grid-template-columns:1fr}
  .rail{position:static;max-height:none}
  .rail-list{overflow:visible;max-height:none}
  .split.has-detail .rail{display:none}
  .split:not(.has-detail) .detail{display:none}
}
/* ---------- מזג אוויר והיתכנות ---------- */
.wx{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px 14px;margin-top:14px}
.wx-hd{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.wx-t{font-family:var(--f-ui);font-weight:600;font-size:.98rem}
.wx-tag{font-family:var(--f-ui);font-size:.72rem;font-weight:500;color:var(--ink-2);
  border:1px solid var(--line-ctl);border-radius:var(--r-xs);padding:2px 8px}
.wx-tag.is-live{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.wx-stats{display:flex;flex-wrap:wrap;gap:20px;margin:11px 0 13px}
.wx-stat b{display:block;font-family:var(--f-ui);font-weight:600;font-size:1.08rem;font-variant-numeric:tabular-nums}

.wx-eg{font-size:.73rem;color:var(--ink-3)}

.wx-fill{height:100%;border-radius:99px}

.fair{color:var(--gold)}       .wx-fill.fair{background:var(--gold)}
.poor{color:var(--rose)}       .wx-fill.poor{background:var(--rose)}
.wx-note{font-size:.79rem;color:var(--ink-3);margin:12px 0 0;max-width:62ch}
.feas{font-family:var(--f-ui);font-weight:600;font-size:.76rem;font-variant-numeric:tabular-nums;
  border:1px solid currentColor;border-radius:var(--r-xs);padding:1px 6px}

.sig-bib{background:var(--gold);color:#fff}

.quickbar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 2px}
.qbtn{
  display:inline-flex;align-items:center;gap:8px;font-family:var(--f-ui);font-weight:500;font-size:.85rem;
  background:var(--surface);border:1px solid var(--line-ctl);border-radius:var(--r-xs);padding:9px 15px;
  transition:border-color .13s;
}
.qbtn:hover{border-color:var(--brand)}
.qbtn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}

/* ---------- מדף אופקי ---------- */
.shelf{margin-top:26px}
.shelf-head{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.shelf-title{font-family:var(--f-ui);font-weight:600;font-size:.98rem;margin:0;display:flex;align-items:center;gap:8px}
.shelf-title svg{color:var(--ink-3)}
.shelf-count{font-size:.82rem;color:var(--ink-3);font-family:var(--f-ui)}
.rail{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 12px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.rail::-webkit-scrollbar{height:6px}
.rail::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}

.pcard.is-he,.rcard.is-he{direction:rtl;text-align:right}
.pcard,.rcard{

.rcard-where{direction:rtl;font-family:var(--f-ui);font-size:.76rem;color:var(--ink-3);display:flex;align-items:center;gap:6px}

.dotc{width:8px;height:8px;border-radius:2px;background:var(--stationcolor);flex:none}

.pcard-open:focus-visible::after{outline:2px solid var(--brand);outline-offset:-2px}
.pcard-name{font-family:var(--f-ui);font-weight:600;font-size:.94rem;line-height:1.3}
.pcard-why{font-size:.86rem;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pcard-meta{
  display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:auto;padding-top:8px;
  font-family:var(--f-ui);font-size:.79rem;color:var(--ink-2);position:relative;z-index:2;
}
.stars{color:var(--gold);letter-spacing:.05em;font-size:.76rem}
.money{font-weight:600;font-variant-numeric:tabular-nums}
.money.is-free{color:var(--brand)}
.warn{color:var(--rose);font-weight:500}
.fav{
  margin-inline-start:auto;width:30px;height:30px;border-radius:var(--r-xs);
  color:var(--ink-3);display:flex;align-items:center;justify-content:center;flex:none;
  transition:background .13s,color .13s;
}
.fav:hover{background:var(--surface-2);color:var(--rose)}
.fav[aria-pressed="true"]{color:var(--rose)}

.reslist{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin-top:12px}
.results-head{font-family:var(--f-ui);font-weight:500;color:var(--ink-2);margin:20px 0 0}
mark{background:var(--brand-soft);color:inherit;border-radius:3px;padding:0 2px;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px;text-decoration-color:var(--brand)}

/* ---------- אריחי נושא ---------- */
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:11px;margin-top:12px}
.topic{
  background:var(--surface);border:1px solid var(--line-ctl);border-radius:var(--r-sm);padding:15px;
  text-align:start;display:flex;flex-direction:column;gap:2px;transition:border-color .15s;
}
.topic:hover:not(:disabled){border-color:var(--brand)}
.topic svg{color:var(--ink-3);margin-bottom:5px}
.topic-n{font-family:var(--f-ui);font-weight:600;font-size:1.3rem;font-variant-numeric:tabular-nums}
.topic-l{font-family:var(--f-ui);font-size:.85rem;color:var(--ink-2)}
.topic:disabled{opacity:.5;cursor:default}

.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:12px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 15px}
.fact-l{font-family:var(--f-ui);font-size:.78rem;color:var(--ink-3);margin-bottom:2px}
.fact-v{font-family:var(--f-ui);font-weight:600;font-size:1.12rem;font-variant-numeric:tabular-nums;line-height:1.3}
.fact-s{font-size:.8rem;color:var(--ink-3);margin-top:2px}
.fxline{font-family:var(--f-ui);font-weight:600;font-size:1rem;font-variant-numeric:tabular-nums;direction:ltr;text-align:start}
.notecard{
  background:var(--surface-2);border-radius:var(--r-sm);padding:13px 15px;margin-top:22px;
  font-size:.87rem;color:var(--ink-2);
}
.notecard b{display:block;font-family:var(--f-ui);color:var(--ink);margin-bottom:3px;font-weight:600}
.creditlist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:5px;font-size:.81rem}
.creditlist li{display:flex;flex-wrap:wrap;gap:4px 9px;align-items:baseline;
  padding-block-end:5px;border-block-end:1px solid var(--line-soft)}
.creditlist li:last-child{border-block-end:none}
.cr-st{font-family:var(--f-ui);font-weight:600;color:var(--ink);min-width:9em}
.creditlist a{text-decoration:underline;text-underline-offset:2px;color:var(--ink-2)}
.cr-by{color:var(--ink-3);margin-inline-start:auto}

/* ---------- חלון פרטים ---------- */
dialog{border:none;padding:0;background:transparent;max-width:min(560px,94vw);width:100%;color:var(--ink)}
dialog::backdrop{background:rgba(10,13,17,.52)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);overflow:hidden}
.sheet-hd{padding:18px 20px 0;display:flex;gap:12px;align-items:flex-start}
.sheet-ttl{font-family:var(--f-ui);font-weight:600;font-size:1.15rem;line-height:1.28;margin:0}
.sheet-where{font-family:var(--f-ui);font-size:.81rem;color:var(--ink-3);margin-top:3px;display:flex;align-items:center;gap:6px}

.closebtn:hover{background:var(--surface-2);color:var(--ink)}
.sheet-bd{padding:13px 20px 20px;display:flex;flex-direction:column;gap:13px}
.sheet-what{color:var(--ink-2)}
.whybox{background:var(--brand-soft);border-radius:var(--r-sm);padding:12px 14px}
.whybox b{display:block;font-family:var(--f-ui);font-size:.77rem;font-weight:600;color:var(--brand);margin-bottom:2px}

.linkrow{display:flex;flex-wrap:wrap;gap:8px}

   כחול=מפות · ירוק=נסיעה/גראב · סגול=וואטסאפ · אדום=יוטיוב.

.botnav{display:none}
@media (max-width:880px){
  :root{
  scroll-padding-top:150px;scroll-padding-bottom:calc(var(--navh) + 14px);--navh:64px}
  .tabs{display:none}
  /* ארבע שורות כרום דביקות בולעות חצי מסך בנייד — הניווט התחתון מכסה את הצורך */
  .topbar{position:static}
  .botnav{
    display:flex;position:fixed;inset-inline:0;bottom:0;z-index:60;
    background:var(--surface);border-top:1px solid var(--line);
    padding:5px 4px calc(5px + env(safe-area-inset-bottom));
  }
  .bnav{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;

  .of-note{display:none}
}
.empty{padding:52px 16px;text-align:center;color:var(--ink-2)}
.empty svg{width:30px;height:30px;color:var(--ink-3);margin-bottom:8px}
/* ---------- רגע התנועה היחיד ----------
   חשיפה מדורגת של לוחות התחנה כשהם נכנסים למסך. שום דבר אחר בדף
   לא נכנס באנימציה — אחרת זה מפסיק להיות רגע ונהיה רעש. */
.scard{opacity:1}
.js-reveal .scard{opacity:0;transform:translateY(14px)}
.js-reveal .scard.is-in{
  opacity:1;transform:none;
  transition:opacity .55s cubic-bezier(.16,.84,.34,1) var(--d,0ms),
             transform .55s cubic-bezier(.16,.84,.34,1) var(--d,0ms);
}

   בחירת טקסט, סמן, פס גלילה וקו תחתון מגיעים עם ברירות מחדל שלא שייכות
   לשום מערכת עיצוב. צובעים אותם מהפלטה. */
::selection{background:var(--brand);color:var(--brand-ink)}
:root{caret-color:var(--brand);accent-color:var(--brand);scrollbar-color:var(--line-ctl) transparent}
*{scrollbar-width:thin}

a{text-underline-offset:3px;text-decoration-thickness:1px}

function hexToRgb(h){h=h.replace("#","");return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function ch(c){c/=255;return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4);}
function lum(r){return .2126*ch(r[0])+.7152*ch(r[1])+.0722*ch(r[2]);}
function ratio(a,b){var l1=lum(a),l2=lum(b);if(l1<l2){var t2=l1;l1=l2;l2=t2;}return (l1+.05)/(l2+.05);}
function shiftc(r,f){return r.map(function(v){return Math.max(0,Math.min(255,Math.round(f<1?v*f:v+(255-v)*(f-1))));});}
function hex(r){return "#"+r.map(function(v){return ("0"+v.toString(16)).slice(-2);}).join("");}
function desat(r,amt){var g=Math.round(.2126*r[0]+.7152*r[1]+.0722*r[2]);
  return r.map(function(v){return Math.round(v+(g-v)*amt);});}
var colorCache={};
function stColor(st){
  var isDark=currentDark(), key=st.id+"|"+isDark;
  if(colorCache[key]) return colorCache[key];
  var bg=hexToRgb(isDark?"#181c21":"#ffffff"), rgb=desat(hexToRgb(st.color),.22);
  for(var i=0;i<24&&ratio(rgb,bg)<3.2;i++) rgb=shiftc(rgb,isDark?1.12:0.87);
  return (colorCache[key]=hex(rgb));
}

/* ================= היתכנות לפי מזג אוויר =================
   אין אחוזים שמורים בשום מקום. ההיתכנות היא פונקציה טהורה שמחושבת
   ברגע התצוגה מתוך מזג האוויר העדכני ביותר שיש. לכן כל שינוי בתחזית
   משתקף מעצמו בטעינה הבאה — אין מה "לחשב מחדש" ואין מה לרענן ידנית.

   שני מקורות, בסדר עדיפות:
     1. תחזית חיה  — כשהתאריך בטווח ~16 יום. גוברת תמיד.
     2. נורמות אקלים — ממוצע 6 שנים. גיבוי בלבד, מסומן ככזה.
   התחזית לא מגיעה מעבר ל-16 יום, ולכן עד אמצע אוקטובר יוצג מצב 2. */

var WX_TTL_MS=30*60*1000;                 /* התחזית נשמרת חצי שעה ואז נמשכת מחדש */
var wxCache={};

/* כמה כל סוג פעילות נפגע מגשם. ברירת מחדל לפי קטגוריה,
   וניתן לדרוס פר-רשומה בשדה `weather`. */
var SENS_BY_CAT={
  must_see:"medium", attractions:"high", markets:"medium", street_food:"medium",
  food:"medium", restaurants:"low", hotels:"low", nightlife:"low",
  spa:"low", logistics:"medium", contacts:"low"
};
var SENS_FACTOR={high:1.0, medium:0.55, low:0.12};
function sensOf(rec,cat){
  return rec && rec.weather ? rec.weather : (SENS_BY_CAT[cat]||"medium");
}

/* מזג האוויר של תחנה: תחזית חיה אם אפשר, אחרת נורמה אקלימית. */
function weatherFor(st){
  var c=wxCache[st.id];
  if(c && (Date.now()-c.at)<WX_TTL_MS) return c.data;
  var norm=(typeof CLIMATE!=="undefined" && CLIMATE[st.id])||null;
  var fallback=norm?{rainProb:Math.min(1,norm.rd/30),tmax:norm.tmax,tmin:norm.tmin,
                     mm:norm.mm,source:"climate",days:30}:null;
  /* המשיכה אסינכרונית. הקריאה הראשונה מחזירה נורמה, וכשהתחזית נוחתת
     הדף מצייר מחדש עם המספר האמיתי. תחת CSP של Artifact זה פשוט נכשל בשקט. */
  if(!c){
    wxCache[st.id]={at:Date.now(),data:fallback};
    fetchForecast(st);
  }
  return (wxCache[st.id]&&wxCache[st.id].data)||fallback;
}
function fetchForecast(st){
  try{
    var u="https://api.open-meteo.com/v1/forecast?latitude="+st.lat+"&longitude="+st.lng+
          "&daily=precipitation_sum,precipitation_probability_max,temperature_2m_max,temperature_2m_min"+
          "&forecast_days=16&timezone=Asia%2FBangkok";
    fetch(u,{cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).then(function(j){
      if(!j||!j.daily||!j.daily.time||!j.daily.time.length) return;
      var d=j.daily;
      var probs=(d.precipitation_probability_max||[]).filter(function(v){return v!=null;});
      var avgProb=probs.length?probs.reduce(function(a,b){return a+b;},0)/probs.length/100:null;
      if(avgProb==null) return;
      wxCache[st.id]={at:Date.now(),data:{
        rainProb:avgProb,
        tmax:Math.round(avg(d.temperature_2m_max)*10)/10,
        tmin:Math.round(avg(d.temperature_2m_min)*10)/10,
        mm:Math.round(sum(d.precipitation_sum)),
        source:"forecast", days:d.time.length, from:d.time[0], to:d.time[d.time.length-1]
      }};
      render();                          /* התחזית השתנתה — המסך מצייר את עצמו מחדש */
    }).catch(function(){});
  }catch(e){}
}
function avg(a){a=(a||[]).filter(function(v){return v!=null;});return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:0;}
function sum(a){a=(a||[]).filter(function(v){return v!=null;});return a.reduce(function(x,y){return x+y;},0);}

/* הפונקציה עצמה: רגישות הפריט × הסיכוי לגשם. */
function feasibility(rec,cat,st){
  var wx=weatherFor(st);
  if(!wx) return null;
  var f=SENS_FACTOR[sensOf(rec,cat)];
  var pct=Math.max(5,Math.min(99,Math.round(100-wx.rainProb*100*f)));
  return {pct:pct,sens:sensOf(rec,cat),source:wx.source,wx:wx};
}

};
function photoAlt(st){
  var a=PHOTO_ALT[st.id];
  return a?(isHe()?a.he:a.en):"";
}
function hasPhoto(st){return typeof STATION_PHOTO!=="undefined" && !!STATION_PHOTO[st.id];}

var sceneCache={};
function scene(st,w,h){
  var key=st.id+"|"+w+"|"+h+"|"+currentDark();
  if(sceneCache[key]) return sceneCache[key];
  var dpr=Math.min(window.devicePixelRatio||1,2);
  var cv=document.createElement("canvas");
  cv.width=w*dpr; cv.height=h*dpr;
  var g=cv.getContext("2d"); g.scale(dpr,dpr);
  paint(g,w,h,st);
  return (sceneCache[key]=cv.toDataURL("image/png"));
}
function mix(a,b,tt){a=hexToRgb(a);b=hexToRgb(b);return hex([0,1,2].map(function(i){return Math.round(a[i]+(b[i]-a[i])*tt);}));}
function paint(g,w,h,st){
  var dark=currentDark();
  /* הגוון מרוסן: הצבע מוחלש לפני שהוא נוגע בנוף, אחרת מתקבל ממשק ממתקים. */
  var base=hex(desat(hexToRgb(st.color),.42));
  var SKY_T=dark?"#141a24":"#d5dee4", SKY_B=dark?"#1e2733":"#eae3d8";
  var LAND =dark?"#182b27":"#3c6154", WATER=dark?"#16262f":"#75989f";
  var sky1=mix(SKY_T,base,dark?.10:.13), sky2=mix(SKY_B,base,dark?.15:.18);
  var grad=g.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,sky1); grad.addColorStop(1,sky2);
  g.fillStyle=grad; g.fillRect(0,0,w,h);

  g.fillStyle=dark?"rgba(228,224,208,.20)":"rgba(255,252,240,.62)";
  g.beginPath(); g.arc(w*0.79,h*0.26,h*0.088,0,Math.PI*2); g.fill();

  var kind=SCENE[st.id]||"hills";
  var tint=dark?.24:.28;
  var far =mix(mix(LAND,base,tint),dark?"#0a0f14":"#ffffff",dark?.28:.30);
  var mid =mix(mix(LAND,base,tint),dark?"#0a0f14":"#ffffff",dark?.12:.13);
  var near=mix(mix(LAND,base,tint),dark?"#0a0f14":"#0e1a16",dark?.02:.12);
  var wat =mix(WATER,base,dark?.14:.17);

  function ridge(color,baseY,amp,step,jag){
    g.fillStyle=color; g.beginPath(); g.moveTo(0,h); g.lineTo(0,baseY);
    var x=0,i=0;
    while(x<=w){
      var tv=Math.sin((i*jag)+st.seq)*0.5+Math.sin(i*jag*2.3+st.seq*2)*0.5;
      g.lineTo(x,baseY-amp*tv); x+=step; i++;
    }
    g.lineTo(w,h); g.closePath(); g.fill();
  }
  function spikes(color,baseY,minH,maxH,count,seed){
    g.fillStyle=color; g.beginPath(); g.moveTo(0,h); g.lineTo(0,baseY);
    for(var i=0;i<count;i++){
      var x0=(i/count)*w, x1=((i+1)/count)*w;
      var hh=minH+(maxH-minH)*(0.5+0.5*Math.sin(i*2.7+seed));
      g.lineTo(x0+(x1-x0)*0.18,baseY);
      g.lineTo(x0+(x1-x0)*0.5,baseY-hh);
      g.lineTo(x1-(x1-x0)*0.12,baseY);
    }
    g.lineTo(w,h); g.closePath(); g.fill();
  }
  function towers(color,baseY,minH,maxH,count,seed,wr){
    g.fillStyle=color;
    for(var i=0;i<count;i++){
      var cx=((i+0.5)/count)*w+w*0.02*Math.sin(i*3.1+seed);
      var hh=minH+(maxH-minH)*(0.5+0.5*Math.sin(i*2.4+seed));
      var hw=(w/count)*wr;
      g.beginPath(); g.moveTo(cx-hw,baseY);
      g.quadraticCurveTo(cx-hw*0.82,baseY-hh*0.72,cx,baseY-hh);
      g.quadraticCurveTo(cx+hw*0.82,baseY-hh*0.72,cx+hw,baseY);
      g.closePath(); g.fill();
    }
    g.fillRect(0,baseY,w,h-baseY);
  }
  function water(y,color){
    g.fillStyle=color; g.fillRect(0,y,w,h-y);
    g.strokeStyle="rgba(255,255,255,.20)"; g.lineWidth=1.2;
    for(var i=0;i<4;i++){
      var yy=y+9+i*((h-y)/5);
      g.beginPath(); g.moveTo(w*(0.07+0.10*i),yy); g.lineTo(w*(0.28+0.10*i),yy); g.stroke();
    }
  }
  function skyline(color,baseY){
    g.fillStyle=color; var x=0,i=0;
    while(x<w){
      var bw=w*(0.045+0.035*((i*7)%3)/2);
      var bh=h*(0.15+0.28*(0.5+0.5*Math.sin(i*1.9+st.seq)));
      g.fillRect(x,baseY-bh,bw-2,bh+(h-baseY));
      x+=bw+w*0.012; i++;
    }
  }

  if(kind==="karst"){
    /* צר וגבוה — אחרת המגדלים נקראים כגבעות ונין בין נראית כמו סאפה */
    towers(far,h*0.76,h*0.34,h*0.62,11,st.seq,0.24);
    towers(mid,h*0.82,h*0.24,h*0.46,8,st.seq+3,0.28);
    water(h*0.82,wat);
    towers(near,h*0.84,h*0.16,h*0.32,5,st.seq+9,0.32);
  }else if(kind==="terraces"){
    ridge(far,h*0.50,h*0.13,w/9,0.9);
    g.fillStyle=mid;
    for(var tr=0;tr<7;tr++){
      g.beginPath();
      var yy=h*0.57+tr*(h*0.062);
      g.moveTo(0,yy);
      for(var x2=0;x2<=w;x2+=w/10){ g.lineTo(x2,yy-h*0.024*Math.sin(x2/w*3.1+tr)); }
      g.lineTo(w,yy+h*0.045);
      for(var x3=w;x3>=0;x3-=w/10){ g.lineTo(x3,yy+h*0.045-h*0.024*Math.sin(x3/w*3.1+tr)); }
      g.closePath(); g.globalAlpha=0.52+0.06*tr; g.fill(); g.globalAlpha=1;
    }
  }else if(kind==="city"){
    ridge(far,h*0.60,h*0.06,w/7,0.8);
    water(h*0.86,wat);
    skyline(mid,h*0.74);
  }else if(kind==="beach"){
    g.fillStyle=far;
    g.beginPath(); g.moveTo(w*0.55,h*0.58);
    g.quadraticCurveTo(w*0.70,h*0.42,w*0.86,h*0.58); g.closePath(); g.fill();
    water(h*0.58,wat);
    g.fillStyle=dark?mix("#b8ab8c","#0a0f14",.55):mix("#e6dac0","#ffffff",.20);
    g.beginPath(); g.moveTo(0,h*0.79);
    for(var x4=0;x4<=w;x4+=w/10){ g.lineTo(x4,h*0.79-h*0.020*Math.sin(x4/w*3.4+st.seq)); }
    g.lineTo(w,h); g.lineTo(0,h); g.closePath(); g.fill();
    [[0.13,1.0],[0.26,0.72]].forEach(function(p){
      var bx=w*p[0], by=h*0.84, top=h*(0.84-0.36*p[1]), sway=w*0.035*p[1];
      g.strokeStyle=near; g.lineWidth=3.6*p[1]; g.lineCap="round";
      g.beginPath(); g.moveTo(bx,by); g.quadraticCurveTo(bx+sway*0.4,(by+top)/2,bx+sway,top); g.stroke();
      g.fillStyle=near;
      for(var f=0;f<6;f++){
        var ang=Math.PI*(0.08+f*0.17);
        var ex=bx+sway+Math.cos(ang)*w*0.072*p[1], ey=top+Math.sin(ang)*h*0.072*p[1]-h*0.012;
        g.beginPath(); g.moveTo(bx+sway,top);
        g.quadraticCurveTo((bx+sway+ex)/2,(top+ey)/2-h*0.042*p[1],ex,ey);
        g.quadraticCurveTo((bx+sway+ex)/2,(top+ey)/2+h*0.012,bx+sway,top);
        g.fill();
      }
    });
  }else if(kind==="lake"){
    ridge(far,h*0.55,h*0.10,w/8,0.75);
    ridge(mid,h*0.66,h*0.08,w/6,1.1);
    water(h*0.70,wat);
  }else if(kind==="delta"){
    ridge(far,h*0.52,h*0.05,w/9,0.6);
    water(h*0.58,wat);
    g.fillStyle=near;
    for(var b=0;b<3;b++){
      var bx2=w*(0.20+b*0.26), by2=h*(0.74+b*0.055);
      g.beginPath(); g.moveTo(bx2-w*0.05,by2);
      g.quadraticCurveTo(bx2,by2+h*0.05,bx2+w*0.05,by2); g.closePath(); g.fill();
    }
  }else if(kind==="lanterns"){
    ridge(far,h*0.64,h*0.05,w/8,0.7);
    water(h*0.84,wat);
    skyline(mid,h*0.78);
    var hues=["#c9922c","#b0553f","#a8567e","#cfc4ae"];
    var wireY=h*0.13;
    g.strokeStyle=dark?"rgba(228,224,208,.26)":"rgba(50,40,28,.26)";
    g.lineWidth=1.1; g.beginPath(); g.moveTo(0,wireY);
    g.quadraticCurveTo(w*0.5,wireY+h*0.055,w,wireY); g.stroke();
    for(var L=0;L<9;L++){
      var tx=(L+0.5)/9, lx=tx*w;
      var ly=wireY+h*0.055*(1-Math.pow(2*tx-1,2))+h*0.045;
      g.strokeStyle=dark?"rgba(228,224,208,.22)":"rgba(50,40,28,.22)";
      g.beginPath(); g.moveTo(lx,ly-h*0.045); g.lineTo(lx,ly); g.stroke();
      g.fillStyle=hues[L%4];
      g.beginPath(); g.ellipse(lx,ly+h*0.048,w*0.0115,h*0.05,0,0,Math.PI*2); g.fill();
    }
  }else if(kind==="pines"){
    ridge(far,h*0.57,h*0.10,w/8,0.8);
    ridge(mid,h*0.69,h*0.07,w/6,1.2);
    g.fillStyle=near;
    for(var p2=0;p2<11;p2++){
      var px=w*(0.03+p2*0.092), ph=h*(0.15+0.10*(0.5+0.5*Math.sin(p2*2.1+st.seq)));
      g.beginPath(); g.moveTo(px,h*0.86); g.lineTo(px+w*0.022,h*0.86-ph); g.lineTo(px+w*0.044,h*0.86);
      g.closePath(); g.fill();
    }
  }else if(kind==="river"){
    ridge(far,h*0.53,h*0.09,w/8,0.8);
    ridge(mid,h*0.65,h*0.06,w/6,1.0);
    water(h*0.72,wat);
    g.fillStyle=near;
    g.beginPath(); g.moveTo(w*0.30,h*0.66);
    g.quadraticCurveTo(w*0.44,h*0.55,w*0.58,h*0.66);
    g.lineTo(w*0.56,h*0.70); g.lineTo(w*0.32,h*0.70); g.closePath(); g.fill();
  }else if(kind==="peaks"){
    spikes(far,h*0.72,h*0.24,h*0.46,5,st.seq);
    spikes(mid,h*0.80,h*0.16,h*0.32,7,st.seq+4);
    ridge(near,h*0.88,h*0.05,w/7,1.4);
  }else{
    ridge(far,h*0.56,h*0.11,w/8,0.8);
    ridge(mid,h*0.68,h*0.09,w/6,1.1);
    ridge(near,h*0.80,h*0.06,w/5,1.5);
  }
}

/* ============ עזרים ============ */
function el(tag,cls,txt){var n=document.createElement(tag);if(cls)n.className=cls;if(txt!=null)n.textContent=txt;return n;}
function en2(n){n.lang="en";n.dir="ltr";n.classList.add("en");return n;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function hl(txt){
  if(!query) return esc(txt);
  var i=txt.toLowerCase().indexOf(query);
  if(i<0) return esc(txt);
  return esc(txt.slice(0,i))+"<mark>"+esc(txt.slice(i,i+query.length))+"</mark>"+esc(txt.slice(i+query.length));
}
function total(st){return CATS.reduce(function(s,c){return s+((st.poi[c.id]||[]).length);},0);}
function mapsUrl(r,st){
  return r.lat!=null?"https://www.google.com/maps/search/?api=1&query="+r.lat+","+r.lng
    :"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(r.name+", "+st.name+", Vietnam");
}
function rideUrl(r,st){
  return r.lat!=null?"https://www.google.com/maps/dir/?api=1&destination="+r.lat+","+r.lng+"&travelmode=driving"
    :"https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(r.name+", "+st.name)+"&travelmode=driving";
}
function vidUrl(r,st){return r.video||"https://www.youtube.com/results?search_query="+encodeURIComponent(r.name+" "+st.name);}
/* wa.me רוצה ספרות בלבד, בלי פלוס, מקפים או רווחים */
function waUrl(num){return "https://wa.me/"+String(num).replace(/[^\d]/g,"");}
function brandOf(u){
  try{var p=new URL(u).hostname.split(".");if(p.length>1)p.pop();
      if(p.length>1&&(p[p.length-1]==="co"||p[p.length-1]==="com"))p.pop();
      return p[p.length-1];}catch(e){return u;}
}
function say(m){document.getElementById("live").textContent=m;}
function currentDark(){
  var s=document.documentElement.getAttribute("data-theme");
  return s?s==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches;
}

/* ============ כפתור שמירה ============ */
function favBtn(item){
  var b=el("button","fav"); b.type="button";
  function sync(){
    var on=favs.has(item.key);
    b.textContent="";
    b.appendChild(icon("heart"));
    b.setAttribute("aria-pressed",on?"true":"false");
    b.setAttribute("aria-label",(on?t("unsave"):t("save"))+": "+item.rec.name);
  }
  sync();
  b.addEventListener("click",function(e){
    e.preventDefault(); e.stopPropagation();
    if(favs.has(item.key)) favs.delete(item.key); else favs.add(item.key);
    saveFavs(); sync();
    say((favs.has(item.key)?t("saved"):t("removed"))+": "+item.rec.name);
    renderChrome();
    if(routeName()==="saved") render();
  });
  return b;
}

/* ============ חלון פרטים ============ */
var dlg=document.getElementById("dlg"), lastFocus=null;
function openDetail(item){
  var r=item.rec, st=item.station;
  lastFocus=document.activeElement;
  dlg.textContent="";
  var sh=el("div","sheet");

  var hd=el("div","sheet-hd"), box=el("div");
  var ttl=en2(el("h2","sheet-ttl",r.name)); ttl.id="dlgTitle";
  box.appendChild(ttl);
  var wh=el("div","sheet-where");
  var d=el("span","dotc"); d.style.setProperty("--stationcolor",stColor(st));
  wh.appendChild(d);
  wh.appendChild(document.createTextNode(stName(st)+" · "+catName(CAT_BY[item.cat])));
  box.appendChild(wh);
  hd.appendChild(box);
  var cb=el("button","closebtn"); cb.type="button";
  cb.setAttribute("aria-label",t("close")); cb.appendChild(icon("close"));
  cb.addEventListener("click",function(){dlg.close();});
  hd.appendChild(cb);
  sh.appendChild(hd);

  var he=cardIsHe(r);
  var bd=el("div","sheet-bd");
  if(he){ bd.dir="rtl"; bd.lang="he"; }
  function txt(tag,cls,s){ var n=el(tag,cls,s); if(!he) en2(n); return n; }
  if(recArea(r)) bd.appendChild(txt("div","sheet-where",recArea(r)));
  bd.appendChild(txt("p","sheet-what",recWhat(r)));
  if(recWhy(r)){
    var wb=el("div","whybox");
    wb.appendChild(el("b",null,t("whyHere")));
    wb.appendChild(txt("div",null,recWhy(r)));
    bd.appendChild(wb);
  }
  var facts=el("div","factrow");
  var sg2=SIGNAL[r.signal];
  if(sg2) facts.appendChild(el("span","sig "+sg2.cls,isHe()?sg2.he:sg2.en));
  if(r.tier){
    var s=el("span","stars","★".repeat(r.tier)+"☆".repeat(5-r.tier));
    s.setAttribute("role","img");
    s.setAttribute("aria-label",t("stars5",{"%n":r.tier})+(r.tierOfficial===false?", "+t("selfRated"):""));
    facts.appendChild(s);
    if(r.tierOfficial===false) facts.appendChild(el("span",null,t("selfRated")));
  }
  var ct2=costText(r);
  if(ct2){
    facts.appendChild(el("span","money"+(r.priceUnit==="free"?" is-free":""),ct2));
    if(r.priceChecked) facts.appendChild(el("span",null,t("checked")+" "+r.priceChecked));
  }
  if(r.avoid) facts.appendChild(el("span","warn",t("avoid")));
  if(r.approx) facts.appendChild(el("span",null,t("approx")));
  if(r.lat==null) facts.appendChild(el("span",null,t("noCoords")));
  if(facts.childNodes.length) bd.appendChild(facts);

  var lr=el("div","linkrow");
  /* כחול=מפות, ירוק=נסיעה, אדום=יוטיוב, סגול=וואטסאפ */
  lr.appendChild(lbtn("act-map is-primary","pin",t("openMap"),mapsUrl(r,st),r.name));
  lr.appendChild(lbtn("act-ride","car",t("ride"),rideUrl(r,st),r.name));
  lr.appendChild(lbtn("act-video","play",t("video"),vidUrl(r,st),r.name));
  if(r.whatsapp) lr.appendChild(lbtn("act-chat","chat",t("whatsapp"),waUrl(r.whatsapp),r.name));
  bd.appendChild(lr);

  if((r.sources||[]).length){
    var sl=el("div","srcline");
    sl.appendChild(el("span",null,t("sources")));
    r.sources.forEach(function(u){
      var a=el("a",null,brandOf(u));
      a.href=u; a.target="_blank"; a.rel="noopener noreferrer";
      a.appendChild(el("span","sr",t("newTab")));
      sl.appendChild(a);
    });
    bd.appendChild(sl);
  }
  sh.appendChild(bd);
  dlg.appendChild(sh);
  dlg.showModal();
  cb.focus();
}
function lbtn(cls,ic,label,href,name){
  var a=el("a","lbtn "+cls);
  a.href=href; a.target="_blank"; a.rel="noopener noreferrer";
  a.appendChild(icon(ic));
  a.appendChild(document.createTextNode(label));
  a.appendChild(el("span","sr"," — "+name+t("newTab")));
  return a;
}
dlg.addEventListener("close",function(){ if(lastFocus&&lastFocus.focus) lastFocus.focus(); });
dlg.addEventListener("click",function(e){ if(e.target===dlg) dlg.close(); });

/* ============ כרטיס מקום ============ */
function poiCard(item,cls){
  var r=item.rec, st=item.station;
  var card=el("div",cls||"pcard");
  card.style.setProperty("--stationcolor",stColor(st));

  if(cls==="rcard"){
    var wr=el("div","rcard-where");
    var dt=el("span","dotc"); dt.style.setProperty("--stationcolor",stColor(st));
    wr.appendChild(dt);
    wr.appendChild(document.createTextNode(stName(st)+" · "+catName(CAT_BY[item.cat])));
    card.appendChild(wr);
  }
  /* הכרטיס עוקב אחרי שפת התוכן שלו, לא אחרי שפת הממשק —
     טקסט אנגלי בכרטיס RTL שובר את הפיסוק. */
  var he=cardIsHe(r);
  if(he){ card.dir="rtl"; card.lang="he"; card.classList.add("is-he"); }

  var h=el("h4","pcard-h");
  var open=el("button","pcard-open"); open.type="button";
  open.setAttribute("aria-haspopup","dialog");

  return card;
}

var main=document.getElementById("main");

   בלעדיה ניווט-לפי-כותרות לא מוצא נקודת התחלה, ומסך החיפוש התחיל ב-h3. */
function screenTitle(text,cls){

/* ============ תצוגה מפוצלת ============
   מסך אחד: רשימה קבועה בצד, פרטים לצידה. מעבר בין תחנות מחליף
   את חלונית הפרטים בלבד — הרשימה לא נבנית מחדש ולא מאבדת גלילה. */
function screenSplit(sel){

function buildRail(){

     ניווט שעושות אותו דבר הן בלבול. הרשימה נשארת רשימה. */

/* רגע התנועה היחיד בדף: חשיפה מדורגת של הלוחות בכניסה למסך.
   בלי IntersectionObserver או כשהמשתמש ביקש פחות תנועה, הכיתה
   js-reveal לא נוספת כלל ולכן אין ממה להתאושש. */
var wantsMotion=!window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function revealPlates(){
  var plates=main.querySelectorAll(".scard");
  if(!plates.length||!wantsMotion||!("IntersectionObserver" in window)) return;
  main.classList.add("js-reveal");
  var io=new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(!e.isIntersecting) return;
      var i=Array.prototype.indexOf.call(e.target.parentNode.children,e.target);
      e.target.style.setProperty("--d",Math.min(i,5)*70+"ms");
      e.target.classList.add("is-in");
      io.unobserve(e.target);
    });
  },{rootMargin:"0px 0px -8% 0px",threshold:0.08});
  Array.prototype.forEach.call(plates,function(p){io.observe(p);});
}

function stationCard(st){
  var a=el("a","scard");
  a.href="#s/"+st.id;
  a.style.setProperty("--stationcolor",stColor(st));
  var img=el("img","scene");
  /* שם התחנה מוטבע על התצלום, אז התצלום עצמו דקורטיבי ולא חוזר עליו */
  img.src=hasPhoto(st)?STATION_PHOTO[st.id]:scene(st,640,400);
  img.alt=""; img.loading="lazy"; img.decoding="async";
  a.appendChild(img);
  a.appendChild(el("span","seqbadge",String(st.seq).padStart(2,"0")));

  var bd=el("div","scard-body");
  bd.appendChild(el("h3","scard-name",stName(st)));
  if(isHe()) bd.appendChild(en2(el("div","scard-sub",st.name)));
  else bd.appendChild(el("div","scard-sub",REGIONS.filter(function(r){return r.id===st.region;}).map(regName)[0]||""));

  /* על הלוח מוצגות רק שלוש הקטגוריות הגדולות. השאר בעמוד התחנה —
     ארבע עשרה שורות של תגיות על תצלום הן רעש, לא מידע. */
  var top=CATS.map(function(c){return {c:c,n:(st.poi[c.id]||[]).length};})
              .filter(function(x){return x.n;})
              .sort(function(x,y){return y.n-x.n;}).slice(0,3);
  var pr=el("div","pillrow");
  top.forEach(function(x){
    var p=el("span","pill");
    p.appendChild(icon(x.c.ic));
    p.appendChild(document.createTextNode(catName(x.c)+" "));
    p.appendChild(el("b",null,String(x.n)));
    pr.appendChild(p);
  });
  if(total(st)<=5) pr.appendChild(el("span","pill thin",t("thin")));
  bd.appendChild(pr);
  a.appendChild(bd);
  a.setAttribute("aria-label",stName(st)+", "+total(st)+" "+t("places"));
  return a;
}

function weatherStrip(st){
  var wx=weatherFor(st);
  var box=el("section","wx");
  if(!wx){ return box; }
  var live=wx.source==="forecast";
  box.setAttribute("aria-label",t("wxTitle"));

  var hd=el("div","wx-hd");
  var tag=el("span","wx-tag"+(live?" is-live":""),live?t("wxLive"):t("wxClimate"));
  hd.appendChild(el("span","wx-t",t("wxTitle")));
  hd.appendChild(tag);
  box.appendChild(hd);

  var stats=el("div","wx-stats");
  stats.appendChild(wxStat(Math.round(wx.tmin)+"–"+Math.round(wx.tmax)+"°",t("wxTemp")));
  stats.appendChild(wxStat(Math.round(wx.rainProb*100)+"%",t("wxRainChance")));
  stats.appendChild(wxStat(wx.mm+" mm",t("wxRainTotal")));
  box.appendChild(stats);

  /* שלוש רמות הרגישות, מחושבות עכשיו מאותו מזג אוויר */
  var rows=el("div","wx-rows");
  [["high",t("sensHigh"),t("sensHighEg")],
   ["medium",t("sensMed"),t("sensMedEg")],
   ["low",t("sensLow"),t("sensLowEg")]].forEach(function(r){
    var p=Math.max(5,Math.min(99,Math.round(100-wx.rainProb*100*SENS_FACTOR[r[0]])));
    var row=el("div","wx-row");
    var lab=el("div","wx-lab");
    lab.appendChild(el("b",null,r[1]));
    lab.appendChild(el("span","wx-eg",r[2]));
    row.appendChild(lab);
    var bar=el("div","wx-bar");
    var fill=el("div","wx-fill "+feasBand(p));
    fill.style.width=p+"%";
    bar.appendChild(fill);
    row.appendChild(bar);
    row.appendChild(el("div","wx-pct "+feasBand(p),p+"%"));
    row.setAttribute("role","img");
    row.setAttribute("aria-label",r[1]+": "+p+"% "+t("wxFeasible"));
    rows.appendChild(row);
  });
  box.appendChild(rows);
  box.appendChild(el("p","wx-note",live?t("wxNoteLive"):t("wxNoteClimate",{"%d":wx.days})));
  return box;
}
function wxStat(v,l){
  var d=el("div","wx-stat");

  d.appendChild(el("span",null,l));

}
/* פרטי התחנה בתוך החלונית. הקטגוריות הן טאבים ולא מדפים —

  var filled=CATS.filter(function(c){return (st.poi[c.id]||[]).length;});

    e.appendChild(icon("compass","ic-lg"));
    e.appendChild(document.createTextNode(t("thinTitle")));
    pane.appendChild(e);
    return;
  }

  var tabs=el("div","cat-tabs");
  tabs.setAttribute("role","tablist");
  tabs.setAttribute("aria-label",t("navTopics"));
  var panel=el("div","cat-panel");
  panel.id="catPanel";

  function show(cat){
    panel.textContent="";

      panel.appendChild(poiCard({rec:r,cat:cat,station:st,key:st.id+"|"+cat+"|"+r.name},"rcard"));
    });
    Array.prototype.forEach.call(tabs.children,function(b){
      b.setAttribute("aria-selected",b.getAttribute("data-cat")===cat?"true":"false");
      b.tabIndex=b.getAttribute("data-cat")===cat?0:-1;
    });
    panel.setAttribute("aria-label",catName(CAT_BY[cat])+" · "+stName(st));

  filled.forEach(function(c){

    b.appendChild(el("span","n",String((st.poi[c.id]||[]).length)));
    b.addEventListener("click",function(){show(c.id);});
    /* חצים מזיזים בין טאבים, כמו שתבנית tablist מצפה */
    b.addEventListener("keydown",function(e){
      var d=e.key==="ArrowRight"?1:e.key==="ArrowLeft"?-1:0;
      if(!d) return;
      e.preventDefault();
      var kids=Array.prototype.slice.call(tabs.children);
      var i=kids.indexOf(b), nx=kids[(i+d+kids.length)%kids.length];
      nx.focus(); nx.click();
    });
    tabs.appendChild(b);
  });
  pane.appendChild(tabs);
  pane.appendChild(panel);
  show(filled[0].id);

    var g=el("div","notecard");

    g.appendChild(document.createTextNode(t("thinBody",{"%n":total(st)})));

  n.appendChild(el("b",null,t("rateNote")));
  n.appendChild(document.createTextNode(t("rateNoteBody")));
  main.appendChild(n);

  /* רישיונות CC BY / CC BY-SA מחייבים ייחוס — זה לא נחמדות */
  if(typeof PHOTO_CREDIT!=="undefined"){
    var c=el("div","notecard");
    c.appendChild(el("b",null,t("credits")));
    c.appendChild(document.createTextNode(t("creditsNote")));
    var ul=el("ul","creditlist");
    STATIONS.forEach(function(st){
      var cr=PHOTO_CREDIT[st.id]; if(!cr) return;
      var li=el("li");
      li.appendChild(el("span","cr-st",stName(st)));
      var a=el("a",null,cr.t);
      a.href=cr.u; a.target="_blank"; a.rel="noopener noreferrer";
      a.lang="en"; a.dir="ltr";
      a.appendChild(el("span","sr",t("newTab")));
      li.appendChild(a);
      li.appendChild(en2(el("span","cr-by",cr.a+" · "+cr.l)));
      ul.appendChild(li);
    });
    c.appendChild(ul);
    main.appendChild(c);
  }
}
/* ערך לטיני בתוך כרטיס עברי חייב dir מפורש — אחרת "26 Oct" מוצג "Oct 26". */
function fact(label,value,sub,latin){
  var d=el("div","fact");
  d.appendChild(el("div","fact-l",label));
  var v=el("div","fact-v",value);
  if(latin) en2(v);
  d.appendChild(v);
  if(sub){
    var s=el("div","fact-s",sub);
    if(!/[֐-׿]/.test(sub)) en2(s);
    d.appendChild(s);
  }
  return d;
}

function screenSearch(){
  main.textContent="";
  var hits=INDEX.filter(function(x){return x.hay.indexOf(query)>=0;});
  var h=screenTitle("","results-head");
  h.appendChild(document.createTextNode(hits.length+" "+t("results")+" "+t("resultsFor")+" "));
  var b=document.createElement("bdi"); b.textContent="“"+query+"”";
  h.appendChild(b);
  main.appendChild(h);
  say(hits.length+" "+t("results"));
  if(!hits.length){
    var d=el("div","empty");
    d.appendChild(icon("search","ic-lg"));
    d.appendChild(document.createTextNode(t("noResults")));
    main.appendChild(d);
    return;
  }
  main.appendChild(cardsByStation(hits));
}

/* ============ ניתוב ============ */
function routeName(){
  var hz=decodeURIComponent(location.hash.replace(/^#/,""));
  if(query) return "search";
  if(hz.indexOf("s/")===0) return "station";
  if(hz.indexOf("c/")===0) return "category";
  if(hz==="topics") return "topics";
  if(hz==="saved") return "saved";
  if(hz==="info") return "info";
  return "home";
}
function render(){
  var hz=decodeURIComponent(location.hash.replace(/^#/,""));
  var r=routeName();
  /* בית ותחנה חולקים מסך אחד — רק חלונית הפרטים מתחלפת ביניהם */
  if(r==="search")        screenSearch();
  else if(r==="station")  screenSplit(POI_DATA[hz.slice(2)]||null);
  else if(r==="category") screenCategory(hz.slice(2));
  else if(r==="topics")   screenTopics();
  else if(r==="saved")    screenSaved();
  else if(r==="info")     screenInfo();
  else                    screenSplit(null);
  markNav(r);
}
var NAV=[
  {id:"home",  hash:"#",       ic:"grid",   key:"navStations"},
  {id:"topics",hash:"#topics", ic:"compass",key:"navTopics"},
  {id:"saved", hash:"#saved",  ic:"heart",  key:"navSaved"},
  {id:"info",  hash:"#info",   ic:"info",   key:"navInfo"}
];
function markNav(r){
  var wants = (r==="category")?"topics":(r==="station"?"home":r);
  if(r==="search") wants=null;
  Array.prototype.forEach.call(document.querySelectorAll("[data-nav]"),function(n){
    if(n.getAttribute("data-nav")===wants) n.setAttribute("aria-current","page");
    else n.removeAttribute("aria-current");
  });
}
window.addEventListener("hashchange",function(){
  /* הקלדה בחיפוש מנקה את ה-hash. בלי השמירה הזו הפוקוס נגנב מהתיבה
     אחרי כל 300ms והמשתמש לא יכול לחפש משום מסך פנימי. */
  var typing=document.activeElement===qEl;
  render();
  if(typing) return;
  var h=document.getElementById("screenHeading");
  if(h){h.focus();}else{document.getElementById("main").focus();}
  window.scrollTo(0,0);
});

/* ============ בניית הכרום (תלוי שפה) ============ */
function renderChrome(){
  document.documentElement.setAttribute("lang",lang);
  document.documentElement.setAttribute("dir",isHe()?"rtl":"ltr");
  document.getElementById("skipLink").textContent=t("skip");
  document.getElementById("brandName").textContent=t("brand");
  document.getElementById("brandSub").textContent=t("brandSub");
  document.getElementById("qLabel").textContent=t("searchLabel");
  var qi=document.getElementById("q");
  qi.placeholder=t("searchPh");
  var cbn=document.getElementById("clearBtn");
  cbn.textContent=""; cbn.appendChild(icon("close")); cbn.setAttribute("aria-label",t("clear"));

  /* renderChrome הורס את הכפתור שהמשתמש בדיוק הפעיל, אז הפוקוס נופל ל-body.
     שומרים את המיקום בקבוצה ומחזירים אליו. */
  function rebuildSeg(id,label,items,isOn,onPick){
    var box=document.getElementById(id);
    var idx=Array.prototype.indexOf.call(box.children,document.activeElement);
    box.textContent=""; box.setAttribute("aria-label",label);
    items.forEach(function(it,i){
      var b=el("button",null,it.label); b.type="button";
      if(it.lang) b.lang=it.lang;
      b.setAttribute("aria-pressed",isOn(it)?"true":"false");
      b.setAttribute("aria-label",it.label+", "+(i+1)+"/"+items.length);
      b.addEventListener("click",function(){ if(!isOn(it)) onPick(it); });
      box.appendChild(b);
    });
    if(idx>=0 && box.children[idx]) box.children[idx].focus();
  }

  rebuildSeg("langSeg",t("langLabel"),
    [{v:"he",label:"עברית",lang:"he"},{v:"en",label:"EN",lang:"en"}],
    function(it){return lang===it.v;},
    function(it){
      lang=it.v;
      try{localStorage.setItem("vn.lang",lang);}catch(e){}
      renderChrome(); render(); say(t("langChanged"));
    });

  rebuildSeg("curSeg",t("curLabel"),
    ["USD","ILS","VND"].map(function(c){return {v:c,label:c+" "+SYM[c]};}),
    function(it){return cur===it.v;},
    function(it){
      cur=it.v; try{localStorage.setItem("vn.cur",cur);}catch(e){}
      renderChrome(); render();
      say(t("pricesIn",{"%s":T.curName[cur][lang]}));
    });

  /* ערכת נושא */
  var tb=document.getElementById("themeBtn");
  tb.textContent=""; tb.appendChild(icon(currentDark()?"sun":"moon"));
  tb.setAttribute("aria-pressed",currentDark()?"true":"false");
  tb.setAttribute("aria-label",t("dark"));

  renderTripbar();

  /* קישורים רשמיים */
  var of=document.getElementById("officialRow");
  of.textContent="";
  of.appendChild(oflink("passport",t("evisa"),"https://evisa.gov.vn"));
  of.appendChild(oflink("doc",t("prearrival"),"https://prearrival.immigration.gov.vn"));
  of.appendChild(el("span","of-note",t("official")));

  /* טאבים וניווט תחתון */
  var tabs=document.getElementById("tabs"), bot=document.getElementById("botnav");
  tabs.textContent=""; bot.textContent="";
  tabs.setAttribute("aria-label",t("navLabel"));
  bot.setAttribute("aria-label",t("navLabel"));
  NAV.forEach(function(n){
    var a=el("a","tab"); a.href=n.hash; a.setAttribute("data-nav",n.id);
    a.appendChild(icon(n.ic));
    a.appendChild(document.createTextNode(t(n.key)));
    if(n.id==="saved"&&favs.size) a.appendChild(el("span","cnt",String(favs.size)));
    tabs.appendChild(a);

    var b=el("a","bnav"); b.href=n.hash; b.setAttribute("data-nav",n.id);
    b.appendChild(icon(n.ic));
    b.appendChild(document.createTextNode(t(n.key)+(n.id==="saved"&&favs.size?" "+favs.size:"")));
    bot.appendChild(b);
  });
  markNav(routeName());
}
/* התאריכים נגזרים מהשעון החי, לא קבועים בקוד —
   הספירה לאחור נכונה בכל טעינה, גם בעוד חודש. */
var TRIP={depart:new Date(2026,9,26), back:new Date(2026,10,24)};
function renderTripbar(){
  var box=document.getElementById("tripbar");
  if(!box) return;
  box.textContent="";
  var loc=isHe()?"he-IL":"en-GB";
  var today=new Date(); today.setHours(0,0,0,0);
  var dMY={day:"numeric",month:"short"}, dFull={weekday:"long",day:"numeric",month:"long"};
  var nights=Math.round((TRIP.back-TRIP.depart)/864e5);
  var left=Math.round((TRIP.depart-today)/864e5);

  box.appendChild(tbItem(t("tbWindow"),
    TRIP.depart.toLocaleDateString(loc,dMY)+" – "+TRIP.back.toLocaleDateString(loc,dMY)+" "+TRIP.back.getFullYear(),
    nights+" "+t("tbNights")));
  box.appendChild(el("span","tb-sep"));
  box.appendChild(tbItem(t("tbToday"),today.toLocaleDateString(loc,dFull),null));

  var c=el("div","tb-count");
  if(left>0){
    c.appendChild(el("b",null,String(left)));
    c.appendChild(el("span",null,t("tbUntil")));
  }else if(left===0){
    c.appendChild(el("b",null,t("tbToday0")));
  }else if(today<=TRIP.back){
    c.appendChild(el("b",null,String(1-left)));
    c.appendChild(el("span",null,t("tbDayOf")));
  }else{
    c.appendChild(el("b",null,t("tbOver")));
  }
  box.appendChild(c);
}
function tbItem(label,value,sub){
  var d=el("div","tb-item");
  d.appendChild(el("span","lbl",label));
  d.appendChild(el("b",null,value));
  if(sub) d.appendChild(el("span","lbl",sub));
  return d;
}
function oflink(ic,label,href){
  var a=el("a","oflink");
  a.href=href; a.target="_blank"; a.rel="noopener noreferrer";
  a.appendChild(icon(ic));
  a.appendChild(document.createTextNode(label));
  a.appendChild(el("span","sr",t("newTab")));
  return a;
}

/* ============ חיפוש ============ */
var qEl=document.getElementById("q"), xBtn=document.getElementById("clearBtn"), tm=null;
qEl.addEventListener("input",function(){
  clearTimeout(tm);
  tm=setTimeout(function(){
    query=qEl.value.trim().toLowerCase();
    xBtn.hidden=!query;
    if(query&&location.hash){location.hash="";}
    else render();
  },300);
});
xBtn.addEventListener("click",function(){qEl.value="";query="";xBtn.hidden=true;render();qEl.focus();});
qEl.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&qEl.value){qEl.value="";query="";xBtn.hidden=true;render();}
});

/* ============ ערכת נושא ============ */
document.getElementById("themeBtn").addEventListener("click",function(){
  var next=currentDark()?"light":"dark";
  document.documentElement.setAttribute("data-theme",next);
  try{localStorage.setItem("vn.theme",next);}catch(e){}
  colorCache={}; sceneCache={};
  renderChrome(); render();
});

/* קישור הדילוג שינה את ה-hash ל-"main", הראוטר לא הכיר אותו והחזיר לדף הבית —
   כלומר הוא זרק את משתמש המקלדת מהעמוד שבו היה. */
document.getElementById("skipLink").addEventListener("click",function(e){
  e.preventDefault();
  main.focus();
  main.scrollIntoView({block:"start"});
});

/* החלפת ערכת נושא במערכת ההפעלה תוך כדי — הצבעים והתצלומים מחושבים מול הרקע */
var mq=window.matchMedia("(prefers-color-scheme: dark)");
if(mq.addEventListener){
  mq.addEventListener("change",function(){
    if(document.documentElement.hasAttribute("data-theme")) return;
    colorCache={}; sceneCache={}; renderChrome(); render();
  });
}

var topbar=document.getElementById("topbar");
window.addEventListener("scroll",function(){
  topbar.classList.toggle("is-stuck",window.scrollY>4);
},{passive:true});

renderChrome();
render();
})();
</script>
