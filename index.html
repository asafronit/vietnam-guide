.sos-card>.sos-h3{margin-bottom:4px}
.sos-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:10px}
.sos-tel{flex:1 1 100%;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 12px;
  min-height:52px;padding:11px 14px;background:var(--tile-dark);color:var(--on-tile-dark);
  font-family:var(--f-ui);font-weight:600;text-decoration:none}
.sos-num{font-variant-numeric:tabular-nums;unicode-bidi:isolate}
.sos-tel .sos-num{font-size:1.2rem;font-weight:800}
.sos-note{flex:1 1 12em;font-size:.86rem;color:var(--ink-2)}
.sos-copy,.sos-show{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;
  border:1px solid var(--line-ctl);background:var(--surface);color:var(--ink);
  font-family:var(--f-ui);font-size:.86rem;font-weight:600}
.sos-copy .ic,.sos-show .ic{width:16px;height:16px}
.sos-copy.is-done{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
@media (hover:hover) and (pointer:fine){.sos-copy:hover,.sos-show:hover{background:var(--surface-2)}}
.sos-addr{margin-top:12px}
.sos-addr-k{font-family:var(--f-ui);font-size:.8rem;font-weight:600;color:var(--ink-3)}
.sos-addr-v{display:block;width:fit-content;max-width:100%;font-weight:600;line-height:1.5;overflow-wrap:anywhere}
.sos-acts{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:10px 0 0;padding:0}
.sos-acts>li{display:contents}
.sos-mail{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;min-height:44px;padding:10px 0;
  font-family:var(--f-ui);font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.sos-mail .sos-num{font-weight:500;overflow-wrap:anywhere}
.sos-small{font-size:.84rem;color:var(--ink-2);margin-top:8px}

.sos-toc ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.sos-toc a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;background:var(--tile);color:var(--ink);
  font-family:var(--f-ui);font-size:.9rem;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.sos-toc-l{font-family:var(--f-ui);font-size:.8rem;font-weight:600;color:var(--ink-3);margin:0 0 6px}

.sos-list{margin:0;padding-inline-start:1.2em;display:grid;gap:8px;font-size:.95rem;line-height:1.55}
.sos-list b{font-weight:700}
.sos-phr{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.sos-phr>li{background:var(--surface);border:1px solid var(--line);padding:12px 14px;display:grid;gap:4px}
.sos-phr-he{font-family:var(--f-ui);font-size:.9rem;font-weight:600;color:var(--ink-2)}
/* Heebo אינו נושא את כל סימני הטון הכפולים (ệ, ở), ובלי זה האותיות
   היו מורכבות משני גופנים. line-height 1.5: בצפוף הסימנים נחתכים. */
.sos :lang(vi),.show-bd :lang(vi){font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.sos-phr-vi{font-size:1.6rem;font-weight:700;line-height:1.5;color:var(--ink);width:fit-content;max-width:100%}
.sos-phr-say{font-size:.82rem;color:var(--ink-3)}
.sos-phr .sos-show{justify-self:start;margin-top:4px}

.sos-regions{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.sos-regions>li{background:var(--surface);border:1px solid var(--line);padding:12px 14px}
.sos-risk{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-ui);font-size:.82rem;font-weight:700;
  padding:2px 9px;border:1px solid var(--ink-2);color:var(--ink);margin-bottom:6px}
.sos-risk.is-high{border-width:2px;border-color:var(--ink)}
.sos-dl{margin:0;display:grid;gap:6px}
.sos-dl dt{font-family:var(--f-ui);font-size:.78rem;font-weight:600;color:var(--ink-3)}
.sos-dl dd{margin:0;font-size:.92rem;line-height:1.5}
.sos-rule{margin:12px 0 0;padding-inline-start:1.3em;display:grid;gap:8px;line-height:1.55}
.sos-ext{display:inline-flex;align-items:center;min-height:44px;font-family:var(--f-ui);font-weight:600;
  color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.sos-stamp{font-size:.8rem;color:var(--ink-3)}
.sos .sos-stamp,.sos .sos-small{margin-top:8px}
.sos-prov{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.sos-prov-n{font-weight:600}

/* כרטיס החירום בראש "מידע" */
.sos-infocard{margin-top:14px;background:var(--surface-2);padding:14px 15px}
.sos-infocard .sos-h2{font-size:1.15rem}
.sos-infocard .sos-all{display:inline-flex;align-items:center;min-height:44px;margin-top:8px;font-family:var(--f-ui);font-weight:600;
  color:var(--ink);text-decoration:underline;text-underline-offset:3px}
/* תוצאת חירום בראש החיפוש */
.sos-callout{display:flex;align-items:center;gap:10px;margin:6px 0 16px;padding:12px 14px;min-height:52px;
  background:var(--gold);color:#15121f;font-family:var(--f-ui);font-weight:700;text-decoration:none}
.sos-callout .ic{width:20px;height:20px;flex:none}

/* הודעת המפה: למעלה, מוזחת מכפתורי הזום (topleft, פיזי) כדי לא להסתיר
   את הפוקוס שלהם, ומעל שכבות Leaflet (1000). */
.map-note{position:absolute;top:10px;left:58px;right:10px;z-index:1001;margin:0;display:flex;gap:8px;align-items:flex-start;
  padding:10px 12px;background:var(--surface);color:var(--ink);border:2px solid var(--ink);
  font-family:var(--f-ui);font-size:.86rem;font-weight:600;line-height:1.45}
.map-note .ic{width:18px;height:18px;flex:none;margin-top:1px}

/* כתובת בווייטנאמית בכרטיס מקום ובנקודת עלייה (16-01) */
.addr-vi{display:grid;gap:6px}
.addr-vi-p{margin:0}
.addr-vi-v,.tr-addr-vi{display:block;width:fit-content;max-width:100%;font-weight:600;line-height:1.5;color:var(--ink);
  overflow-wrap:anywhere;-webkit-user-select:all;user-select:all}
.addr-vi-note{margin:0;font-size:.84rem;color:var(--ink-2)}
.addr-vi-acts{display:flex;flex-wrap:wrap;gap:8px}
.tr-addr-vi{margin:2px 0 0}

/* משוב "העתק שם" (14-02) */
.sheet-acts{align-items:center}
.ttl-copy-st{font-family:var(--f-ui);font-size:.8rem;font-weight:700;color:var(--ink);max-width:6.5em;line-height:1.25}
.ttl-copy-st:empty{display:none}
.ttl-copy-st.is-warn{text-decoration:underline}

/* יצירת קשר בכרטיס מקום (14-01) — ניטרלי: לחיוג ולדואר אין צבע בתקן */
.contact{display:grid;gap:6px}
.contact-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.contact-list>li{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.contact-a{flex:1 1 14em;display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 8px;min-height:44px;padding:8px 12px;
  border:1px solid var(--line-ctl);color:var(--ink-2);font-family:var(--f-ui);font-weight:600;font-size:.9rem;text-decoration:none}
.contact-a .ic{width:17px;height:17px;flex:none}
.contact-a .sos-num{color:var(--ink);overflow-wrap:anywhere}
@media (hover:hover) and (pointer:fine){.contact-a:hover{background:var(--surface-2)}}

/* "הצג בגדול" — הדיאלוג ממלא את המסך כדי שאפשר יהיה לסובב את הטלפון
   לנהג. נסגר רק בכפתור או ב-Esc: נגיעה של הנהג לא סוגרת אותו. */
#showDlg{max-width:none;width:100vw;height:100vh;height:100dvh;max-height:none;margin:0}
#showDlg .sheet{min-height:100%;display:flex;flex-direction:column;border-radius:0;border:0}
.show-phrase{margin:0;font-size:1.2rem;font-weight:600;line-height:1.5;color:var(--ink-2);overflow-wrap:anywhere}
.show-hd{display:flex;align-items:center;gap:12px;padding:14px 16px 0}
.show-hd .sheet-ttl{flex:1}
.show-close{display:inline-flex;align-items:center;gap:6px;min-height:44px;min-width:44px;padding:0 14px;
  border:1px solid var(--line-ctl);background:var(--surface);color:var(--ink);font-family:var(--f-ui);font-weight:600}
.show-bd{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:20px}
.show-vi{margin:0;font-size:clamp(2rem,9vw,4.2rem);font-weight:800;line-height:1.4;color:var(--ink);overflow-wrap:anywhere}
.show-addr{font-size:clamp(1.4rem,6vw,2.6rem);font-weight:700}
.show-he{margin:0;font-size:1.05rem;color:var(--ink-2)}
@media (forced-colors:active){.sos-link,.sos-tile,.sos-tel,.sos-callout{border:2px solid LinkText}
  .sos-link[aria-current="page"]{outline:3px solid CanvasText;outline-offset:-5px}}
</style>

<script src="assets/poi-data.js" defer></script>
<script src="assets/transfers-data.js" defer></script>
<script src="assets/app.js" defer></script>

<script>
// נרשם בשקט. הכשלה כאן לעולם לא צריכה לשבור את הדף.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
  // הנכסים מוגשים מהקאש ומתרעננים ברקע, ולכן הכניסה הראשונה אחרי
  // פרסום הציגה את הגרסה הקודמת — באייפון זה נראה כאילו שום דבר לא
  // השתנה. כשה-worker החדש תופס שליטה, טוענים מחדש פעם אחת.
  // clients.claim() יורה controllerchange גם בהתקנה הראשונה, כשדף שנטען
  // בלי controller הופך למבוקר — ולכן כל ביקור ראשון קיבל טעינה מחדש
  // מלאה שניות ספורות לתוכו, קוטע את הקראת קורא המסך ומאפס את הפוקוס.
  // אין גרסה ישנה לרענן כשלא היה controller מלכתחילה.
  var vnHadController = !!navigator.serviceWorker.controller;
  var vnReloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", function () {
    if (!vnHadController || vnReloaded) return;
    vnReloaded = true;
    location.reload();
  });
}
</script>
</body>
</html>
