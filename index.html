@font-face{font-family:"Assistant";font-style:normal;font-weight:400 700;font-display:swap;src:url("assets/fonts/Assistant-latin.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

<style>
/* ==========================================================
   ויאטנם 2026 — מאגר המסע
   שקט: ניטרלי חמים, ג'ייד עמוק, פינות מרוסנות, אייקוני קו.
   ========================================================== */
:root{
  scroll-padding-top:150px;scroll-padding-bottom:calc(var(--navh) + 14px);
  /* כיוון D (פאזה 3): נייר אורז ואדום לכה. בהיר הוא ברירת המחדל ולא
     מוסכמה — רקע כהה בשמש חזקה מאבד ניגודיות מול האור הסביבתי, וזה
     תנאי השימוש המרכזי: אייפון ביד אחת בוויאטנם בנובמבר. */
  --bg:#fbf7f0;
  --surface:#ffffff;
  --surface-2:#f3ece0;
  --ink:#191512;
  --ink-2:#574d43;
  --ink-3:#6f6558;   /* bg 5.35 · surface 5.71 · surface-2 4.86 */
  --line:rgba(25,21,18,.14);
  /* גבול פקדים. חייב להיות מוגדר בכל שלושת מצבי הצבע: משתנה חסר הופך
     את border:1px solid var(--x) ללא-חוקי, והקיצור כולו נופל ל-border-style:none.
     .48 עובר 3:1 גם מול --surface וגם מול --bg. */
  --line-ctl:rgba(25,21,18,.52);   /* .48 נתן 3.03 מול --bg — מרווח 0.03 */
  --line-soft:rgba(25,21,18,.07);
  /* האדום הוא צבע ההטעמה: המרחק, המצב הפעיל, ההדגשה. ירוק המותג
     הקודם נשאר כ---jade לתגיות מחיר, שם הוא נושא משמעות ולא זהות. */
  --brand:#a8231f;
  --brand-ink:#ffffff;
  --brand-soft:#f7e7e4;
  --jade:#1f6b52;
  --gold:#8a6412;
  --rose:#a13924;
  /* ערכי תקן הקישורים של הפרויקט. היו כאן ערכים שכנים ולא זהים,
     וזו הייתה סטייה שקטה מהתקן — תכלת Maps, ירוק Grab, סגול WhatsApp,
     אדום וידאו, כחול-כהה Booking. */
  --c-map:#0369a1;   --c-map-soft:rgba(3,105,161,.10);
  /* מילוי וטקסט נפרדים לכפתור הראשי. #fff קשיח מעל --c-map נתן 4.09
     בבהיר ו-1.88 בכהה, כי --c-map מתהפך לתכלת בהיר. */
  --c-map-fill:#0369a1; --c-map-on:#ffffff;
  --c-ride:#0f7c5c;  --c-ride-soft:rgba(15,124,92,.10);
  --c-chat:#6d28d9;  --c-chat-soft:rgba(109,40,217,.10);
  --c-video:#cc0000; --c-video-soft:rgba(204,0,0,.10);
  --c-book:#1e3a5f;  --c-book-soft:rgba(30,58,95,.10);
  --shadow:0 1px 2px rgba(25,21,18,.05);
  --shadow-lg:0 10px 34px rgba(25,21,18,.14);
  --r:12px;
  --r-sm:10px;
  --r-xs:7px;
  /* קול תצוגה נפרד. סריף עברי-לטיני בניגודיות גבוהה — הוא נושא
     את שמות התחנות מעל התצלומים, ואין לו תפקיד אחר בדף. */
  --f-display:"Frank Ruhl Libre",Georgia,serif;
  --f-ui:"Assistant","Segoe UI",sans-serif;
  --f-body:"Assistant","Segoe UI",sans-serif;
  --gutter:clamp(15px,4vw,28px);
  --navh:0px;
  --sticky-top:0px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d0f12;--surface:#151920;--surface-2:#1e242d;
    --ink:#f2efe9;--ink-2:#a9a096;--ink-3:#968c7f;
    --line:rgba(242,239,233,.16);--line-soft:rgba(242,239,233,.08);--line-ctl:rgba(242,239,233,.46);
    --brand:#ff6b4a;--brand-ink:#26100a;--brand-soft:#33180f;--jade:#3ddba0;
    --gold:#d9b463;--rose:#e0806c;
    --c-map:#7cc4ff;   --c-map-soft:rgba(124,196,255,.14);
    --c-map-fill:#7cc4ff; --c-map-on:#06121c;
    --c-ride:#3ddba0;  --c-ride-soft:rgba(61,219,160,.14);
    --c-chat:#a78bfa;  --c-chat-soft:rgba(167,139,250,.14);
    --c-video:#ff8a7a; --c-video-soft:rgba(255,138,122,.14);
    --c-book:#8fb6e8;  --c-book-soft:rgba(143,182,232,.14);
    --shadow:0 1px 2px rgba(0,0,0,.4);
    --shadow-lg:0 12px 40px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d0f12;--surface:#151920;--surface-2:#1e242d;
  --ink:#f2efe9;--ink-2:#a9a096;--ink-3:#968c7f;
  --line:rgba(242,239,233,.16);--line-soft:rgba(242,239,233,.08);--line-ctl:rgba(242,239,233,.46);
  --brand:#ff6b4a;--brand-ink:#26100a;--brand-soft:#33180f;--jade:#3ddba0;
  --gold:#d9b463;--rose:#e0806c;
    --c-map:#7cc4ff;   --c-map-soft:rgba(124,196,255,.14);
    --c-map-fill:#7cc4ff; --c-map-on:#06121c;
    --c-ride:#3ddba0;  --c-ride-soft:rgba(61,219,160,.14);
    --c-chat:#a78bfa;  --c-chat-soft:rgba(167,139,250,.14);
    --c-video:#ff8a7a; --c-video-soft:rgba(255,138,122,.14);
    --c-book:#8fb6e8;  --c-book-soft:rgba(143,182,232,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-lg:0 12px 40px rgba(0,0,0,.55);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gold:#d9b463}}

*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--f-body);font-size:.97rem;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{padding-bottom:var(--navh)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;inset-inline-start:-9999px;top:0;z-index:99;background:var(--brand);color:var(--brand-ink);padding:11px 18px;font-family:var(--f-ui);font-weight:500}
.skip:focus{inset-inline-start:0}
.en{direction:ltr;unicode-bidi:isolate}
svg.ic{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg.ic-lg{width:21px;height:21px}

/* ---------- סרגל עליון ---------- */
.topbar{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid transparent;transition:border-color .2s}
.topbar.is-stuck{border-bottom-color:var(--line)}
.tb-row{max-width:1140px;margin:0 auto;padding:0 var(--gutter);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tb-row.r1{padding-top:13px;padding-bottom:9px}
.brand{font-family:var(--f-ui);font-weight:600;font-size:1.05rem;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.brand .bar{width:3px;height:17px;background:var(--brand);border-radius:2px;flex:none}
.brand span{font-weight:400;color:var(--ink-3);font-size:.84rem}
.tb-tools{display:flex;gap:7px;align-items:center;margin-inline-start:auto;flex-wrap:wrap}

/* מקטע מחליף — שפה ומטבע */
.seg{display:inline-flex;border:1px solid var(--line-ctl);border-radius:var(--r-xs);background:var(--surface)}
.seg button{
  font-family:var(--f-ui);font-size:.79rem;font-weight:500;color:var(--ink-2);
  padding:6px 11px;border-inline-start:1px solid var(--line-soft);transition:background .13s,color .13s;
}
.seg button:first-child{border-inline-start:none}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.seg button:hover:not([aria-pressed="true"]){background:var(--surface-2);color:var(--ink)}
.iconbtn{
  display:inline-flex;align-items:center;justify-content:center;width:33px;height:33px;
  border:1px solid var(--line-ctl);border-radius:var(--r-xs);color:var(--ink-2);background:var(--surface);
  transition:background .13s,color .13s;
}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}

/* מסגרת הטיול: תאריכים, היום, וספירה לאחור */
.tripbar{border-top:1px solid var(--line-soft);background:var(--surface)}
.tripbar-in{max-width:1140px;margin:0 auto;padding:8px var(--gutter);
  display:flex;flex-wrap:wrap;gap:8px 22px;align-items:baseline}
.tb-item{display:flex;align-items:baseline;gap:7px;font-size:.83rem;color:var(--ink-2)}
.tb-item b{font-family:var(--f-ui);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.tb-item .lbl{font-size:.75rem;color:var(--ink-3)}
.tb-count{margin-inline-start:auto;display:flex;align-items:baseline;gap:7px}
.tb-count b{font-family:var(--f-ui);font-weight:600;font-size:1.02rem;color:var(--brand);font-variant-numeric:tabular-nums}
.tb-sep{width:1px;align-self:stretch;background:var(--line-soft)}
@media (max-width:640px){ .tb-count{margin-inline-start:0} }

/* שורת קישורים רשמיים */
.official{border-top:1px solid var(--line-soft);background:var(--surface)}
.official-in{max-width:1140px;margin:0 auto;padding:7px var(--gutter);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.oflink{
  display:inline-flex;align-items:center;gap:7px;font-family:var(--f-ui);font-size:.8rem;font-weight:500;
  color:var(--ink-2);border:1px solid var(--line-ctl);border-radius:var(--r-xs);padding:6px 11px;
  transition:border-color .13s,color .13s;
}
.oflink:hover{border-color:var(--brand);color:var(--brand)}
.oflink svg{color:var(--brand)}
.of-note{font-size:.78rem;color:var(--ink-3);margin-inline-start:auto}

/* ---------- חיפוש + ניווט ---------- */
.tb-row.r2{padding-top:10px;padding-bottom:10px;gap:10px}
.searchbox{
  flex:1 1 260px;display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--line-ctl);border-radius:var(--r-sm);padding:9px 14px;transition:border-color .13s;
}
.searchbox:focus-within{border-color:var(--brand)}
.searchbox input{flex:1;min-width:0;border:none;background:none;font:inherit;color:var(--ink);padding:0}
.searchbox input:focus{outline:none}
.searchbox input::-webkit-search-cancel-button{display:none}
.searchbox input::placeholder{color:var(--ink-3)}
.searchbox .ic{color:var(--ink-3)}
.xbtn{color:var(--ink-3);flex:none;padding:4px;display:flex;border-radius:4px;min-width:25px;min-height:25px;align-items:center;justify-content:center}
.xbtn:hover{color:var(--rose)}
.tabs{display:flex;gap:2px}
.tab{
  font-family:var(--f-ui);font-size:.85rem;font-weight:500;color:var(--ink-2);
  padding:8px 13px;border-radius:var(--r-xs);display:inline-flex;gap:7px;align-items:center;
  transition:background .13s,color .13s;
}
.tab:hover{background:var(--surface-2);color:var(--ink)}
/* m-3: הפרש הרקע היה 1.10:1 בלבד — כלומר המצב הפעיל היה מסומן בצבע
   ובמשקל בלבד. הפס התחתון הוא הסימן שאינו תלוי בתפיסת צבע, ושורד
   גם קריאה באור שמש ישיר. */
.tab[aria-current="page"]{background:var(--surface-2);color:var(--ink);font-weight:600;
  box-shadow:inset 0 -3px 0 0 var(--brand)}
.tab .cnt{font-size:.76rem;color:var(--ink-3);font-weight:400}

/* ---------- גוף ---------- */
main{max-width:1140px;margin:0 auto;padding:8px var(--gutter) 64px}
/* יעד פוקוס תכנותי בלבד, לא נגיע אליו ב-Tab — טבעת סביב כל הדף רק מפריעה */
main:focus,main:focus-visible{outline:none}
/* פותח פרק, לא כותרת קטנה. הטווח 01–05 הוא סדר המסלול מצפון לדרום,
   כלומר מידע שהקורא צריך ולא קישוט. */
.sec-head{
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  font-family:var(--f-display);font-weight:700;font-size:clamp(1.5rem,4vw,2.1rem);
  line-height:1.05;letter-spacing:-.015em;
  margin:52px 0 18px;padding-bottom:12px;border-bottom:1px solid var(--ink);
}
.sec-head .cnt{
  font-family:var(--f-body);font-size:.86rem;font-weight:400;color:var(--ink-3);
  margin-inline-start:auto;letter-spacing:0;
}
.sec-head .range{font-family:var(--f-ui);font-size:.92rem;font-weight:500;
  color:var(--ink-3);letter-spacing:.02em;font-variant-numeric:tabular-nums}

/* בלוקי לוח-התחנה, המדף האופקי והחשיפה המדורגת הוסרו יחד עם
   הפונקציות שייצרו אותם. הראוטר מנתב הכל ל-screenSplit. */
/* ---------- עמוד תחנה ---------- */
.hero{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:4px}
.hero-txt{position:absolute;inset-block-end:0;inset-inline:0;padding:72px 24px 22px;color:#fff;
  background:linear-gradient(to top,rgba(10,13,17,.92),rgba(10,13,17,.64) 55%,rgba(10,13,17,.24))}
.hero-name{font-family:var(--f-display);font-weight:700;font-size:clamp(1.9rem,6vw,3.4rem);line-height:1.02;letter-spacing:-.02em;margin:0;text-wrap:balance;text-shadow:0 2px 22px rgba(0,0,0,.5)}
.hero-name:focus{outline:none}
/* טבעת כפולה: לבן עובד מעל רקע כהה, השחור שסביבו מעל רקע בהיר —
   ואחד מהם תמיד רלוונטי. כאן נוחת הפוקוס בכל מעבר מסך במקלדת,
   והתצלום שמתחת אינו ידוע מראש. --brand אינו אפשרות: הוא נבלע
   בתצלום כהה בבהיר, ובשקיעה בכהה. */
.hero-name:focus-visible{outline:3px solid #fff;outline-offset:3px;
  box-shadow:0 0 0 6px rgba(0,0,0,.85);border-radius:3px}
.hero-sub{font-family:var(--f-ui);font-weight:400;font-size:.9rem;opacity:.88;margin-top:2px}
.backbtn{
  display:inline-flex;align-items:center;gap:7px;font-family:var(--f-ui);font-weight:500;font-size:.85rem;
  color:var(--ink-2);border:1px solid var(--line-ctl);background:var(--surface);
  padding:7px 13px;border-radius:var(--r-xs);margin:2px 0 12px;
}
.backbtn:hover{color:var(--ink);border-color:var(--brand)}
.backbtn svg{transform:scaleX(1)}
:root[dir="rtl"] .backbtn svg,html[dir="rtl"] .backbtn svg{transform:scaleX(-1)}

/* ---------- תצוגה מפוצלת ----------
   הרשימה קבועה בצד, הפרטים מתחלפים לצידה. לא עוזבים את הדף:
   מעבר בין תחנות הוא החלפת התוכן בחלונית אחת, לא ניווט לעמוד חדש. */
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.rail{position:sticky;top:calc(var(--sticky-top) + 8px);max-height:calc(100vh - var(--sticky-top) - 24px);
  display:flex;flex-direction:column;gap:10px;min-height:0}
.rail-head{display:flex;align-items:baseline;gap:8px;padding:2px 10px 6px;
  font-family:var(--f-ui);font-weight:600;font-size:.92rem;border-bottom:1px solid var(--line)}
.rail-tab{
  flex:1;font-family:var(--f-ui);font-size:.82rem;font-weight:500;color:var(--ink-2);
  padding:8px 6px;border-radius:var(--r-xs);display:flex;align-items:center;justify-content:center;gap:6px;
  transition:background .13s,color .13s;
}
.rail-tab:hover{color:var(--ink)}
.rail-tab[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.rail-list{overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:2px;padding-inline-end:2px;min-height:0}
.rail-sect{display:flex;flex-direction:column}
.rail-ul{display:flex;flex-direction:column;gap:2px}
.rail-group{font-family:var(--f-ui);font-size:.74rem;font-weight:600;color:var(--ink-3);
  padding:12px 10px 5px;letter-spacing:.02em}
.rail-item{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-xs);
  text-align:start;width:100%;transition:background .12s;position:relative;
}
.rail-item:hover{background:var(--surface-2)}
.rail-item[aria-current="page"]{background:var(--surface);box-shadow:var(--shadow)}
.rail-item[aria-current="page"]::before{
  content:"";position:absolute;inset-block:9px;inset-inline-start:0;width:3px;
  border-radius:2px;background:var(--stationcolor);
}
.rail-thumb{width:44px;height:34px;border-radius:5px;object-fit:cover;flex:none;background:var(--surface-2)}
.rail-txt{min-width:0;flex:1}
.rail-name{font-family:var(--f-ui);font-weight:500;font-size:.9rem;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-item[aria-current="page"] .rail-name{font-weight:600}
.rail-sub{font-size:.75rem;color:var(--ink-3)}
.rail-n{font-family:var(--f-ui);font-size:.78rem;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}

.detail{min-width:0}
.detail-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  min-height:52vh;text-align:center;color:var(--ink-2);
  border:1px dashed var(--line-ctl);border-radius:var(--r);padding:32px;
}
.detail-empty svg{width:30px;height:30px;color:var(--ink-3)}
.detail-empty b{font-family:var(--f-ui);font-weight:600;font-size:1.05rem;color:var(--ink)}

/* טאבי קטגוריה בתוך חלונית הפרטים */
.cat-tabs{
  display:flex;gap:4px;overflow-x:auto;padding:4px 0 10px;margin-top:18px;
  border-bottom:1px solid var(--line);scrollbar-width:none;
}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{
  font-family:var(--f-ui);font-size:.85rem;font-weight:500;color:var(--ink-2);
  padding:8px 13px;border-radius:var(--r-xs);white-space:nowrap;
  display:inline-flex;align-items:center;gap:7px;transition:background .13s,color .13s;
}
.cat-tab:hover{background:var(--surface-2);color:var(--ink)}
.cat-tab[aria-selected="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.cat-tab .n{font-size:.76rem;font-variant-numeric:tabular-nums}
.cat-panel{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:16px}

@media (max-width:900px){
  /* 268 פיקסלים של כרום מתוך 844 הם 32% מהמסך לפני שרואים תחנה אחת.
     מסגרת הטיול והקישורים הרשמיים אינם החלטות שמקבלים כל שנייה —
     מקומם במסך "מידע", לא קבועים מעל כל גלילה. */
  .tripbar,.official{display:none}
  .split{grid-template-columns:1fr}
  .rail{position:static;max-height:none}
  .rail-list{overflow:visible;max-height:none}
  .split.has-detail .rail{display:none}
  .split:not(.has-detail) .detail{display:none}
}
/* ---------- מפה + גיליון נגרר (נייד בלבד) ----------
   הדסקטופ נשאר מפוצל. כאן המפה ממלאת את המסך והרשימה יושבת בגיליון
   שנגרר לשלושה גבהים, כי בטלפון האגודל מגיע לתחתית ולא לראש. */
#mapPane{display:none}
.sheet-scrim{display:none}
@media (max-width:900px){
  body.mob-map{overflow:hidden}
  body.mob-map main{padding:0;max-width:none}
  #mapPane{
    display:block;position:fixed;inset-block-start:var(--map-top,0);inset-inline:0;
    inset-block-end:0;z-index:1;background:var(--surface-2);
    /* Leaflet מוסיף .leaflet-container לצומת שמוסרים לו, ו-height:100%
       שם דרס את הפריסה מבוססת ה-inset — הפאנל יצא בגובה מסך מלא
       שמתחיל מתחת לסרגל, כלומר תחתיתו נתלתה מחוץ למסך. */
    height:auto;
  }
  .leaflet-container{width:100%;height:100%;font-family:var(--f-body)}
  .mob-sheet{
    /* מעל הניווט התחתון. ב-SNAP[2] הידית נוחתת בתוך 64 הפיקסלים של
       .botnav (z-index 60), כלומר הפקד היחיד שמחזיר את החלונית היה
       בלתי נראה ובלתי לחיץ — באייפון, שהוא מכשיר היעד. */
    position:fixed;inset-inline:0;inset-block-end:0;z-index:70;
    height:92vh;background:var(--surface);
    border-start-start-radius:18px;border-start-end-radius:18px;
    box-shadow:0 -6px 28px rgba(0,0,0,.22);
    display:flex;flex-direction:column;
    transform:translateY(var(--sheet-y,55vh));
    transition:transform .32s cubic-bezier(.2,.8,.25,1);
    touch-action:none;
  }
  .mob-sheet.is-dragging{transition:none}
  .sheet-grip{
    /* היה 19px גובה, מתחת ל-24 של WCAG 2.5.8. 12px מביא ל-28 בלי שינוי מראה. */
    flex:none;padding:12px 0;display:flex;justify-content:center;cursor:grab;
    touch-action:none;
  }
  .sheet-grip::before{
    content:"";width:38px;height:4px;border-radius:99px;background:var(--line-ctl);
  }
  /* touch-action:none על הגיליון חל על כל שרשרת הצאצאים בבדיקת
     הפגיעה, ולכן גלילת מגע בתוך הגוף נחסמה ב-iOS — המכשיר היחיד
     שחשוב כאן. */
  .sheet-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;
    padding:0 var(--gutter) calc(var(--navh) + 18px)}
  /* בתוך הגיליון הרשימה כבר לא דביקה ולא מוגבלת בגובה */
  body.mob-map .rail{position:static;max-height:none}
  body.mob-map .rail-list{overflow:visible;max-height:none}
  body.mob-map .topbar{position:relative;z-index:40;background:var(--bg)}
  .map-pin{
    display:grid;place-items:center;width:26px;height:26px;border-radius:50%;
    color:#fff;font-family:var(--f-ui);font-weight:600;font-size:.68rem;
    border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.4);
    font-variant-numeric:tabular-nums;
  }
  /* .is-on ו-:focus-visible היו כמעט זהים — סמן שהוא גם נבחר וגם
   ממוקד לא נבדל מסמן שרק נבחר. הנבחר מסומן בטבעת המותג; הפוקוס
   מקבל את הטבעת הדו-גונית שכבר הוכחה מעל תצלום לא ידוע. */
.map-pin.is-on{outline:3px solid var(--brand);outline-offset:2px}
.leaflet-marker-icon:focus-visible{
  outline:3px solid #fff;outline-offset:2px;
  box-shadow:0 0 0 6px rgba(0,0,0,.85);border-radius:50%;
}
}
/* ---------- מזג אוויר והיתכנות ---------- */
.wx{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px 14px;margin-top:14px}
.wx-hd{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.wx-t{font-family:var(--f-ui);font-weight:600;font-size:.98rem}
.wx-tag{font-family:var(--f-ui);font-size:.72rem;font-weight:500;color:var(--ink-2);
  border:1px solid var(--line-ctl);border-radius:var(--r-xs);padding:2px 8px}
.wx-tag.is-live{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.wx-stats{display:flex;flex-wrap:wrap;gap:20px;margin:11px 0 13px}
.wx-stat b{display:block;font-family:var(--f-ui);font-weight:600;font-size:1.08rem;font-variant-numeric:tabular-nums}
.wx-stat span{font-size:.78rem;color:var(--ink-3)}
.wx-rows{display:grid;gap:9px}
.wx-row{display:grid;grid-template-columns:minmax(9em,auto) 1fr auto;gap:12px;align-items:center}
.wx-lab b{display:block;font-family:var(--f-ui);font-weight:500;font-size:.86rem}
.wx-eg{font-size:.73rem;color:var(--ink-3)}
.wx-bar{height:7px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.wx-fill{height:100%;border-radius:99px}
.wx-pct{font-family:var(--f-ui);font-weight:600;font-size:.86rem;font-variant-numeric:tabular-nums;min-width:2.9em;text-align:end}
/* הצבע לעולם לא לבד: יש גם אחוז, גם אורך פס וגם תווית.
   --jade ולא --brand: משהחליף המותג לאדום לכה, "טוב" היה מרונדר אדום
   ונעשה כמעט זהה ל---rose של "גרוע". הירוק נשמר כאן בדיוק לשם כך —
   הוא נושא משמעות, לא זהות מותג. */
.good{color:var(--jade)}       .wx-fill.good{background:var(--jade)}
.fair{color:var(--gold)}       .wx-fill.fair{background:var(--gold)}
.poor{color:var(--rose)}       .wx-fill.poor{background:var(--rose)}
.wx-note{font-size:.79rem;color:var(--ink-3);margin:12px 0 0;max-width:62ch}
.feas{font-family:var(--f-ui);font-weight:600;font-size:.76rem;font-variant-numeric:tabular-nums;
  border:1px solid currentColor;border-radius:var(--r-xs);padding:1px 6px}
/* מישלין: אדום הכוכב לכוכב, ענבר ל-Bib. הטקסט נושא את המשמעות, לא הצבע. */
.sig{font-family:var(--f-ui);font-weight:600;font-size:.72rem;border-radius:var(--r-xs);padding:2px 7px;white-space:nowrap}
.sig-star{background:#8e1b2e;color:#fff}
.sig-bib{background:var(--gold);color:#fff}
:root[data-theme="dark"] .sig-bib{color:#231a06}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sig-bib{color:#231a06}}

.quickbar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 2px}
.qbtn{
  display:inline-flex;align-items:center;gap:8px;font-family:var(--f-ui);font-weight:500;font-size:.85rem;
  background:var(--surface);border:1px solid var(--line-ctl);border-radius:var(--r-xs);padding:9px 15px;
  transition:border-color .13s;
}
.qbtn:hover{border-color:var(--brand)}
.qbtn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}

/* ---------- כרטיס מקום ---------- */
/* ברירת המחדל LTR כי רוב התוכן עדיין אנגלי. כרטיס שיש לו תאום עברי
   מקבל .is-he ומתהפך כולו — טקסט עברי בכרטיס LTR שובר את הפיסוק. */
.pcard.is-he,.rcard.is-he{direction:rtl;text-align:right}
.pcard,.rcard{
  direction:ltr;text-align:left;position:relative;
  background:var(--surface);border:1px solid var(--line-ctl);border-radius:var(--r-sm);
  display:flex;flex-direction:column;gap:4px;transition:border-color .15s;
}
.pcard:hover,.rcard:hover{border-color:var(--brand)}
.pcard{flex:0 0 240px;scroll-snap-align:start;padding:13px 14px 11px}
.rcard{padding:14px 15px 12px}
.rcard-where{direction:rtl;font-family:var(--f-ui);font-size:.76rem;color:var(--ink-3);display:flex;align-items:center;gap:6px}
html[dir="ltr"] .rcard-where{direction:ltr}
.dotc{width:8px;height:8px;border-radius:2px;background:var(--stationcolor);flex:none}
.pcard-h{margin:0;font-family:var(--f-display);font-size:1.06rem;font-weight:700;line-height:1.3}
.pcard-open{text-align:start;padding:0;display:block;width:100%}
.pcard-open::after{content:"";position:absolute;inset:0;border-radius:inherit}
.pcard-open:focus-visible{outline:none}
.pcard-open:focus-visible::after{outline:2px solid var(--brand);outline-offset:-2px}
.pcard-name{font-family:var(--f-ui);font-weight:600;font-size:.94rem;line-height:1.3}
.pcard-why{font-size:.86rem;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pcard-meta{
  display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:auto;padding-top:8px;
  font-family:var(--f-ui);font-size:.79rem;color:var(--ink-2);position:relative;z-index:2;
}
.stars{color:var(--gold);letter-spacing:.05em;font-size:.76rem}
.money{font-weight:600;font-variant-numeric:tabular-nums}
.money.is-free{color:var(--brand)}
.warn{color:var(--rose);font-weight:500}
.fav{
  margin-inline-start:auto;width:30px;height:30px;border-radius:var(--r-xs);
  color:var(--ink-3);display:flex;align-items:center;justify-content:center;flex:none;
  transition:background .13s,color .13s;
}
.fav:hover{background:var(--surface-2);color:var(--rose)}
.fav[aria-pressed="true"]{color:var(--rose)}
.fav[aria-pressed="true"] svg{fill:currentColor}

.reslist{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin-top:12px}
.results-head{font-family:var(--f-ui);font-weight:500;color:var(--ink-2);margin:20px 0 0}
mark{background:var(--brand-soft);color:inherit;border-radius:3px;padding:0 2px;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px;text-decoration-color:var(--brand)}

/* ---------- אריחי נושא ---------- */
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:11px;margin-top:12px}
.topic{
  background:var(--surface);border:1px solid var(--line-ctl);border-radius:var(--r-sm);padding:15px;
  text-align:start;display:flex;flex-direction:column;gap:2px;transition:border-color .15s;
}
.topic:hover:not(:disabled){border-color:var(--brand)}
.topic svg{color:var(--ink-3);margin-bottom:5px}
.topic-n{font-family:var(--f-ui);font-weight:600;font-size:1.3rem;font-variant-numeric:tabular-nums}
.topic-l{font-family:var(--f-ui);font-size:.85rem;color:var(--ink-2)}
.topic:disabled{opacity:.5;cursor:default}

/* ---------- מסך מידע ---------- */
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:12px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 15px}
.fact-l{font-family:var(--f-ui);font-size:.78rem;color:var(--ink-3);margin-bottom:2px}
.fact-v{font-family:var(--f-ui);font-weight:600;font-size:1.12rem;font-variant-numeric:tabular-nums;line-height:1.3}
.fact-s{font-size:.8rem;color:var(--ink-3);margin-top:2px}
.fxline{font-family:var(--f-ui);font-weight:600;font-size:1rem;font-variant-numeric:tabular-nums;direction:ltr;text-align:start}
.notecard{
  background:var(--surface-2);border-radius:var(--r-sm);padding:13px 15px;margin-top:22px;
  font-size:.87rem;color:var(--ink-2);
}
.notecard b{display:block;font-family:var(--f-ui);color:var(--ink);margin-bottom:3px;font-weight:600}
.creditlist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:5px;font-size:.81rem}
.creditlist li{display:flex;flex-wrap:wrap;gap:4px 9px;align-items:baseline;
  padding-block-end:5px;border-block-end:1px solid var(--line-soft)}
.creditlist li:last-child{border-block-end:none}
.cr-st{font-family:var(--f-ui);font-weight:600;color:var(--ink);min-width:9em}
.creditlist a{text-decoration:underline;text-underline-offset:2px;color:var(--ink-2)}
.cr-by{color:var(--ink-3);margin-inline-start:auto}

/* ---------- חלון פרטים ---------- */
dialog{border:none;padding:0;background:transparent;max-width:min(560px,94vw);width:100%;color:var(--ink)}
dialog::backdrop{background:rgba(10,13,17,.52)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);overflow:hidden}
.sheet-hd{padding:18px 20px 0;display:flex;gap:12px;align-items:flex-start}
/* כיוון D: שמות מקומות נושאים את סריף התצוגה, כמו שמות התחנות.
   הם הזהות של הכרטיס, לא תווית ממשק. */
.sheet-ttl{font-family:var(--f-display);font-weight:700;font-size:1.2rem;line-height:1.26;margin:0}
.ttl-he{display:block}
/* הלטיני משני בגודל בלבד, לא בניגודיות — הוא מה שמראים לנהג.
   width:fit-content מצמיד את התיבה לקצה ההתחלה של ההורה ה-RTL,
   בזמן ש-direction:ltr (מ-.en) מסדר רק את התווים בתוכה. בלעדיו
   הבלוק ממלא את הרוחב והשם קופץ לקצה הנגדי מהשם העברי. */
.ttl-en{display:block;width:fit-content;max-width:100%;
  font-family:var(--f-ui);font-size:.95rem;font-weight:500;
  color:var(--ink-2);line-height:1.35;margin-top:3px;
  letter-spacing:.01em;overflow-wrap:anywhere}
.sheet-where{font-family:var(--f-ui);font-size:.81rem;color:var(--ink-3);margin-top:4px;display:flex;align-items:center;gap:6px}
.sheet-acts{margin-inline-start:auto;display:flex;gap:8px;flex:none}
.closebtn,.ttl-copy{width:34px;height:34px;border-radius:var(--r-xs);border:1px solid var(--line-ctl);
  display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink-2)}
.closebtn:hover,.ttl-copy:hover{background:var(--surface-2);color:var(--ink)}
.sheet-bd{padding:13px 20px 20px;display:flex;flex-direction:column;gap:13px}
.sheet-what{color:var(--ink-2)}
.whybox{background:var(--brand-soft);border-radius:var(--r-sm);padding:12px 14px}
.whybox b{display:block;font-family:var(--f-ui);font-size:.77rem;font-weight:600;color:var(--brand);margin-bottom:2px}
.factrow{display:flex;flex-wrap:wrap;gap:9px;font-family:var(--f-ui);font-size:.85rem;color:var(--ink-2);align-items:center}
.map-attr{margin:14px 10px 4px;font-size:.72rem;color:var(--ink-3)}
.map-attr a{text-decoration:underline;text-underline-offset:2px}
.linkrow{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.linkrow>li{display:contents}
/* ---------- תקן צבעי הקישורים ----------
   מתועד ב-PROJECT.md וב-build.py: הצבע מקודד את הפעולה, לא את הקטגוריה.
   כחול=מפות · ירוק=נסיעה/גראב · סגול=וואטסאפ · אדום=יוטיוב.
   הצבע לעולם לא לבד — לכל כפתור יש גם אייקון וגם מילה. */
.lbtn{
  display:inline-flex;align-items:center;gap:7px;font-family:var(--f-ui);font-weight:500;font-size:.85rem;
  border-radius:var(--r-xs);padding:9px 14px;border:1px solid currentColor;
  color:var(--ink-2);transition:background .13s;
}
.lbtn:hover{background:var(--tint,var(--surface-2))}
.act-map  {color:var(--c-map);  --tint:var(--c-map-soft)}
.act-ride {color:var(--c-ride); --tint:var(--c-ride-soft)}
.act-video{color:var(--c-video);--tint:var(--c-video-soft)}
.act-chat {color:var(--c-chat); --tint:var(--c-chat-soft)}
.act-book {color:var(--c-book); --tint:var(--c-book-soft)}
.act-src  {color:var(--ink-3)}
.lbtn.is-primary{background:var(--c-map-fill);color:var(--c-map-on);border-color:var(--c-map-fill)}
.lbtn.is-primary:hover{background:var(--c-map);filter:brightness(1.12)}
.srcline{font-size:.8rem;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.srcline a{text-decoration:underline;text-underline-offset:3px}

/* ---------- דיאלוג ההגדרות ---------- */
/* בדסקטופ הפקדים נשארים בשורה העליונה והכפתור מיותר. */
#settingsBtn{display:none}
#setDlg{max-width:min(420px,94vw)}
#setDlg::backdrop{background:rgba(10,13,17,.52)}
.set-hd{display:flex;align-items:center;gap:12px;
  background:var(--surface);border:1px solid var(--line);border-bottom:none;
  border-radius:var(--r) var(--r) 0 0;padding:16px 18px 12px}
.set-ttl{font-family:var(--f-display);font-weight:700;font-size:1.15rem;margin:0;flex:1}
.set-body{background:var(--surface);border:1px solid var(--line);border-top:none;
  border-radius:0 0 var(--r) var(--r);padding:4px 18px 20px;
  display:flex;flex-direction:column;gap:16px}
/* בתוך הדיאלוג לפקדים יש רוחב מלא — שם אין תחרות על מקום */
.set-body .tb-tools{margin-inline-start:0;flex-direction:column;align-items:stretch;gap:12px}
.set-body .seg{width:100%}
.set-body .seg button{flex:1;text-align:center;padding:11px 10px;min-height:44px}
.set-body #themeBtn{width:100%;min-height:44px;gap:9px}
.set-row-lbl{font-family:var(--f-ui);font-size:.78rem;font-weight:600;color:var(--ink-3);
  margin:0 0 -8px}

@media (max-width:880px){
  /* בנייד זהו השער היחיד לשפה, למטבע ולנושא — והחלפת שפה היא פקד
     נגישות (היא קובעת את lang של המסמך ולכן את קול הקורא). 44×44
     במקום 33×33, והריפוד של השורה מתכווץ כדי לשמור על ≤120px. */
  #settingsBtn{display:inline-flex;width:44px;height:44px}
  .tb-row.r1{padding-top:6px;padding-bottom:6px}
  /* מוסתרים בשורה, אך אותם צמתים עצמם — לא עותק. */
  .topbar .tb-tools{display:none}
  .set-body .tb-tools{display:flex}
}

/* במצב ניגודיות גבוהה של Windows גם box-shadow וגם background
   מבוטלים — כלומר הסימן שאינו-צבע היה נעלם דווקא במצב שנועד לעזור.
   Highlight הוא צבע מערכת ולכן שורד. */
@media (forced-colors:active){
  .tab[aria-current="page"]{border-block-end:3px solid Highlight}
  .bnav[aria-current="page"]::before{background:Highlight;forced-color-adjust:none}
}

/* ---------- מצב "לפי מרחק" ---------- */
.seg-sort{align-self:stretch;margin:0 10px}
.seg-sort button{flex:1;text-align:center;padding:9px 11px;font-size:.84rem}

/* אזור ה-live הוא גם הטקסט הגלוי. שני מקורות אמת נפרדים היו
   מסתדרים זה מזה ומכריזים כפול. */
.near-status{margin:8px 10px 0;font-size:.82rem;color:var(--ink-3);min-height:1em}
.near-status:empty{margin-top:0}
.near-body{display:flex;flex-direction:column;gap:12px;padding:10px 10px 4px;min-height:0;overflow-y:auto}
.near-head{font-family:var(--f-display);font-weight:700;font-size:1.05rem;margin:0}
.near-hint{margin:0;font-size:.79rem;color:var(--ink-3);line-height:1.5}
.near-wait{margin:0;font-size:.95rem;color:var(--ink-2)}
/* המצב הזה הוא מידע ולא כשל — בלי אדום ובלי אייקון שגיאה.
   עד היציאה ב-26/10 זהו המצב הנפוץ ביותר של המסך. */
.near-far{margin:0;font-size:.92rem;color:var(--ink-2);line-height:1.55}
.near-err{margin:0;font-size:.9rem;color:var(--ink);line-height:1.55}
.near-how{margin:0;font-size:.8rem;color:var(--ink-2);line-height:1.6;
  background:var(--surface-2);border-radius:var(--r-xs);padding:10px 12px}
.btn-near{
  font-family:var(--f-ui);font-weight:600;font-size:.9rem;
  background:var(--brand);color:var(--brand-ink);border-radius:var(--r-sm);
  padding:12px 16px;text-align:center;min-height:44px;
}
.btn-near:hover{filter:brightness(1.08)}
.near-pick{display:flex;flex-direction:column;gap:7px;
  border-top:1px solid var(--line-soft);padding-top:12px}
.near-pick-t{margin:0;font-size:.83rem;color:var(--ink-2)}
.near-sel{
  font:inherit;font-size:.9rem;color:var(--ink);background:var(--surface);
  border:1px solid var(--line-ctl);border-radius:var(--r-xs);padding:10px 12px;
  min-height:44px;width:100%;
}
.near-list{display:flex;flex-direction:column;gap:2px}
.near-row{
  display:flex;align-items:center;gap:12px;padding:11px 10px;
  border-radius:var(--r-xs);transition:background .13s;
}
.near-row:hover{background:var(--surface-2)}
/* המרחק ראשון בכיוון הקריאה. tabular-nums כדי שהעמודה לא תרקוד
   בין שורה לשורה — אותו טיפול כמו .money. */
.near-dist{
  flex:none;min-width:62px;font-family:var(--f-ui);font-weight:700;font-size:.86rem;
  color:var(--brand);font-variant-numeric:tabular-nums;
}
.near-txt{min-width:0;flex:1}
/* ל-<bdi> יש dir="auto": שם לטיני הופך את התיבה ל-LTR, ואז היא
   נצמדת לשמאל בעוד שורת המשנה העברית נצמדת לימין. width:fit-content
   מצמיד את התיבה עצמה לקצה ההתחלה של ההורה ה-RTL — אותו פתרון כמו
   ב-.ttl-en. הטקסט בתוכה עדיין נקרא LTR, כפי שצריך. */
.near-name{display:block;width:fit-content;max-width:100%;
  font-family:var(--f-display);font-weight:600;font-size:.98rem;
  line-height:1.25;overflow-wrap:anywhere}
.near-sub{font-size:.76rem;color:var(--ink-3);margin-top:2px}

/* ---------- ניווט תחתון ---------- */
.botnav{display:none}
@media (max-width:880px){
  :root{
  scroll-padding-top:150px;scroll-padding-bottom:calc(var(--navh) + 14px);--navh:64px}
  .tabs{display:none}
  /* ארבע שורות כרום דביקות בולעות חצי מסך בנייד — הניווט התחתון מכסה את הצורך */
  .topbar{position:static}
  .botnav{
    display:flex;position:fixed;inset-inline:0;bottom:0;z-index:60;
    background:var(--surface);border-top:1px solid var(--line);
    padding:5px 4px calc(5px + env(safe-area-inset-bottom));
  }
  .bnav{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    font-family:var(--f-ui);font-size:.68rem;font-weight:500;color:var(--ink-3);padding:6px 2px;border-radius:var(--r-xs)}
  .bnav{position:relative}
  .bnav[aria-current="page"]{color:var(--brand);font-weight:600}
  /* אותו עיקרון בניווט התחתון: פס מעל הפריט, לא רק צבע. */
  .bnav[aria-current="page"]::before{
    content:"";position:absolute;top:0;inset-inline:22%;height:3px;
    border-radius:0 0 3px 3px;background:var(--brand);
  }
  .pcard{flex-basis:212px}
  .of-note{display:none}
}
.empty{padding:52px 16px;text-align:center;color:var(--ink-2)}
.empty svg{width:30px;height:30px;color:var(--ink-3);margin-bottom:8px}

/* ---------- משטחי הדפדפן ----------
   בחירת טקסט, סמן, פס גלילה וקו תחתון מגיעים עם ברירות מחדל שלא שייכות
   לשום מערכת עיצוב. צובעים אותם מהפלטה. */
::selection{background:var(--brand);color:var(--brand-ink)}
:root{caret-color:var(--brand);accent-color:var(--brand);scrollbar-color:var(--line-ctl) transparent}
*{scrollbar-width:thin}
*::-webkit-scrollbar{width:10px;height:8px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--line-ctl);border-radius:99px;
  border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:var(--ink-3);background-clip:content-box}
a{text-underline-offset:3px;text-decoration-thickness:1px}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="wrap">
<a class="skip" href="#main" id="skipLink">דלג לתוכן</a>

<header class="topbar" id="topbar">
  <div class="tb-row r1">
    <div class="brand"><span class="bar"></span><span id="brandName">ויאטנם</span> <span id="brandSub">נובמבר 2026</span></div>
    <div class="tb-tools" id="tbTools">
      <div class="seg" role="group" id="langSeg"></div>
      <div class="seg" role="group" id="curSeg"></div>
      <button class="iconbtn" id="themeBtn" type="button" aria-pressed="false"></button>
    </div>
    <!-- בנייד שלושת הפקדים בולעים שורה שלמה. הכפתור פותח אותם בדיאלוג,
         והם עצמם עוברים לשם פיזית — עותק שני היה יוצר מזהים כפולים. -->
    <button class="iconbtn" id="settingsBtn" type="button" aria-haspopup="dialog"></button>
  </div>
  <div class="tripbar">
    <div class="tripbar-in" id="tripbar"></div>
  </div>
  <div class="official">
    <div class="official-in" id="officialRow"></div>
  </div>
  <div class="tb-row r2">
    <div class="searchbox" role="search">
      <label for="q" class="sr" id="qLabel">חיפוש</label>
      <input id="q" type="search" autocomplete="off">
      <button class="xbtn" id="clearBtn" type="button" hidden></button>
    </div>
    <nav class="tabs" id="tabs" aria-label="ניווט ראשי"></nav>
  </div>
</header>

<main id="main" tabindex="-1"></main>

<nav class="botnav" id="botnav" aria-label="ניווט ראשי"></nav>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
<dialog id="setDlg" aria-labelledby="setDlgTitle">
  <div class="set-hd">
    <h2 id="setDlgTitle" class="set-ttl"></h2>
    <button class="closebtn" id="setClose" type="button"></button>
  </div>
  <div class="set-body" id="setBody"></div>
  <div class="sr" id="setLive" aria-live="polite" aria-atomic="true"></div>
</dialog>
<div class="sr" id="live" aria-live="polite" aria-atomic="true"></div>

<script src="assets/climate.js" defer></script>
<script src="assets/photos.js" defer></script>
<script src="assets/poi-data.js" defer></script>
<script src="assets/app.js" defer></script>

<script>
// נרשם בשקט. הכשלה כאן לעולם לא צריכה לשבור את הדף.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
