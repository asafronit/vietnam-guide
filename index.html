<script id="splashgate">
/* שער הספלאש — מחליט לפני הצביעה הראשונה. מוצג רק כשאין העדפת
   reduced-motion וכשלא הוצג בסשן הזה. ?splash=0 מכבה, =1 מתעלם
   מהסשן, =force לבדיקה.
   force **מכבד** את reduced-motion: בלעדיו נשארה שכבה חוסמת סטטית. */
(function(){
  var p=new URLSearchParams(location.search), q=p.get("splash");
  var rm=false; try{rm=matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){}
  var seen=false; try{seen=sessionStorage.getItem("vnSplashSeen")==="1";}catch(e){}
  /* ההבחנה: reduced-motion נועד למנוע תנועה שהמשתמש **לא** ביקש.
     הפעלה אוטומטית מכבדת אותו במלואה. אבל force ו-hold מגיעים
     מלחיצה מפורשת על "הפעל את הפתיח" — זו בקשה, ולכן הם עוברים.
     בלי ההבחנה הזו מכונה שבה אפקטי האנימציה כבויים לא יכולה
     להציג את הפתיח לעולם, גם כשמבקשים. */
  var asked = (q==="force"||q==="hold");
  var show = q==="0" ? false : (asked ? true : (rm ? false : (q==="1" ? true : !seen)));
  /* מי שפותח ישר את מסך החירום לא מחכה לאנימציה (13-01). */
  if(!asked && /^#sos(\/|$)/.test(location.hash)) show=false;
  if(show){
    document.documentElement.classList.add("splash-on");
    try{sessionStorage.setItem("vnSplashSeen","1");}catch(e){}
    /* רשת ביטחון בלתי-תלויה: אם סקריפט הספלאש לא יגיע — והמדריך
       הוא פלט בנייה, כלומר הסקריפטים מופרדים מה-markup — המחלקה
       הייתה נשארת ו-overflow:hidden היה נועל את הדף לצמיתות. */
    /* ה-gate רץ ב-head, לפני ש-.wrap קיים, ולכן אינו יכול להציב
       inert כאן ועכשיו. עד כה הוא רק **הסיר** אותו — אסימטריה
       שבכל נתיב שבו splashjs חסר הותירה את הדף נגיש ל-Tab מתחת
       לווילון, כלומר פוקוס על פקד שאי אפשר לקרוא. */
    document.addEventListener("DOMContentLoaded",function(){
      if(!document.documentElement.classList.contains("splash-on")) return;
      var w=document.querySelector(".wrap"); if(w) w.setAttribute("inert","");
    });
    /* hold ניטרל את רשת הביטחון לגמרי, ודווקא הוא הנתיב היחיד
       שגם מוותר על טיימרי הסגירה. URL עם hold בסימנייה או בוואטסאפ
       היה נועל את הדף לצמיתות אצל מי שפותח אותו. חלון ארוך שומר
       את ערך הניפוי בלי לאפשר נעילה. */
    setTimeout(function(){
      document.documentElement.classList.remove("splash-on");
      var w=document.querySelector(".wrap"); if(w) w.removeAttribute("inert");
    },q==="hold"?30000:6000);
  }
})();
</script>

/* ==========================================================
   ויאטנם 2026 — מאגר המסע
   שקט: ניטרלי חמים, ג'ייד עמוק, פינות מרוסנות, אייקוני קו.
   ========================================================== */
:root{
  scroll-padding-top:150px;scroll-padding-bottom:calc(var(--navh) + 14px);
  /* פאזה 6: שפת האתר הראשי (VIETNAM/index.html:29). לא כיוון חדש אלא
     מערכת קיימת ומוכחת — סגול מלכותי, לבנדר בהיר, כרטיסים לבנים.
     הסיבה: כיוון D הוכרע על מוקאפ ונסחף פעמיים במימוש; אתר חי אפשר
     למדוד ממנו במקום לפרש אותו. */
  /* פאזה 10 (11/10): אריחי מטרו בסגול פסטל. הקרקע לבנה, וה"כרטיסים" הם
     אריחי לילך שטוחים — בלי פינות, בלי צל, בלי מסגרת. המספרים בהערות נמדדו
     בסקריפט luminance לפני הכתיבה. חוזה הכיוון:
     .impeccable/surfaces/trip-template-html.md */
  --bg:#ffffff;
  --surface:#efeafc;         /* אריח לילך · דיו עליו 15.68 */
  --surface-2:#e2d9f8;
  /* 11/10 (בקשת אסף): הסגול הוכהה ונוספה מסגרת כהה. על הגוון הכהה
     --ink-3/jade/gold/rose הרגילים נופלים מתחת ל-4.5, ולכן בתוך אריח
     הם מוחלפים בגרסאות -tile (ראו .mt,.tile,… בשכבת המטרו). */
  --tile:#b5a1ec;            /* אריח פסטל · דיו 8.15 · --ink-3-tile 5.77 */
  --tile-pale:#e8e0fa;       /* דיו 14.2 · --ink-3-tile 10.25 */
  --edge:3px;                /* עובי המסגרת (10-04, בקשת אסף: מסגרת כהה בולטת) */
  --tile-edge:#2b2147;       /* מסגרת: 14.88 מול לבן, 6.57 מול הפסטל */
  --ink-3-tile:#332d47;  --jade-tile:#04402f;  --gold-tile:#453200;  --rose-tile:#6b1111;
  --tile-dark:#2b2147;       /* חציל · לבן עליו 14.88 · ענבר 7.41 */
  --on-tile-dark:#ffffff;
  --amber:#e2b01c;           /* סיכון בלבד, ורק על חציל או על הקרקע הכהה */
  --ink:#15121f;
  --ink-2:#3b3550;
  /* --muted של המקור (#6b7280) נותן 4.83 על לבן אבל רק **4.29** על
     הלבנדר — ושם יושבות כל תוויות המקטע. שני טוקנים, לא אחד. */
  --ink-3:#4a4560;           /* לבן 9.09 · לילך 7.72 · פסטל 5.20 */
  --ink-3-card:#4a4560;
  --line:rgba(21,18,31,.12);
  /* גבול פקדים. חייב להיות מוגדר בכל שלושת מצבי הצבע: משתנה חסר הופך
     את border:1px solid var(--x) ללא-חוקי, והקיצור כולו נופל ל-border-style:none. */
  /* .50 ולא .42. הטוקן הזה הוא הגבול של כל פקד באתר, ועל --surface
     הלבן הוא נמדד 2.69 מול דרישת 3:1 של 1.4.11. ב-select החדש זה
     קריטי כי הגבול הוא כל האפורדנס — הטקסט שבתוכו הוא הערך, לא
     זיהוי הפקד. .50 נותן 3.39. מכהה 24 גבולות בשמינית אלפא ואינו
     מזיז אף צבע זהות. */
  --line-ctl:rgba(21,18,31,.55);
  --line-soft:#e2d9f8;
  /* הסגול ממלא שני תפקידים מנוגדים — טקסט ומילוי — והם מתהפכים
     בכיוונים שונים במצב כהה. טוקן אחד לא יכול לעשות את שניהם; זה
     בדיוק הבאג שתועד כאן על --c-map. */
  --primary-ink:#2b2147;
  --primary-fill:#2b2147;
  --primary-on:#ffffff;
  --primary-2:#2b2147;       /* אין גרדיאנט בשפת האריחים — שני הקצוות זהים */
  --brand:#2b2147;
  --brand-ink:#ffffff;
  --brand-soft:#efeafc;
  /* זהב: 7.39 על הקצה הכהה, אך רק 4.29 על הבהיר — כלומר תקף שם
     ורק ב-bold מעל 18.66px. לא להשתמש בו בטיפוגרפיה קטנה.
     --gold הוא צבע מילוי. לטקסט ולקווי מתאר יש --gold-ink: הזהב
     עצמו נותן 1.62 על לבן, ולכן כל שימוש טיפוגרפי בו נכשל במצב
     הבהיר. אותה משפחת ענבר, ניגודיות תקפה: 6.38 על --surface. */
  --gold:#f5c542;
  --gold-ink:#5c4300;        /* פאזה 10: 5.33 על אריח הפסטל (היה 3.66) */
  --on-header:#ffffff;
  --on-header-2:#e2dbec;     /* אטום במקום opacity:.7 — 5.6 על הבהיר */
  /* אותו פיצול כמו --gold ו---gold-ink, ומאותה סיבה. --jade הוא צבע
     מילוי: הוא נכון כרקע בשורה 860 וכפס ב---wx-fill. כטקסט הוא עבר
     בדיוק כל זמן שהרקע היה --surface הלבן — 5.18 — ונפל ברגע שאותה
     מחלקה .good הגיעה אל --surface-2, שהוא בהיר אך לא לבן: 4.27 מול
     דרישה של 4.5, על טקסט 16.32px bold שאינו "גדול" (הסף 18.66).
     --jade-ink נותן 6.32 על --surface-2, 7.67 על לבן ו-6.81 על --bg.
     אינו נוגע ב---c-ride של תקן הקישורים, שנשאר #0f7c5c בדיוק. */
  --jade:#0f7c5c;  --jade-on:#ffffff;  --jade-ink:#07523c;   /* פאזה 10: 5.27 על אריח הפסטל (היה 4.39) */
  --rose:#991b1b;
  /* ערכי תקן הקישורים של הפרויקט — אינם משתנים. הסגול המותגי חי
     בכרום בלבד ולעולם לא על כפתור פעולה, ולכן אין התנגשות בהקשר. */
  --c-map:#0369a1;   --c-map-soft:rgba(3,105,161,.10);
  --c-map-fill:#0369a1; --c-map-on:#ffffff;
  --c-ride:#0f7c5c;  --c-ride-soft:rgba(15,124,92,.10);
  --c-chat:#6d28d9;  --c-chat-soft:rgba(109,40,217,.10);
  --c-video:#cc0000; --c-video-soft:rgba(204,0,0,.10);
  --c-book:#1e3a5f;  --c-book-soft:rgba(30,58,95,.10);
  --card-edge:transparent;
  --shadow:none;
  /* דיאלוג צף צריך קצה כלשהו מעל הקרקע הלבנה; קו ולא צל. */
  --shadow-lg:0 0 0 1px rgba(21,18,31,.18);
  --r:0;
  --r-sm:0;
  --r-xs:0;
  /* מחסנית המערכת כמו באתר הראשי. באייפון זה SF Hebrew — מצוין לעברית
     ועולה אפס. Assistant המוטמע נשאר אחריה כרשת ביטחון אופליין למי
     שאינו אפל. Frank Ruhl Libre ירד. */
  /* Heebo מוטמע ראשון; המחסנית הקודמת אחריו כרשת ביטחון ולתווים וייטנאמיים. */
  --f-display:"Heebo",-apple-system,BlinkMacSystemFont,"Segoe UI","Assistant",Arial,sans-serif;
  --f-ui:"Heebo",-apple-system,BlinkMacSystemFont,"Segoe UI","Assistant",Arial,sans-serif;
  --f-body:"Heebo",-apple-system,BlinkMacSystemFont,"Segoe UI","Assistant",Arial,sans-serif;
  --gutter:clamp(15px,4vw,28px);
  --navh:0px;
  --sticky-top:0px;
}

     בלי קצה מפורש כל הפריסה מתמוטטת לגוש אחיד. */
  --card-edge:transparent;
  --shadow:none;
  --shadow-lg:0 0 0 1px rgba(242,239,250,.22);
}


*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--f-body);font-size:.97rem;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{padding-bottom:var(--navh)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;inset-inline-start:-9999px;top:0;z-index:99;background:var(--brand);color:var(--brand-ink);padding:11px 18px;font-family:var(--f-ui);font-weight:500}
.skip:focus{inset-inline-start:0}
.en{direction:ltr;unicode-bidi:isolate}
svg.ic{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg.ic-lg{width:21px;height:21px}

/* פאזה 11: באייפון בלי זה הטקסט מתנפח כשמסובבים לרוחב. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}

/* ---------- סרגל עליון ---------- */
/* viewport-fit=cover מכניס את הדף מתחת לשעון ולאי הדינמי באפליקציה המותקנת.
   הרקע ממשיך מתחתם, והתוכן נדחף מהם. מחוץ לאייפון הערך 0. */
.topbar{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid transparent;transition:border-color .2s;
  padding-top:env(safe-area-inset-top,0px)}
.topbar.is-stuck{border-bottom-color:var(--line)}
.tb-row{max-width:1140px;margin:0 auto;padding:0 var(--gutter);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
/* הכותרת הסגולה של האתר הראשי. היא הזהות, ולכן אינה מתהפכת במצב
   כהה — רק מה שסביבה. */
.tb-row.r1{padding-top:13px;padding-bottom:14px;background:linear-gradient(135deg,var(--primary-fill),var(--primary-2));
  color:var(--on-header);max-width:none}
.r1-in{max-width:1140px;margin:0 auto;width:100%;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
/* הכותרת היא קישור הביתה שגם מריץ מחדש את הפתיח. ניווט אמיתי ולא
   מתג: שער הספלאש רץ ב-<head> לפני הצביעה הראשונה, ולכן רק טעינה
   נקייה יכולה להציג אותו שוב. */
/* בלי הטיפול הזה הקישור נראה בדיוק כמו טקסט, ואי אפשר לנחש שהוא
   לחיץ — במגע אין hover שיגלה את זה. האייקון הוא הסימן. */
.brand{font-family:var(--f-ui);font-weight:800;font-size:1.08rem;display:inline-flex;align-items:center;gap:8px;
  letter-spacing:-.01em;color:inherit;text-decoration:none;min-height:44px;
  padding:4px 11px 4px 9px;border-radius:999px;
  border:1px solid rgba(255,255,255,.34);background:rgba(255,255,255,.08);
  transition:background .14s,border-color .14s,scale .12s cubic-bezier(.23,1,.32,1)}
@media (hover:hover) and (pointer:fine){.brand:hover{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.6)}}
.brand:active{background:rgba(255,255,255,.26)}
.brand .ic{width:16px;height:16px;flex:none;opacity:.95}
/* הזהב תקף כאן רק כטקסט גדול ומודגש, וסף "גדול" ב-bold הוא 18.66px.
   ב-1.08rem זה היה 17.28px — כלומר מתחת לסף, ולכן הדרישה הייתה 4.5
   בעוד ההערה עצמה מדדה 4.29. 1.17rem מעביר את הסף בפחות מפיקסל,
   והצבע לא זז. גלולת ה-.brand מבהירה את הגרדיאנט תחתיה, ולכן המספר
   בפועל נמוך מהמדידה על הגרדיאנט הנקי. */
.brand span{font-weight:800;color:var(--gold);font-size:1.17rem}
.brand .bar{display:none}
/* ספירה לאחור. המספר לבדו קורא "34"; המשפט המלא יושב ב-sr. */
.countdown{width:100%;margin:10px 0 0;display:flex;align-items:baseline;gap:9px;font-size:.84rem;color:var(--on-header-2)}
.countdown b{font-size:2rem;font-weight:800;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.tb-tools{display:flex;gap:7px;align-items:center;margin-inline-start:auto;flex-wrap:wrap}

/* מקטע מחליף — שפה ומטבע */
.seg{display:inline-flex;border:1px solid var(--line-ctl);border-radius:var(--r-xs);background:var(--surface)}
.seg button{
  font-family:var(--f-ui);font-size:.79rem;font-weight:500;color:var(--ink-2);
  padding:6px 11px;border-inline-start:1px solid var(--line-soft);transition:background .13s,color .13s,scale .12s cubic-bezier(.23,1,.32,1);
}
.seg button:first-child{border-inline-start:none}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
@media (hover:hover) and (pointer:fine){.seg button:hover:not([aria-pressed="true"]){background:var(--surface-2);color:var(--ink)}}
.iconbtn{
  display:inline-flex;align-items:center;justify-content:center;width:33px;height:33px;
  border:1px solid var(--line-ctl);border-radius:var(--r-xs);color:var(--ink-2);background:var(--surface);
  transition:background .13s,color .13s,scale .12s cubic-bezier(.23,1,.32,1);
}
/* פקדים שיושבים על הכותרת הסגולה */
.tb-row.r1 .iconbtn{border-color:rgba(255,255,255,.45);color:#fff;background:transparent;border-radius:999px}
.tb-row.r1 .seg{border-color:rgba(255,255,255,.45);background:transparent;border-radius:999px;overflow:hidden}
.tb-row.r1 .seg button{color:#fff;border-inline-start-color:rgba(255,255,255,.3)}
.tb-row.r1 .seg button[aria-pressed="true"]{background:#fff;color:var(--primary-fill)}
@media (hover:hover) and (pointer:fine){.tb-row.r1 .seg button:hover:not([aria-pressed="true"]){background:rgba(255,255,255,.14);color:#fff}}
/* טבעת פוקוס על רקע סגול או על תצלום: טבעת בודדת בצבע המותג נעלמת.
   הדפוס הכפול כבר הוכח כאן על .hero-name — מרחיבים את תחולתו. */
.tb-row.r1 :focus-visible,.tile:focus-visible{
  outline:3px solid #fff;outline-offset:2px;box-shadow:0 0 0 6px rgba(0,0,0,.85);border-radius:8px
}
#splash .sp-skip:focus,#splash .sp-skip:focus-visible{
  outline:3px solid #fff;outline-offset:2px;box-shadow:0 0 0 6px rgba(0,0,0,.85);border-radius:999px
}
@media (hover:hover) and (pointer:fine){.iconbtn:hover{background:var(--surface-2);color:var(--ink)}}

/* מסגרת הטיול: תאריכים, היום, וספירה לאחור */
.tripbar{border-top:1px solid var(--line-soft);background:var(--surface)}
.tripbar-in{max-width:1140px;margin:0 auto;padding:8px var(--gutter);
  display:flex;flex-wrap:wrap;gap:8px 22px;align-items:baseline}
.tb-item{display:flex;align-items:baseline;gap:7px;font-size:.83rem;color:var(--ink-2)}
.tb-item b{font-family:var(--f-ui);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.tb-item .lbl{font-size:.75rem;color:var(--ink-3)}
.tb-count{margin-inline-start:auto;display:flex;align-items:baseline;gap:7px}
.tb-count b{font-family:var(--f-ui);font-weight:600;font-size:1.02rem;color:var(--brand);font-variant-numeric:tabular-nums}
.tb-sep{width:1px;align-self:stretch;background:var(--line-soft)}
@media (max-width:640px){ .tb-count{margin-inline-start:0} }

/* שורת קישורים רשמיים */
.official{border-top:1px solid var(--line-soft);background:var(--surface)}
.official-in{max-width:1140px;margin:0 auto;padding:7px var(--gutter);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.oflink{
  display:inline-flex;align-items:center;gap:7px;font-family:var(--f-ui);font-size:.8rem;font-weight:500;
  color:var(--ink-2);border:1px solid var(--line-ctl);border-radius:var(--r-xs);padding:6px 11px;
  transition:border-color .13s,color .13s,scale .12s cubic-bezier(.23,1,.32,1);
}
@media (hover:hover) and (pointer:fine){.oflink:hover{border-color:var(--brand);color:var(--brand)}}
.oflink svg{color:var(--brand)}
.of-note{font-size:.78rem;color:var(--ink-3);margin-inline-start:auto}

/* ---------- חיפוש + ניווט ---------- */
.tb-row.r2{padding-top:10px;padding-bottom:10px;gap:10px}
.searchbox{
  flex:1 1 260px;display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--line-soft);border-radius:999px;padding:11px 16px;
  box-shadow:var(--shadow);transition:border-color .13s;
}
.searchbox:focus-within{border-color:var(--brand)}
.searchbox input{flex:1;min-width:0;border:none;background:none;font:inherit;color:var(--ink);padding:0}
.searchbox input:focus{outline:none}
.searchbox input::-webkit-search-cancel-button{display:none}
.searchbox input::placeholder{color:var(--ink-3)}
.searchbox .ic{color:var(--ink-3)}
.xbtn{color:var(--ink-3);flex:none;padding:4px;display:flex;border-radius:4px;min-width:25px;min-height:25px;align-items:center;justify-content:center}
@media (hover:hover) and (pointer:fine){.xbtn:hover{color:var(--rose)}}
.tabs{display:flex;gap:2px}
.tab{
  font-family:var(--f-ui);font-size:.85rem;font-weight:500;color:var(--ink-2);
  padding:8px 13px;border-radius:var(--r-xs);display:inline-flex;gap:7px;align-items:center;
  transition:background .13s,color .13s,scale .12s cubic-bezier(.23,1,.32,1);
}
@media (hover:hover) and (pointer:fine){.tab:hover{background:var(--surface-2);color:var(--ink)}}
/* m-3: הפרש הרקע היה 1.10:1 בלבד — כלומר המצב הפעיל היה מסומן בצבע
   ובמשקל בלבד. הפס התחתון הוא הסימן שאינו תלוי בתפיסת צבע, ושורד
   גם קריאה באור שמש ישיר. */
.tab[aria-current="page"]{background:var(--surface-2);color:var(--ink);font-weight:600;
  box-shadow:inset 0 -3px 0 0 var(--brand)}
.tab .cnt{font-size:.76rem;color:var(--ink-3);font-weight:400}

/* ---------- גוף ---------- */
main{max-width:1140px;margin:0 auto;padding:8px var(--gutter) 64px}
/* יעד פוקוס תכנותי בלבד, לא נגיע אליו ב-Tab — טבעת סביב כל הדף רק מפריעה */
main:focus,main:focus-visible{outline:none}
/* פותח פרק, לא כותרת קטנה. הטווח 01–05 הוא סדר המסלול מצפון לדרום,
   כלומר מידע שהקורא צריך ולא קישוט. */
.sec-head{
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  font-family:var(--f-display);font-weight:700;font-size:clamp(1.5rem,4vw,2.1rem);
  line-height:1.05;letter-spacing:-.015em;
  margin:52px 0 18px;padding-bottom:12px;border-bottom:1px solid var(--ink);
}
.sec-head .cnt{
  font-family:var(--f-body);font-size:.86rem;font-weight:400;color:var(--ink-3);
  margin-inline-start:auto;letter-spacing:0;
}
.sec-head .range{font-family:var(--f-ui);font-size:.92rem;font-weight:500;
  color:var(--ink-3);letter-spacing:.02em;font-variant-numeric:tabular-nums}

/* בלוקי לוח-התחנה, המדף האופקי והחשיפה המדורגת הוסרו יחד עם
   הפונקציות שייצרו אותם. הראוטר מנתב הכל ל-screenSplit. */
/* ---------- עמוד תחנה ---------- */
.hero{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:4px}
.hero-txt{position:absolute;inset-block-end:0;inset-inline:0;padding:72px 24px 22px;color:#fff;
  background:linear-gradient(to top,rgba(10,13,17,.92),rgba(10,13,17,.64) 55%,rgba(10,13,17,.24))}
.hero-name{font-family:var(--f-display);font-weight:700;font-size:clamp(1.9rem,6vw,3.4rem);line-height:1.02;letter-spacing:-.02em;margin:0;text-wrap:balance;text-shadow:0 2px 22px rgba(0,0,0,.5)}
.hero-name:focus{outline:none}
/* טבעת כפולה: לבן עובד מעל רקע כהה, השחור שסביבו מעל רקע בהיר —
   ואחד מהם תמיד רלוונטי. כאן נוחת הפוקוס בכל מעבר מסך במקלדת,
   והתצלום שמתחת אינו ידוע מראש. --brand אינו אפשרות: הוא נבלע
   בתצלום כהה בבהיר, ובשקיעה בכהה. */
.hero-name:focus-visible{outline:3px solid #fff;outline-offset:3px;
  box-shadow:0 0 0 6px rgba(0,0,0,.85);border-radius:3px}
.hero-sub{font-family:var(--f-ui);font-weight:400;font-size:.9rem;opacity:.88;margin-top:2px}
.backbtn{
  display:inline-flex;align-items:center;gap:7px;font-family:var(--f-ui);font-weight:500;font-size:.85rem;
  color:var(--ink-2);border:1px solid var(--line-ctl);background:var(--surface);
  padding:7px 13px;border-radius:var(--r-xs);margin:2px 0 12px;
}
@media (hover:hover) and (pointer:fine){.backbtn:hover{color:var(--ink);border-color:var(--brand)}}
.backbtn svg{transform:scaleX(1)}
:root[dir="rtl"] .backbtn svg,html[dir="rtl"] .backbtn svg{transform:scaleX(-1)}

/* ---------- תצוגה מפוצלת ----------
   הרשימה קבועה בצד, הפרטים מתחלפים לצידה. לא עוזבים את הדף:
   מעבר בין תחנות הוא החלפת התוכן בחלונית אחת, לא ניווט לעמוד חדש. */
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.rail{position:sticky;top:calc(var(--sticky-top) + 8px);max-height:calc(100vh - var(--sticky-top) - 24px);
  max-height:calc(100dvh - var(--sticky-top) - 24px);
  display:flex;flex-direction:column;gap:10px;min-height:0}
.rail-head{display:flex;align-items:baseline;gap:8px;padding:2px 10px 6px;
  font-family:var(--f-ui);font-weight:600;font-size:.92rem;border-bottom:1px solid var(--line)}
.rail-tab{
  flex:1;font-family:var(--f-ui);font-size:.82rem;font-weight:500;color:var(--ink-2);
  padding:8px 6px;border-radius:var(--r-xs);display:flex;align-items:center;justify-content:center;gap:6px;
  transition:background .13s,color .13s,scale .12s cubic-bezier(.23,1,.32,1);
}
@media (hover:hover) and (pointer:fine){.rail-tab:hover{color:var(--ink)}}
.rail-tab[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.rail-list{overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:2px;padding-inline-end:2px;min-height:0}
.rail-sect{display:flex;flex-direction:column}
.rail-ul{display:flex;flex-direction:column;gap:2px}
.rail-group{font-family:var(--f-ui);font-size:.74rem;font-weight:600;color:var(--ink-3);
  padding:12px 10px 5px;letter-spacing:.02em}
.rail-item{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-xs);
  text-align:start;width:100%;transition:background .12s,scale .12s cubic-bezier(.23,1,.32,1);position:relative;
}
@media (hover:hover) and (pointer:fine){.rail-item:hover{background:var(--surface-2)}}
.rail-item[aria-current="page"]{background:var(--surface);box-shadow:var(--shadow)}
.rail-item[aria-current="page"]::before{
  content:"";position:absolute;inset-block:9px;inset-inline-start:0;width:3px;
  border-radius:2px;background:var(--stationcolor);
}
.rail-thumb{width:44px;height:34px;border-radius:5px;object-fit:cover;flex:none;background:var(--surface-2)}
.rail-txt{min-width:0;flex:1}
.rail-name{font-family:var(--f-ui);font-weight:500;font-size:.9rem;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-item[aria-current="page"] .rail-name{font-weight:600}
.rail-sub{font-size:.75rem;color:var(--ink-3)}
.rail-n{font-family:var(--f-ui);font-size:.78rem;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}

.detail{min-width:0}
.detail-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  min-height:52vh;text-align:center;color:var(--ink-2);
  border:1px dashed var(--line-ctl);border-radius:var(--r);padding:32px;
}
.detail-empty svg{width:30px;height:30px;color:var(--ink-3)}
.detail-empty b{font-family:var(--f-ui);font-weight:600;font-size:1.05rem;color:var(--ink)}

/* טאבי קטגוריה בתוך חלונית הפרטים */
/* נמדד בהאנוי: 10 טאבים, רוחב רצועה 349px, scrollWidth 1,237px —
   8 מתוך 10 מחוץ למסך בלי שום רמז שהם קיימים. קורא מסך דווקא שמע
   "טאב, 3 מתוך 10" מתוך ה-tablist עצמו, כלומר הוא ידע יותר מהמשתמש
   הרואה. הדהייה והמחוון סוגרים את הפער הזה. */
.cat-tabswrap{position:relative}
.cat-tabs{
  display:flex;gap:4px;overflow-x:auto;padding:4px 0 10px;margin-top:18px;
  border-bottom:1px solid var(--line);scrollbar-width:none;
  /* חצי צ'יפ גלוי בקצה הוא האפורדנס. הצ'יפ החתוך נשאר נגיש במלואו —
     חיתוך חזותי אינו מקטין את שטח ההקשה. */
  scroll-padding-inline-end:2.25rem;
}
.cat-tabs::-webkit-scrollbar{display:none}
/* דהיית הקצה היא קישוט: היא רומזת שיש עוד ואינה נושאת מידע, ולכן
   pseudo-element שאינו בעץ הנגישות הוא הכלי הנכון. והיא יושבת על
   עוטף חיצוני ולא בתוך ה-tablist — ילד ישיר של role=tablist חייב
   להיות role=tab, אחרת זו אי-התאמת הורה-ילד ב-ARIA. */
.cat-tabswrap::after{
  content:"";position:absolute;pointer-events:none;
  inset-block:0;inset-inline-end:0;width:2.25rem;
  background-image:linear-gradient(to left,var(--bg) 20%,transparent 100%);
}
/* inset-inline-end מתהפך לבד; ל-linear-gradient צריך כיוון פיזי. */
html[dir="ltr"] .cat-tabswrap::after{
  background-image:linear-gradient(to right,var(--bg) 20%,transparent 100%);
}
.cat-pos{
  font-family:var(--f-ui);font-size:.72rem;font-weight:600;
  color:var(--ink-3);font-variant-numeric:tabular-nums;
  padding:5px 2px 0;text-align:center;
}
/* דהיית קצה יכולה להסתיר טאב שקיבל פוקוס — אותו 2.4.11 ששורה
   scroll-margin-top על .tile מטפלת בו. focus() גולל את המינימום
   ומצמיד את הטאב לקצה החתוך, כלומר מתחת לדהייה. */
.cat-tab{scroll-margin-inline:2.25rem}
@media (forced-colors:active){
  /* גרדיאנט CSS מושלך במצב הזה, וה-pseudo נשאר מלבן ברקע Canvas אטום
     מעל הטאב שבקצה — הקישוט הופך לחוסם תוכן. mask-image דווקא **אינו**
     מבוטל כאן, ולכן הוא היה ממשיך לחתוך את התווית לשקיפות בלי שום
     הסבר חזותי; לכן גרדיאנט, ולכן כיבוי מלא. */
  .cat-tabswrap::after{display:none}
}
.cat-tab{
  font-family:var(--f-ui);font-size:.85rem;font-weight:500;color:var(--ink-2);
  padding:8px 13px;border-radius:var(--r-xs);white-space:nowrap;
  display:inline-flex;align-items:center;gap:7px;transition:background .13s,color .13s,scale .12s cubic-bezier(.23,1,.32,1);
}
@media (hover:hover) and (pointer:fine){.cat-tab:hover{background:var(--surface-2);color:var(--ink)}}
.cat-tab[aria-selected="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.cat-tab .n{font-size:.76rem;font-variant-numeric:tabular-nums}
.cat-panel{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:16px}

@media (max-width:900px){
  /* 268 פיקסלים של כרום מתוך 844 הם 32% מהמסך לפני שרואים תחנה אחת.
     מסגרת הטיול והקישורים הרשמיים אינם החלטות שמקבלים כל שנייה —
     מקומם במסך "מידע", לא קבועים מעל כל גלילה. */
  .tripbar,.official{display:none}
  .split{grid-template-columns:1fr}
  .rail{position:static;max-height:none}
  .rail-list{overflow:visible;max-height:none}
  .split.has-detail .rail{display:none}
  .split:not(.has-detail) .detail{display:none}
}
/* ---------- מפה + גיליון נגרר (נייד בלבד) ----------
   הדסקטופ נשאר מפוצל. כאן המפה ממלאת את המסך והרשימה יושבת בגיליון
   שנגרר לשלושה גבהים, כי בטלפון האגודל מגיע לתחתית ולא לראש. */
#mapPane{display:none}
.sheet-scrim{display:none}
@media (max-width:900px){
  body.mob-map{overflow:hidden}
  body.mob-map main{padding:0;max-width:none}
  #mapPane{
    display:block;position:fixed;inset-block-start:var(--map-top,0);inset-inline:0;
    inset-block-end:0;z-index:1;background:var(--surface-2);
    /* Leaflet מוסיף .leaflet-container לצומת שמוסרים לו, ו-height:100%
       שם דרס את הפריסה מבוססת ה-inset — הפאנל יצא בגובה מסך מלא
       שמתחיל מתחת לסרגל, כלומר תחתיתו נתלתה מחוץ למסך. */
    height:auto;
  }
  .leaflet-container{width:100%;height:100%;font-family:var(--f-body)}
  .mob-sheet{
    /* מתחת לניווט התחתון (14-01, X-03). קודם הגיליון היה מעליו (70 מול
       60), כדי שהידית ב-SNAP[2] לא תיבלע בניווט — אבל snapHidden() כבר
       מציב את הידית מעל הניווט לפי מידה, והמחיר של "מעל" היה שכל ששת
       פריטי הניווט מוסתרים במפה ובכל ארבע-עשרה התחנות: אין דרך להגיע
       ל"מעברים", "מידע" או "שמורים". עכשיו הניווט ב-80, מעל הגיליון. */
    position:fixed;inset-inline:0;inset-block-end:0;z-index:70;
    /* dvh ולא vh: ב-Safari vh הוא הגובה כשהכרום מקופל, וה-snaps נמדדים
       מול innerHeight. בפער ביניהם הגיליון החליק מתחת לאצבע ותחתיתו
       נחתכה מאחורי שורת הכתובת. vh נשאר כ-fallback לדפדפן ישן. */
    height:92vh;height:92dvh;background:var(--surface);
    border-start-start-radius:18px;border-start-end-radius:18px;
    box-shadow:0 -6px 28px rgba(0,0,0,.22);
    display:flex;flex-direction:column;
    transform:translateY(55vh);transform:translateY(55dvh);
    /* עקומת המגירה של iOS (Ionic/Vaul): יוצאת מהר ונוחתת רכה. */
    transition:transform .32s cubic-bezier(.32,.72,0,1);
    touch-action:none;
  }
  .mob-sheet.is-dragging{transition:none}
  .sheet-grip{
    /* היה 19px גובה, מתחת ל-24 של WCAG 2.5.8. 12px מביא ל-28 בלי שינוי מראה. */
    flex:none;padding:12px 0;display:flex;justify-content:center;cursor:grab;
    touch-action:none;
  }
  .sheet-grip::before{
    content:"";width:38px;height:4px;border-radius:99px;background:var(--line-ctl);
  }
  /* touch-action:none על הגיליון חל על כל שרשרת הצאצאים בבדיקת
     הפגיעה, ולכן גלילת מגע בתוך הגוף נחסמה ב-iOS — המכשיר היחיד
     שחשוב כאן. */
  /* --sheet-off: כמה מהגיליון יושב מתחת לתחתית המסך (frac·גובה). בלי
     זה מיכל הגלילה "חשב" שפריט בתחתיתו נראה, והפוקוס נחת מחוץ למסך או
     מתחת לניווט (14-01, X-04: 14 פריטים במפה, 7 בהאנוי). scroll-padding
     מלמד את הדפדפן מהו האזור הנראה, וה-padding מאפשר גם לפריט האחרון
     להגיע אליו. מתעדכן ב-setSheet בלבד, לא בכל פריים של גרירה. */
  .sheet-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y pinch-zoom;
    padding:0 var(--gutter) calc(var(--sheet-off,0px) + var(--navh) + 18px);
    scroll-padding-bottom:calc(var(--sheet-off,0px) + var(--navh) + 12px)}
  body.mob-map .botnav{z-index:80}
  /* בתוך הגיליון הרשימה כבר לא דביקה ולא מוגבלת בגובה */
  body.mob-map .rail{position:static;max-height:none}
  body.mob-map .rail-list{overflow:visible;max-height:none}
  body.mob-map .topbar{position:relative;z-index:40;background:var(--bg)}
  .map-pin{
    display:grid;place-items:center;min-width:26px;min-height:26px;border-radius:50%;
    font-family:var(--f-ui);font-weight:600;font-size:.68rem;
    /* 14-02: לבן ואחריו קו כהה. כל צבע אריח מגיע ל-4.3:1 לפחות מול אחד
       מהשניים, ולכן הזוג מבטיח 3:1 מול כל רקע מפה. #15121f קשיח ולא
       --ink: אריחי OSM לא מתהפכים במצב כהה. הצל באותה הצהרה, אחרת נדרס. */
    border:2px solid #fff;box-shadow:0 0 0 1.5px #15121f,0 1px 5px rgba(0,0,0,.4);
    font-variant-numeric:tabular-nums;
  }
  /* .is-on ו-:focus-visible היו כמעט זהים — סמן שהוא גם נבחר וגם
   ממוקד לא נבדל מסמן שרק נבחר. הנבחר מסומן בטבעת המותג; הפוקוס
   מקבל את הטבעת הדו-גונית שכבר הוכחה מעל תצלום לא ידוע. */
.map-pin.is-on{outline:3px solid var(--brand);outline-offset:2px}
.leaflet-marker-icon:focus-visible{
  outline:3px solid #fff;outline-offset:2px;
  box-shadow:0 0 0 6px rgba(0,0,0,.85);border-radius:50%;
}
}
/* ---------- מזג אוויר והיתכנות ---------- */
.wx{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px 14px;margin-top:14px}
.wx-hd{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
/* h3 מאז תיקון הכפילות בשם: ה-margin של ה-UA חייב לרדת כדי שהרצועה
   תיראה בדיוק כמו קודם. */
.wx-t{margin:0;font-family:var(--f-ui);font-weight:600;font-size:.98rem}
.wx-tag{font-family:var(--f-ui);font-size:.72rem;font-weight:500;color:var(--ink-2);
  border:1px solid var(--line-ctl);border-radius:var(--r-xs);padding:2px 8px}
.wx-tag.is-live{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.wx-stats{display:flex;flex-wrap:wrap;gap:20px;margin:11px 0 13px}
.wx-stat b{display:block;font-family:var(--f-ui);font-weight:600;font-size:1.08rem;font-variant-numeric:tabular-nums}
.wx-stat span{font-size:.78rem;color:var(--ink-3)}
/* היום ומחר. שתי תאים רחבים מעל רמות הרגישות, כי בשטח הם התשובה
   ושלוש הרמות הן ההסבר. מופיעים רק בתוך הטיול. */
.wx-days{display:flex;gap:10px;margin:0 0 13px;flex-wrap:wrap}
.wx-day{flex:1 1 120px;display:flex;align-items:baseline;gap:8px;
  background:var(--surface-2);border-radius:var(--r-xs);padding:9px 12px}
.wx-day-l{font-family:var(--f-ui);font-size:.79rem;color:var(--ink-2)}
.wx-day-mm{font-family:var(--f-ui);font-size:1.02rem;font-variant-numeric:tabular-nums}
.wx-day-w{font-size:.78rem;color:var(--ink-2);margin-inline-start:auto}
.wx-rows{display:grid;gap:9px}
.wx-row{display:grid;grid-template-columns:minmax(9em,auto) 1fr auto;gap:12px;align-items:center}
.wx-lab b{display:block;font-family:var(--f-ui);font-weight:500;font-size:.86rem}
.wx-eg{font-size:.73rem;color:var(--ink-3)}
.wx-bar{height:7px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.wx-fill{height:100%;border-radius:99px}
.wx-pct{font-family:var(--f-ui);font-weight:600;font-size:.86rem;font-variant-numeric:tabular-nums;min-width:2.9em;text-align:end}
/* הצבע לעולם לא לבד: יש גם אחוז, גם אורך פס וגם תווית.
   --jade ולא --brand: משהחליף המותג לאדום לכה, "טוב" היה מרונדר אדום
   ונעשה כמעט זהה ל---rose של "גרוע". הירוק נשמר כאן בדיוק לשם כך —
   הוא נושא משמעות, לא זהות מותג. */
.good{color:var(--jade-ink)}   .wx-fill.good{background:var(--jade)}
.fair{color:var(--gold-ink)}   .wx-fill.fair{background:var(--gold)}
.poor{color:var(--rose)}       .wx-fill.poor{background:var(--rose)}
.wx-note{font-size:.79rem;color:var(--ink-3);margin:12px 0 0;max-width:62ch}
.feas{font-family:var(--f-ui);font-weight:600;font-size:.76rem;font-variant-numeric:tabular-nums;
  border:1px solid currentColor;border-radius:var(--r-xs);padding:1px 6px}
/* מישלין: אדום הכוכב לכוכב, ענבר ל-Bib. הטקסט נושא את המשמעות, לא הצבע. */
.sig{font-family:var(--f-ui);font-weight:600;font-size:.72rem;border-radius:var(--r-xs);padding:2px 7px;white-space:nowrap}
.sig-star{background:#8e1b2e;color:#fff}
/* הזהב אינו מתהפך בין מצבי הצבע, ולכן גם טקסט-העל לא צריך להתהפך.
   ההחרגה הייתה חלה על מצב כהה בלבד, והתג נשאר לבן על זהב — 1.62 —
   בדיוק במצב שהוא ברירת המחדל. */
.sig-bib{background:var(--gold);color:#231a06}

.quickbar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 2px}
.qbtn{
  display:inline-flex;align-items:center;gap:8px;font-family:var(--f-ui);font-weight:500;font-size:.85rem;
  background:var(--surface);border:1px solid var(--line-ctl);border-radius:var(--r-xs);padding:9px 15px;
  transition:border-color .13s,scale .12s cubic-bezier(.23,1,.32,1);
}
@media (hover:hover) and (pointer:fine){.qbtn:hover{border-color:var(--brand)}}
.qbtn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}

/* ---------- כרטיס מקום ---------- */
/* ברירת המחדל LTR כי רוב התוכן עדיין אנגלי. כרטיס שיש לו תאום עברי
   מקבל .is-he ומתהפך כולו — טקסט עברי בכרטיס LTR שובר את הפיסוק. */
.pcard.is-he,.rcard.is-he{direction:rtl;text-align:right}
.pcard,.rcard{
  direction:ltr;text-align:left;position:relative;
  background:var(--surface);border:1px solid var(--line-ctl);border-radius:var(--r-sm);
  display:flex;flex-direction:column;gap:4px;transition:border-color .15s,scale .12s cubic-bezier(.23,1,.32,1);
}
@media (hover:hover) and (pointer:fine){.pcard:hover,.rcard:hover{border-color:var(--brand)}}
.pcard{flex:0 0 240px;scroll-snap-align:start;padding:13px 14px 11px}
.rcard{padding:14px 15px 12px}
.rcard-where{direction:rtl;font-family:var(--f-ui);font-size:.76rem;color:var(--ink-3);display:flex;align-items:center;gap:6px}
html[dir="ltr"] .rcard-where{direction:ltr}
.dotc{width:8px;height:8px;border-radius:2px;background:var(--stationcolor);flex:none}
.pcard-h{margin:0;font-family:var(--f-display);font-size:1.06rem;font-weight:700;line-height:1.3}
.pcard-open{text-align:start;padding:0;display:block;width:100%}
.pcard-open::after{content:"";position:absolute;inset:0;border-radius:inherit}
.pcard-open:focus-visible{outline:none}
.pcard-open:focus-visible::after{outline:2px solid var(--brand);outline-offset:-2px}
.pcard-name{font-family:var(--f-ui);font-weight:600;font-size:.94rem;line-height:1.3}
.pcard-why{font-size:.86rem;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pcard-meta{
  display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:auto;padding-top:8px;
  font-family:var(--f-ui);font-size:.79rem;color:var(--ink-2);position:relative;z-index:2;
}
.stars{color:var(--gold-ink);letter-spacing:.05em;font-size:.76rem}
.money{font-weight:600;font-variant-numeric:tabular-nums}
.money.is-free{color:var(--brand)}
.warn{color:var(--rose);font-weight:500}
.fav{
  margin-inline-start:auto;width:30px;height:30px;border-radius:var(--r-xs);
  color:var(--ink-3);display:flex;align-items:center;justify-content:center;flex:none;
  transition:background .13s,color .13s,scale .12s cubic-bezier(.23,1,.32,1);
}
@media (hover:hover) and (pointer:fine){.fav:hover{background:var(--surface-2);color:var(--rose)}}
.fav[aria-pressed="true"]{color:var(--rose)}
.fav[aria-pressed="true"] svg{fill:currentColor}

.reslist{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin-top:12px}
.results-head{font-family:var(--f-ui);font-weight:500;color:var(--ink-2);margin:20px 0 0}
mark{background:var(--brand-soft);color:inherit;border-radius:3px;padding:0 2px;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px;text-decoration-color:var(--brand)}

/* ---------- אריחי נושא ---------- */
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:11px;margin-top:12px}
.topic{
  background:var(--surface);border:1px solid var(--line-ctl);border-radius:var(--r-sm);padding:15px;
  text-align:start;display:flex;flex-direction:column;gap:2px;transition:border-color .15s,scale .12s cubic-bezier(.23,1,.32,1);
}
@media (hover:hover) and (pointer:fine){.topic:hover:not(:disabled){border-color:var(--brand)}}
.topic svg{color:var(--ink-3);margin-bottom:5px}
.topic-n{font-family:var(--f-ui);font-weight:600;font-size:1.3rem;font-variant-numeric:tabular-nums}
.topic-l{font-family:var(--f-ui);font-size:.85rem;color:var(--ink-2)}
.topic:disabled{opacity:.5;cursor:default}

/* ---------- מסך מידע ---------- */
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:12px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 15px}
.fact-l{font-family:var(--f-ui);font-size:.78rem;color:var(--ink-3);margin-bottom:2px}
.fact-v{font-family:var(--f-ui);font-weight:600;font-size:1.12rem;font-variant-numeric:tabular-nums;line-height:1.3}
.fact-s{font-size:.8rem;color:var(--ink-3);margin-top:2px}
.fxline{font-family:var(--f-ui);font-weight:600;font-size:1rem;font-variant-numeric:tabular-nums;direction:ltr;text-align:start}
.notecard{
  background:var(--surface-2);border-radius:var(--r-sm);padding:13px 15px;margin-top:22px;
  font-size:.87rem;color:var(--ink-2);
}
.notecard b{display:block;font-family:var(--f-ui);color:var(--ink);margin-bottom:3px;font-weight:600}
.creditlist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:5px;font-size:.81rem}
.creditlist li{display:flex;flex-wrap:wrap;gap:4px 9px;align-items:baseline;
  padding-block-end:5px;border-block-end:1px solid var(--line-soft)}
.creditlist li:last-child{border-block-end:none}
.cr-st{font-family:var(--f-ui);font-weight:600;color:var(--ink);min-width:9em}
.creditlist a{text-decoration:underline;text-underline-offset:2px;color:var(--ink-2)}
.cr-by{color:var(--ink-3);margin-inline-start:auto}

/* ---------- חלון פרטים ---------- */
dialog{border:none;padding:0;background:transparent;max-width:min(560px,94vw);width:100%;color:var(--ink)}
dialog::backdrop{background:rgba(10,13,17,.52)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);overflow:hidden}
.sheet-hd{padding:18px 20px 0;display:flex;gap:12px;align-items:flex-start}
/* כיוון D: שמות מקומות נושאים את סריף התצוגה, כמו שמות התחנות.
   הם הזהות של הכרטיס, לא תווית ממשק. */
.sheet-ttl{font-family:var(--f-display);font-weight:700;font-size:1.2rem;line-height:1.26;margin:0}
.ttl-he{display:block}
/* הלטיני משני בגודל בלבד, לא בניגודיות — הוא מה שמראים לנהג.
   width:fit-content מצמיד את התיבה לקצה ההתחלה של ההורה ה-RTL,
   בזמן ש-direction:ltr (מ-.en) מסדר רק את התווים בתוכה. בלעדיו

  letter-spacing:.01em;overflow-wrap:anywhere}

.sheet-acts{margin-inline-start:auto;display:flex;gap:8px;flex:none}
.closebtn,.ttl-copy{width:34px;height:34px;border-radius:var(--r-xs);border:1px solid var(--line-ctl);

@media (hover:hover) and (pointer:fine){.closebtn:hover,.ttl-copy:hover{background:var(--surface-2);color:var(--ink)}}
.sheet-bd{padding:13px 20px 20px;display:flex;flex-direction:column;gap:13px}
.sheet-what{color:var(--ink-2)}
.whybox{background:var(--brand-soft);border-radius:var(--r-sm);padding:12px 14px}
.whybox b{display:block;font-family:var(--f-ui);font-size:.77rem;font-weight:600;color:var(--brand);margin-bottom:2px}
.factrow{display:flex;flex-wrap:wrap;gap:9px;font-family:var(--f-ui);font-size:.85rem;color:var(--ink-2);align-items:center}
/* שעות פתיחה. אין p{margin:0} גלובלי בקובץ והאיפוס הוא לפי מחלקה, כמו
   ב-.tr-lbl; .sheet-bd הוא flex container ולכן שוליים אינם מתמוטטים,
   ובלי האיפוס ה-<p> מקבל את שולי ה-UA בנוסף ל-gap. */
.sheet-hours{margin:0;display:flex;align-items:flex-start;gap:6px;
  font-family:var(--f-ui);font-size:.85rem;color:var(--ink-2)}
/* flex-start ולא center: "17:00-23:00, שבת-חמישי" נשבר לשתי שורות בעמודה
   צרה, ו-center היה ממרכז את השעון מול הרווח שביניהן. baseline לא מתאים,
   כי קו הבסיס של svg הוא קצהו התחתון והאייקון היה יורד מתחת לשורה. */
.sheet-hours .ic{margin-block-start:.18em}
.hours-v{font-variant-numeric:tabular-nums}
/* ל-bdi יש unicode-bidi:isolate מה-UA; ההצהרה כאן מגנה מפני reset עתידי
   שיאפס אותו, כי היפוך טווח הוא כשל שקט שאי אפשר לראות בלי למדוד. */
.hours-v bdi,.money bdi{unicode-bidi:isolate}
.map-attr{margin:14px 10px 4px;font-size:.72rem;color:var(--ink-3)}
.map-attr a{text-decoration:underline;text-underline-offset:2px}
.linkrow{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.linkrow>li{display:contents}
/* ---------- תקן צבעי הקישורים ----------
   מתועד ב-PROJECT.md וב-build.py: הצבע מקודד את הפעולה, לא את הקטגוריה.
   כחול=מפות · ירוק=נסיעה/גראב · סגול=וואטסאפ · אדום=יוטיוב.
   הצבע לעולם לא לבד — לכל כפתור יש גם אייקון וגם מילה. */
.lbtn{
  display:inline-flex;align-items:center;gap:7px;font-family:var(--f-ui);font-weight:500;font-size:.85rem;
  border-radius:var(--r-xs);padding:9px 14px;border:1px solid currentColor;
  color:var(--ink-2);transition:background .13s,scale .12s cubic-bezier(.23,1,.32,1);
}
@media (hover:hover) and (pointer:fine){.lbtn:hover{background:var(--tint,var(--surface-2))}}
.act-map  {color:var(--c-map);  --tint:var(--c-map-soft)}
.act-ride {color:var(--c-ride); --tint:var(--c-ride-soft)}
.act-video{color:var(--c-video);--tint:var(--c-video-soft)}
.act-chat {color:var(--c-chat); --tint:var(--c-chat-soft)}
.act-book {color:var(--c-book); --tint:var(--c-book-soft)}
/* הפעולה הניטרלית. היה כאן .act-src שמעולם לא נקרא — התקן תכנן
   משבצת לפעולה שאין לה יעד מחמשת הצבעים, והיא פשוט לא מומשה.
   בלי opacity ובלי הבהרה: אלה מה שהופך ניטרל ל"מושבת" לעין, לא
   היעדר הגוון. */
.act-neutral{color:var(--ink-2); --tint:var(--surface-2)}
.lbtn.is-primary{background:var(--c-map-fill);color:var(--c-map-on);border-color:var(--c-map-fill)}
@media (hover:hover) and (pointer:fine){.lbtn.is-primary:hover{background:var(--c-map);filter:brightness(1.12)}}
/* פתק ההדבקה של Grab. לא כפתור — אין בו פעולה. זו הוראה שצריכה לשרוד
   את המעבר לאפליקציה ולהיות על המסך כשחוזרים ממנה, ולכן היא נשארת
   ב-DOM ולא נעלמת. הוא יושב כאח של .linkrow ולא בתוכה — קודם הוא היה
   li עם עקיפת display:contents, וזה גם דחס אותו כפריט גמיש לצד
   הכפתורים וגם ספר אותו כפעולה שישית בקורא מסך. */
/* הטקסט ב---ink ולא ב---c-ride: הירוק על הרקע המוטל ירוק נמדד 4.52,
   כלומר עובר את 4.5 בשתי מאיות — בדיוק סוג המעבר-בשערה שכבר נתפס
   כאן פעם. המסגרת והגוון נושאים את זיהוי הפעולה; הטקסט נושא קריאוּת. */
.grab-note{
  margin-top:9px;
  font-family:var(--f-ui);font-size:.8rem;line-height:1.45;color:var(--ink);
  background:var(--c-ride-soft);border:1px solid var(--c-ride);
  border-radius:var(--r-xs);padding:8px 11px;
}
/* הכתובת היא הגיבוי האמיתי: אם ההעתקה נכשלה היא עדיין על המסך,
   ו-user-select:all הופך נגיעה אחת לסימון של כולה. dir=ltr כי
   הכתובת לטינית ובתוך פתק עברי ה-bidi היה מזיז את הפסיקים. */
.grab-addr{direction:ltr;text-align:start;unicode-bidi:isolate;font-weight:600;
  user-select:all;-webkit-user-select:all;word-break:break-word}
.grab-stat{margin-top:4px;font-weight:500}
/* 4.66 במצב כהה, לא מרווח נוח. כל הכהייה של --rose או כל העלאה של
   האלפא ב---c-ride-soft מעל .14 מפילה את זה מתחת ל-4.5. */
.grab-stat.is-warn{color:var(--rose)}
/* תצלום רשומה והייחוס שלו. --ink-3 ולא --ink-3-card: הקרדיט יושב על
   --surface הלבן, ושם --ink-3 נמדד 7.56 — בנוחות מעל 4.5 גם ב-.72rem. */
.poi-fig{margin:0;display:flex;flex-direction:column;gap:5px}
.poi-shot{width:100%;height:auto;border-radius:var(--r-xs);
  border:1px solid var(--line);display:block}
.poi-cred{font-family:var(--f-ui);font-size:.72rem;color:var(--ink-3)}
.poi-cred a{text-decoration:underline;text-underline-offset:2px;color:var(--ink-3)}
/* קופסת המנה. גוון רקע כדי שתיקרא כגוש אחד — היא נתון על המאכל ולא
   על המקום, והיא משותפת לכמה רשומות. */
.dishbox{background:var(--surface-2);border-radius:var(--r-xs);
  padding:11px 12px;display:flex;flex-direction:column;gap:7px}
.dish-hd{margin:0;font-family:var(--f-ui);font-size:.82rem;color:var(--ink-2)}
.dish-vi{direction:ltr;unicode-bidi:isolate;font-weight:600}
.dish-txt{margin:0;font-size:.88rem;color:var(--ink-2);line-height:1.5}
/* הקרדיט בתוך הקופסה יושב על --surface-2, ושם --ink-3 אינו מספיק. */
.dishbox .poi-cred,.dishbox .poi-cred a{color:var(--ink-2)}
.srcline{font-size:.8rem;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.srcline a{text-decoration:underline;text-underline-offset:3px}

/* ---------- מעברים (פאזה 9) ----------
   שפת האתר הקיימת: כרטיסים לבנים על לבנדר, אותם טוקנים, אותו תקן קישורים.
   הדבר החדש היחיד הוא "הכרטיסייה" בראש התוצאה — שתי נקודות בצבעי התחנות
   וקו מקווקו ביניהן, כמו כרטיס נסיעה. אותם צבעי תחנה שמופיעים בכל המדריך. */
.tr-intro{color:var(--ink-2);max-width:62ch;margin:0 0 16px}
.tr-err,.tr-ferr{color:var(--rose);font-weight:500;margin:0 0 12px}
.tr-ferr{margin:0}
.tr-form{background:var(--surface);border:1px solid var(--line-ctl);border-radius:var(--r);
  padding:16px;display:flex;flex-direction:column;gap:12px;max-width:560px}
.tr-field{display:flex;flex-direction:column;gap:5px}
.tr-flabel{font-family:var(--f-ui);font-weight:600;font-size:.9rem;color:var(--ink)}
/* 16px לפחות: מתחת לזה Safari ב-iOS מגדיל את הדף בפוקוס ולא חוזר */
.tr-select{font:inherit;font-size:1rem;min-height:46px;padding:8px 12px;color:var(--ink);
  background:var(--surface);border:1px solid var(--line-ctl);border-radius:var(--r-xs);width:100%}
.tr-select[aria-invalid="true"]{border-color:var(--rose);border-width:2px}
.tr-swap{align-self:center;display:inline-flex;align-items:center;gap:7px;min-height:44px;
  font-family:var(--f-ui);font-size:.85rem;font-weight:500;color:var(--ink-2);
  border:1px solid var(--line-ctl);border-radius:999px;padding:6px 16px;background:var(--surface)}
@media (hover:hover) and (pointer:fine){.tr-swap:hover{border-color:var(--brand);color:var(--ink)}}
.tr-go{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;
  font-family:var(--f-ui);font-size:1rem;font-weight:600;border-radius:var(--r-xs);
  background:var(--primary-fill);color:var(--primary-on)}
@media (hover:hover) and (pointer:fine){.tr-go:hover{filter:brightness(1.12)}}
.tr-h2{font-family:var(--f-display);font-weight:700;font-size:1.15rem;margin:30px 0 10px}
.tr-links{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.tr-link{display:flex;align-items:center;gap:9px;min-height:46px;padding:10px 13px;
  background:var(--surface);border:1px solid var(--line-ctl);border-radius:var(--r-xs);
  font-family:var(--f-ui);font-weight:500;transition:border-color .13s,scale .12s cubic-bezier(.23,1,.32,1)}
@media (hover:hover) and (pointer:fine){.tr-link:hover{border-color:var(--brand)}}
.tr-link .dotc:last-child{margin-inline-start:auto}

.tr-ticket{display:flex;align-items:center;gap:10px;margin:-6px 0 16px;padding:12px 16px;
  background:var(--surface);border:1px solid var(--line-ctl);border-radius:var(--r);
  font-family:var(--f-ui);font-weight:600;font-size:.95rem}
.tr-ticket-st{display:inline-flex;align-items:center;gap:8px;flex:none}
.tr-ticket-dot{width:13px;height:13px;border-radius:50%;background:var(--stationcolor);
  box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--stationcolor)}
.tr-ticket-line{flex:1;min-width:24px;border-top:2px dashed var(--line-ctl)}
.tr-note{color:var(--ink-2);max-width:68ch;margin:0 0 10px}
.tr-rev{background:var(--brand-soft);border-radius:var(--r-sm);padding:10px 14px;margin:0 0 12px;color:var(--ink);font-size:.9rem}
.tr-summary{font-family:var(--f-ui);font-size:.9rem;color:var(--ink-3);margin:6px 0 10px}

.tr-sort{border:none;margin:0 0 14px;padding:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tr-sort legend{float:inline-start;font-family:var(--f-ui);font-size:.85rem;font-weight:600;color:var(--ink-2);margin-inline-end:6px;padding:0}
.tr-sort-opt{display:inline-flex;align-items:center;min-height:40px;padding:6px 14px;cursor:pointer;
  font-family:var(--f-ui);font-size:.85rem;font-weight:500;color:var(--ink-2);
  border:1px solid var(--line-ctl);border-radius:999px;background:var(--surface)}
.tr-sort-opt:has(input:checked){background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.tr-sort-opt:has(:focus-visible){outline:2px solid var(--brand);outline-offset:2px}
/* מוסתר בטכניקת sr ולא display:none — אחרת הרדיו יוצא מהמקלדת ומקורא המסך */
.sr-input{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);border:0;opacity:0}

.tr-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.tr-card{background:var(--surface);border:1px solid var(--line-ctl);border-radius:var(--r-sm);
  padding:15px 16px 13px;display:flex;flex-direction:column;gap:10px;height:100%}
.tr-card-h{display:flex;align-items:center;flex-wrap:wrap;gap:4px 9px;margin:0;
  font-family:var(--f-display);font-size:1.06rem;font-weight:700;line-height:1.3}
.tr-mode{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand);
  display:inline-flex;align-items:center;justify-content:center;flex:none}
.tr-mode svg{width:19px;height:19px}
.tr-op{font-weight:600}
.tr-verify{display:inline-flex;align-items:center;gap:6px;width:fit-content;margin:0;
  font-family:var(--f-ui);font-size:.8rem;font-weight:600;color:var(--gold-ink);
  border:1px solid var(--gold-ink);border-radius:999px;padding:3px 10px}
.tr-verify svg{width:15px;height:15px}
.tr-board{background:var(--surface-2);border-radius:var(--r-xs);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.tr-lbl{margin:0;font-family:var(--f-ui);font-size:.76rem;font-weight:600;letter-spacing:.02em;color:var(--ink-3)}
.tr-bname,.tr-pickup{margin:0;font-weight:600}
.tr-addr{margin:0;font-size:.86rem;color:var(--ink-2);text-align:start;width:fit-content;max-width:100%;
  overflow-wrap:anywhere;user-select:all;-webkit-user-select:all}
.tr-addr.is-soft{user-select:text;-webkit-user-select:text}
.tr-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px 12px;margin:0}
.tr-facts dt{font-family:var(--f-ui);font-size:.74rem;font-weight:600;color:var(--ink-3-card)}
.tr-facts dd{margin:0;font-family:var(--f-ui);font-size:.9rem;font-weight:600;color:var(--ink)}
.tr-facts .is-wide{grid-column:1/-1}
.tr-facts .is-wide dd{font-weight:500}
.tr-facts .is-wide dd .en{display:block;width:fit-content;max-width:100%}
.tr-points{margin:0;padding-inline-start:18px;font-size:.88rem;color:var(--ink-2);display:flex;flex-direction:column;gap:2px}
/* העוטף שומר על אותו מרווח שהיה בין התווית לטקסט כששניהם היו אחים
   ישירים ב-.tr-card (gap:10px). */
.tr-tipwrap{display:flex;flex-direction:column;gap:10px}
.tr-tip{margin:0;font-size:.88rem;color:var(--ink-2)}
.tr-card .linkrow{margin-top:2px}
.tr-card .srcline{margin-top:auto;padding-top:6px;border-top:1px solid var(--line-soft)}
.tr-after{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.tr-revlink svg{transform:none!important}
.tr-empty{background:var(--surface);border:1px solid var(--line-ctl);border-radius:var(--r);padding:16px;
  display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.tr-empty p{margin:0;color:var(--ink-2)}
.tr-empty .tr-empty-t{font-weight:600;color:var(--ink)}
@media (forced-colors:active){
  .tr-ticket-dot{forced-color-adjust:none}
  .tr-sort-opt:has(input:checked){outline:2px solid CanvasText}
}

/* ---------- דיאלוג ההגדרות ---------- */
/* בדסקטופ הפקדים נשארים בשורה העליונה והכפתור מיותר. */
#settingsBtn{display:none}
#setDlg{max-width:min(420px,94vw)}
#setDlg::backdrop{background:rgba(10,13,17,.52)}
.set-hd{display:flex;align-items:center;gap:12px;
  background:var(--surface);border:1px solid var(--line);border-bottom:none;
  border-radius:var(--r) var(--r) 0 0;padding:16px 18px 12px}
.set-ttl{font-family:var(--f-display);font-weight:700;font-size:1.15rem;margin:0;flex:1}
.set-body{background:var(--surface);border:1px solid var(--line);border-top:none;
  border-radius:0 0 var(--r) var(--r);padding:4px 18px 20px;
  display:flex;flex-direction:column;gap:16px}
/* בתוך הדיאלוג לפקדים יש רוחב מלא — שם אין תחרות על מקום */
.set-body .tb-tools{margin-inline-start:0;flex-direction:column;align-items:stretch;gap:12px}
.set-body .seg{width:100%}
.set-body .seg button{flex:1;text-align:center;padding:11px 10px;min-height:44px}
.set-body #themeBtn{width:100%;min-height:44px;gap:9px}
.set-row-lbl{font-family:var(--f-ui);font-size:.78rem;font-weight:600;color:var(--ink-3);
  margin:0 0 -8px}

@media (max-width:880px){
  /* בנייד זהו השער היחיד לשפה, למטבע ולנושא — והחלפת שפה היא פקד
     נגישות (היא קובעת את lang של המסמך ולכן את קול הקורא). 44×44
     במקום 33×33, והריפוד של השורה מתכווץ כדי לשמור על ≤120px. */
  #settingsBtn{display:inline-flex;width:44px;height:44px}
  .tb-row.r1{padding-top:6px;padding-bottom:6px}
  /* מוסתרים בשורה, אך אותם צמתים עצמם — לא עותק. */
  .topbar .tb-tools{display:none}
  .set-body .tb-tools{display:flex}
}

/* במצב ניגודיות גבוהה של Windows גם box-shadow וגם background
   מבוטלים — כלומר הסימן שאינו-צבע היה נעלם דווקא במצב שנועד לעזור.
   Highlight הוא צבע מערכת ולכן שורד. */
@media (forced-colors:active){
  .tab[aria-current="page"]{border-block-end:3px solid Highlight}
  .bnav[aria-current="page"]::before{background:Highlight;forced-color-adjust:none}
  /* הסימן היחיד ל-aria-pressed במתגי השפה, המטבע והמיון הוא רקע וצבע
     טקסט, ושניהם נדרסים לצבעי מערכת — הכפתור הנבחר נעשה זהה ללא-נבחר.
     ב-High Contrast שלושת כפתורי המטבע נראו אותו דבר, ואי אפשר היה לדעת
     באיזה מטבע המחירים מוצגים. אותו טיפול שכבר קיים ל-.tab ול-.bnav
     ממש למעלה, ול-.tr-sort-opt. */
  .seg button[aria-pressed="true"]{outline:2px solid Highlight;outline-offset:-3px;
    forced-color-adjust:none}
}

/* ---------- מצב "לפי מרחק" ---------- */
.seg-sort{align-self:stretch;margin:0 10px}
.seg-sort button{flex:1;text-align:center;padding:9px 11px;font-size:.84rem}

/* אזור ה-live הוא גם הטקסט הגלוי. שני מקורות אמת נפרדים היו
   מסתדרים זה מזה ומכריזים כפול. */
.near-status{margin:8px 10px 0;font-size:.82rem;color:var(--ink-3);min-height:1em}
.near-status:empty{margin-top:0}
.near-body{display:flex;flex-direction:column;gap:12px;padding:10px 10px 4px;min-height:0;overflow-y:auto}
.near-head{font-family:var(--f-display);font-weight:700;font-size:1.05rem;margin:0}
.near-hint{margin:0;font-size:.79rem;color:var(--ink-3);line-height:1.5}
.near-wait{margin:0;font-size:.95rem;color:var(--ink-2)}
/* המצב הזה הוא מידע ולא כשל — בלי אדום ובלי אייקון שגיאה.
   עד היציאה ב-26/10 זהו המצב הנפוץ ביותר של המסך. */
.near-far{margin:0;font-size:.92rem;color:var(--ink-2);line-height:1.55}
.near-err{margin:0;font-size:.9rem;color:var(--ink);line-height:1.55}
.near-how{margin:0;font-size:.8rem;color:var(--ink-2);line-height:1.6;
  background:var(--surface-2);border-radius:var(--r-xs);padding:10px 12px}
.btn-near{
  font-family:var(--f-ui);font-weight:600;font-size:.9rem;
  background:var(--brand);color:var(--brand-ink);border-radius:var(--r-sm);
  padding:12px 16px;text-align:center;min-height:44px;
}
@media (hover:hover) and (pointer:fine){.btn-near:hover{filter:brightness(1.08)}}
.near-pick{display:flex;flex-direction:column;gap:7px;
  border-top:1px solid var(--line-soft);padding-top:12px}
.near-pick-t{margin:0;font-size:.83rem;color:var(--ink-2)}
.near-sel{

/* break-word ולא anywhere: anywhere שבר את "באוק׳" לפני הגרש. */
.mt-count{min-height:9.25rem;margin-bottom:4px}
.mt-countrow{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 12px}
.mt-side{min-width:0}
.mt-big{font-weight:100;font-size:clamp(4.6rem,25vw,7rem);line-height:.8;font-variant-numeric:tabular-nums}
.mt-side{display:flex;flex-direction:column;align-items:flex-end;font-size:.92rem;font-weight:300;text-align:end}
.mt-fx{display:flex;gap:.9em;flex-wrap:wrap;font-size:clamp(1.2rem,5.6vw,1.6rem)}
.mt-fx bdi{direction:ltr;unicode-bidi:isolate}
.mt-link{text-decoration:none;min-height:5.75rem;justify-content:space-between}
.mt-link .ic{width:22px;height:22px}
.mt-linkt{display:flex;flex-direction:column;font-weight:500;font-size:.98rem;line-height:1.3}
.mt-dom{font-weight:400;font-size:.78rem;opacity:.9}
@media (hover:hover) and (pointer:fine){.mt-link:hover .mt-linkt{text-decoration:underline;text-underline-offset:3px}}
a.mt:focus-visible,.mt :focus-visible{outline:3px solid var(--ink);outline-offset:2px}
/* 320px עם הגדלת טקסט: ארבע עמודות נעשות שתיים, ואריח s2 נמתח לכל הרוחב. */
@media (max-width:24rem){
  .mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mt-s2{grid-column:1 / -1}
}

/* ---------- כותרות מקטע ---------- */
.sec-label{font-family:var(--f-display);font-size:1.85rem;font-weight:300;letter-spacing:0;
  color:var(--ink);margin:26px 0 10px;gap:12px;align-items:baseline}
.sec-label .ln{display:none}
.sec-label .cnt{background:none;color:var(--ink-3);font-family:var(--f-ui);font-size:.86rem;font-weight:500;padding:0}
.region{margin-top:22px}
.region-hd{position:static;margin:0 0 8px;padding:0;background:none;color:var(--ink);
  font-family:var(--f-display);font-weight:300;font-size:1.85rem;letter-spacing:0;align-items:baseline}
.region-hd .cnt{background:none;color:var(--ink-3);border-radius:0;padding:0;font-family:var(--f-ui);font-size:.84rem;font-weight:500;white-space:normal}
.region-hd,.sec-label{flex-wrap:wrap}

/* ---------- אריחי תחנה (מצב תכנון) ---------- */
.tilegrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.tilegrid>li:nth-child(4n+3) .tile,.tilegrid>li:nth-child(4n+4) .tile{background:var(--tile-pale)}
.tile{background:var(--tile);border:0;border-radius:0;box-shadow:none;min-height:8.5rem;padding:10px 12px;justify-content:space-between}
@media (hover:hover) and (pointer:fine){.tile:hover{border:0;outline:2px solid var(--ink);outline-offset:-2px}}
.tile:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.tile-ph{position:static;aspect-ratio:auto;background:none}
.tile-ph img{display:none}
.tile-idx{position:static;min-width:0;min-height:0;padding:0;border-radius:0;background:none;
  color:var(--ink);font-family:var(--f-display);font-weight:100;font-size:clamp(2.4rem,11vw,3rem);line-height:.85}
.tile-txt{padding:0}
.tile-nm{font-family:var(--f-display);font-weight:300;font-size:1.3rem;line-height:1.1;color:var(--ink)}
.tile-cnt{font-family:var(--f-ui);font-size:.8rem;font-weight:500;color:var(--ink-2)}

/* ---------- קרוב אליך בבית ---------- */
.home-near .btn-near{border-radius:0;background:var(--tile-dark);color:var(--on-tile-dark);border:0;min-height:48px;font-weight:500}
.home-near .near-list{display:grid;gap:6px}
.home-near .near-row{background:var(--tile-pale);border:0;border-radius:0;padding:10px 12px;align-items:center}
.home-near [role="listitem"]:first-child .near-row{background:var(--tile)}
.home-near .near-dist{font-weight:300;font-size:1.6rem;color:var(--ink)}
.home-near .near-name{font-weight:400;font-size:1.05rem}
/* בחירת תחנה: רשימה גלויה מצפון לדרום, אריח לכל תחנה. */
.near-reg{margin:10px 0 4px;font-family:var(--f-ui);font-size:.82rem;font-weight:600;color:var(--ink-3)}
.near-stlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;list-style:none;margin:0;padding:0}
.near-st{display:flex;align-items:baseline;gap:8px;width:100%;min-height:48px;padding:8px 10px;text-align:start;
  background:var(--tile-pale);color:var(--ink);border:0;border-radius:0}
@media (hover:hover) and (pointer:fine){.near-st:hover{background:var(--surface-2)}}
.near-st[aria-pressed="true"]{background:var(--tile-dark);color:var(--on-tile-dark)}
.near-st:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.near-st-n{font-family:var(--f-display);font-weight:300;font-size:1.25rem;line-height:1;font-variant-numeric:tabular-nums}
.near-st-nm{font-weight:500;font-size:.95rem;line-height:1.25;overflow-wrap:anywhere}
@media (forced-colors:active){.near-st{border:1px solid CanvasText}.near-st[aria-pressed="true"]{outline:3px solid Highlight}}

/* ---------- מסך תחנה ---------- */
.backbtn{border:0;background:none;border-radius:0;padding:6px 0;color:var(--ink-2);font-weight:500}
@media (hover:hover) and (pointer:fine){.backbtn:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}}
/* הגיבור: התצלום נשאר, הטקסט יורד ממנו לקרקע. כך הכותרת הדקה והענקית
   יושבת על לבן ולא על שכבת הצללה, וטבעת הפוקוס הכפולה מתייתרת. */
.hero{border:0;border-radius:0}
.hero-txt{position:static;padding:12px 0 0;color:var(--ink);background:none}
.hero-name{font-weight:200;font-size:clamp(2.6rem,13vw,4.4rem);line-height:.98;text-shadow:none;letter-spacing:-.02em}
.hero-name:focus-visible{outline:3px solid var(--ink);outline-offset:4px;box-shadow:none;border-radius:0}
.hero-sub{color:var(--ink-3);opacity:1;font-weight:300;font-size:1rem}
/* מזג האוויר: אריח לילך. הבר עצמו נשאר צבוע לפי הרצועה, בלי עיגול. */
.wx{background:var(--tile-pale);border:0;border-radius:0}
.wx-bar{border-radius:0;background:var(--bg)}
.wx-fill{border-radius:0}
.wx-tag{border-radius:0}
/* פעולות: אריחים מלאים בצבעי התקן, תמיד אייקון ומילה. טקסט בצבע התקן
   על אריח לילך נכשל (ירוק Grab: 4.40), ולכן הצבע עבר למילוי והטקסט
   לבן: 5.18 ומעלה בבהיר, ובכהה הטקסט כהה: 6.92 ומעלה. */
:root{--act-on:#ffffff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--act-on:#12101a}}
:root[data-theme="dark"]{--act-on:#12101a}
.act-map  {--act-fill:var(--c-map)}
.act-ride {--act-fill:var(--c-ride)}
.act-video{--act-fill:var(--c-video)}
.act-chat {--act-fill:var(--c-chat)}
.act-book {--act-fill:var(--c-book)}
.act-neutral{--act-fill:var(--tile-dark)}
.lbtn,.qbtn{border-radius:0;border:0;min-height:48px;padding:10px 14px;font-weight:500}
.lbtn[class*="act-"],.qbtn[class*="act-"]{background:var(--act-fill);color:var(--act-on)}
.lbtn.act-neutral,.qbtn.act-neutral{color:var(--on-tile-dark)}
@media (hover:hover) and (pointer:fine){.lbtn[class*="act-"]:hover,.qbtn[class*="act-"]:hover{background:var(--act-fill);text-decoration:underline;text-underline-offset:3px}}
.qbtn-int{background:var(--tile-dark);color:var(--on-tile-dark)}
@media (hover:hover) and (pointer:fine){.qbtn-int:hover{text-decoration:underline;text-underline-offset:3px}}
.lbtn:focus-visible,.qbtn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.quickbar{gap:6px}
.quickbar .qbtn{flex:1 1 9.5rem}
/* לשוניות קטגוריה: אריחים; הפעילה בחציל. */
.cat-tab{border-radius:0;border:0;background:var(--tile-pale);color:var(--ink);min-height:44px}
@media (hover:hover) and (pointer:fine){.cat-tab:hover{background:var(--surface-2);color:var(--ink)}}
.cat-tab[aria-selected="true"]{background:var(--tile-dark);color:var(--on-tile-dark)}
/* רשומות: אריחים שטוחים, לסירוגין פסטל ולילך. */
.pcard,.rcard{border:0;border-radius:0;background:var(--tile-pale)}
.cat-panel>.rcard:nth-child(odd),.reslist>.rcard:nth-child(odd){background:var(--tile)}
@media (hover:hover) and (pointer:fine){.pcard:hover,.rcard:hover{border:0;outline:2px solid var(--ink);outline-offset:-2px}}
.pcard-open::after{border-radius:0}
.pcard-open:focus-visible::after{outline:3px solid var(--ink);outline-offset:-3px}
.pcard-name{font-family:var(--f-display);font-weight:300;font-size:1.32rem;line-height:1.2}
.pcard-why{color:var(--ink-2)}
.fav{border-radius:0;width:44px;height:44px}
@media (hover:hover) and (pointer:fine){.fav:hover{background:var(--bg)}}
.dotc{border-radius:0}
.cat-panel{display:grid;gap:6px}
/* סימן מצב בתא קבוע לפני האחוז: מלא = מתאים, חצי = בינוני, חלול = לא
   מתאים. הצורה נושאת את המידע ולא הצבע; האחוז והמילה נשארים ב-aria. */
.feas{border-radius:0;display:inline-flex;align-items:center;gap:6px}
.feas::before{content:"";width:.7em;height:.7em;border:2px solid currentColor;flex:none}
.feas.good::before{background:currentColor}
.feas.fair::before{background:linear-gradient(to top,currentColor 50%,transparent 50%)}
.sig{border-radius:0}

/* ---------- גיליון נייד, פס הטיול ושורת הקישורים (דסקטופ) ---------- */
/* הגיליון היה --surface, שהוא עכשיו לילך: כל אריח לילך בתוכו נבלע. */
.mob-sheet{background:var(--bg);border-radius:0}
.tripbar{background:var(--bg);border-top:1px solid var(--line)}
.tb-count b{color:var(--ink);font-weight:300;font-size:1.25rem}
.official{background:var(--bg);border-top:0}
.oflink{border-radius:0;border:0;background:var(--tile-dark);color:var(--on-tile-dark);min-height:44px}
.oflink svg{color:currentColor}
@media (hover:hover) and (pointer:fine){.oflink:hover{color:var(--on-tile-dark);text-decoration:underline;text-underline-offset:3px}}
.rail-tab{border-radius:0}
.rail-tab[aria-selected="true"]{background:var(--tile-dark);color:var(--on-tile-dark);box-shadow:none}
.rail-item{border-radius:0}
.rail-item[aria-current="page"]{background:var(--tile-pale);box-shadow:none}

/* ---------- ניגודיות מוגברת וצבעים כפויים ---------- */
/* ---------- מסגרת כהה וצבעי טקסט בתוך אריח (11/10, בקשת אסף) ---------- */
.mt,.tile,.pcard,.rcard,.near-st,.home-near .near-row,.wx,.cat-tab{
  border:var(--edge) solid var(--tile-edge);
  --ink-3:var(--ink-3-tile);--ink-3-card:var(--ink-3-tile);
  --jade-ink:var(--jade-tile);--gold-ink:var(--gold-tile);--rose:var(--rose-tile)}
@media (hover:hover) and (pointer:fine){.pcard:hover,.rcard:hover,.tile:hover,.near-st:hover{border:var(--edge) solid var(--tile-edge);outline:2px solid var(--tile-edge);outline-offset:0}}
/* במצב צבעים כפוי הרקע נעלם, והאריח היה מאבד את גבולו. */
@media (forced-colors:active){
  .mt,.tile,.pcard,.rcard,.cat-tab{border:1px solid CanvasText}
  .cat-tab[aria-selected="true"]{outline:3px solid Highlight}
}

/* ---------- פירוט מקום (10-02) ---------- */
/* הגיליון הוא קרקע לבנה ולא לילך: האריחים בתוכו הם הצבע. */
.sheet{background:var(--bg);border:var(--edge) solid var(--tile-edge);border-radius:0}
.sheet-hd{padding:16px 18px 0}
.sheet-ttl{font-weight:200;font-size:clamp(2rem,9vw,2.75rem);line-height:1.02;letter-spacing:-.015em}
.ttl-en{font-family:var(--f-ui);font-weight:300;font-size:1rem;color:var(--ink-3);margin-top:6px}
.sheet-where{color:var(--ink-3)}
.closebtn,.ttl-copy{width:44px;height:44px;border-radius:0;border:var(--edge) solid var(--tile-edge);background:var(--bg)}
@media (hover:hover) and (pointer:fine){.closebtn:hover,.ttl-copy:hover{background:var(--tile-pale)}}
.sheet-bd{padding:12px 18px 18px;gap:10px}
.sheet-what{font-size:1.02rem;font-weight:300;line-height:1.65;color:var(--ink-2)}
.poi-shot{border-radius:0}
/* רשת העובדות: שני טורים, אריח לכל עובדה. */
.dfacts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;list-style:none;margin:0;padding:0}
.dfacts .mt{min-height:4.75rem}
.mt-v-sm{font-size:1.25rem;font-weight:300;line-height:1.25}
.mt-v-sm .stars{font-size:1.05rem;letter-spacing:.06em}
.mt-note{font-family:var(--f-ui);font-size:.76rem;font-weight:400;color:var(--ink-3)}
.dfacts .feas{font-size:1.25rem;font-weight:300;border:0;padding:0}
@media (max-width:22rem){.dfacts{grid-template-columns:1fr}}
/* למה כאן: אריח פסטל ממוסגר (בלי פס צד). */
.whybox{background:var(--tile);border:var(--edge) solid var(--tile-edge);border-radius:0;padding:12px 14px;
  --ink-3:var(--ink-3-tile)}
.whybox b{color:var(--ink);font-weight:600}
.whybox div{font-size:1.05rem;font-weight:300;line-height:1.5}
/* המנה: אריח חציל, הטקסט בצבע האריח. */
.dishbox{background:var(--tile-dark);color:var(--on-tile-dark);border:var(--edge) solid var(--tile-edge);border-radius:0}
.dishbox .dish-hd,.dishbox .dish-txt,.dishbox .poi-cred,.dishbox .poi-cred a{color:var(--on-tile-dark)}
.dishbox .dish-hd strong{font-weight:300;font-size:1.35rem;display:block;margin-top:2px}
/* פעולות: רשת שני טורים, אייקון מעל המילה. */
.linkrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.linkrow>li{display:flex}
.linkrow .lbtn{flex:1;min-height:64px;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:6px;font-size:1rem}
.linkrow .lbtn .ic{width:22px;height:22px}
/* יומן סקר */
.dlog{background:var(--tile-pale);border:var(--edge) solid var(--tile-edge);padding:10px 12px;
  --ink-3:var(--ink-3-tile)}
.dlog-k{margin:0 0 4px;font-family:var(--f-ui);font-size:.8rem;font-weight:600;color:var(--ink-2)}
.dlog-loc{margin:4px 0 0;font-size:.82rem;color:var(--ink-3)}
.dlog .srcline{color:var(--ink-3)}
.dlog .srcline a{color:var(--ink)}

/* ---------- מסכים פנימיים (10-02) ---------- */
/* ה-h1 של נושאים, קטגוריה, מעברים, שמורים, מידע וחיפוש: אותה שפה טיפוגרפית של כותרות דקות וגדולות. */
.sec-head{font-family:var(--f-display);font-weight:200;font-size:clamp(2.2rem,11vw,3.6rem);line-height:1.02;
  letter-spacing:-.015em;color:var(--ink);border-bottom:0;padding-bottom:0;margin-bottom:14px;flex-wrap:wrap;align-items:baseline}
.sec-head .cnt{font-family:var(--f-ui);font-size:.86rem;font-weight:500;color:var(--ink-3);background:none;border:0;padding:0;border-radius:0}
/* אריחים ממוסגרים: נושאים, עובדות המידע, כרטיסי מעבר, כרטיס הטיול, מצבים ריקים. */
.topic,.fact,.tr-card,.tr-ticket,.tr-empty,.notecard,.empty,.detail-empty,.tr-link{
  border:var(--edge) solid var(--tile-edge);border-radius:0;box-shadow:none;
  --ink-3:var(--ink-3-tile);--ink-3-card:var(--ink-3-tile);--jade-ink:var(--jade-tile);--gold-ink:var(--gold-tile);--rose:var(--rose-tile)}
.topics,.facts{gap:6px}
.topic{background:var(--tile-pale)}
.topics>:nth-child(4n+1) .topic,.topics>.topic:nth-child(4n+1),
.topics>:nth-child(4n+4) .topic,.topics>.topic:nth-child(4n+4){background:var(--tile)}
@media (hover:hover) and (pointer:fine){.topic:hover:not(:disabled){border-color:var(--tile-edge);outline:2px solid var(--tile-edge);outline-offset:0}}
.topic-n{font-family:var(--f-display);font-weight:300;font-size:2rem;line-height:1}
.fact{background:var(--tile-pale)}
.fact b,.fact .fact-v{font-weight:300}
.fxline{font-weight:300;font-size:1.15rem}
.tr-card{background:var(--tile-pale);min-width:0}
/* min-width:0 — כתובת לטינית ארוכה בלי רווחים דחפה את הכרטיס 5px מעבר
   ל-320px@200% (באתר החי: 400px). */
.tr-card *{min-width:0;overflow-wrap:anywhere}
/* minmax(310px) קבוע ב-px: ב-320px נשארים 290px, והעמודה גלשה. min() מקטין אותה לרוחב הזמין. */
.tr-list{grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:6px}
.tr-list>li{min-width:0}
.tr-ticket{background:var(--tile)}
.tr-ticket-dot{border-radius:0}
.tr-link{background:var(--tile-pale)}
@media (hover:hover) and (pointer:fine){.tr-link:hover{border-color:var(--tile-edge);outline:2px solid var(--tile-edge);outline-offset:0}}
/* גלולות → אריחים מרובעים */
.tr-select{border-radius:0;border:var(--edge) solid var(--tile-edge)}
.tr-swap{border-radius:0;border:var(--edge) solid var(--tile-edge);background:var(--bg)}
.tr-go{border-radius:0}
.tr-sort-opt{border-radius:0;border:var(--edge) solid var(--tile-edge);background:var(--bg)}
.tr-sort-opt:has(input:checked){background:var(--tile-dark);color:var(--on-tile-dark);border-color:var(--tile-edge)}
.tr-sort-opt:has(:focus-visible){outline:3px solid var(--ink);outline-offset:2px}
.tr-mode{border-radius:0;background:var(--tile-dark);color:var(--on-tile-dark)}
.tr-verify{border-radius:0}
.tr-card .srcline{border-top-color:var(--tile-edge)}
.info-official .oflink{flex:1 1 12rem}
/* מצב ריק: אריח לילך עם הסבר. */
.empty,.detail-empty{background:var(--tile-pale);padding:28px 16px}
.empty svg,.detail-empty svg{width:36px;height:36px;stroke-width:1.2}

/* ---------- הגדרות ומפה (10-02) ---------- */
.set-hd{background:var(--bg);border:var(--edge) solid var(--tile-edge);border-bottom:0;border-radius:0}
.set-ttl{font-weight:200;font-size:2.2rem;line-height:1}
.set-body{background:var(--bg);border:var(--edge) solid var(--tile-edge);border-top:0;border-radius:0}
.seg{border-radius:0;border:var(--edge) solid var(--tile-edge);background:var(--bg)}
.seg button[aria-pressed="true"]{background:var(--tile-dark);color:var(--on-tile-dark)}
@media (hover:hover) and (pointer:fine){.seg button:hover:not([aria-pressed="true"]){background:var(--tile-pale)}}
.set-body #themeBtn{border:var(--edge) solid var(--tile-edge);border-radius:0;background:var(--tile-pale);color:var(--ink)}
.set-body #themeBtn[aria-pressed="true"]{background:var(--tile-dark);color:var(--on-tile-dark)}
.set-row-lbl{color:var(--ink-2)}
/* המפה: הידית של הגיליון נשארת (אפורדנס גרירה); תמונות הרשימה מרובעות.
   סמני Leaflet ועיגולי הפוקוס שלהם נשארים עגולים — הם מידע גיאוגרפי. */
.rail-thumb{border-radius:0}

/* ---------- תיקוני finish review (10-03) ---------- */
/* "הטיול במבט": בטלפון 2×2, כך שתאריך ותווית לא נשברים; ארבע עמודות רק
   כשיש רוחב. קישורי הממשלה זה לצד זה בטלפון, רבע-רבע בדסקטופ. */
.mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.mgrid .mt-s2{grid-column:span 1}
